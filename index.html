<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DeskPrep — Quant Interview Prep</title>
<style>
  :root {
    color-scheme: dark;
    --page:        #0d0d0d;
    --surface:     #1a1a19;
    --surface-2:   #222221;
    --surface-3:   #2a2a28;
    --ink:         #ffffff;
    --ink-2:       #c3c2b7;
    --ink-muted:   #898781;
    --grid:        #2c2c2a;
    --baseline:    #383835;
    --border:      rgba(255,255,255,0.10);
    --s1: #3987e5;  /* blue    */
    --s2: #d95926;  /* orange  */
    --s3: #199e70;  /* aqua    */
    --s4: #c98500;  /* yellow  */
    --s5: #d55181;  /* magenta */
    --s6: #008300;  /* green   */
    --s7: #9085e9;  /* violet  */
    --s8: #e66767;  /* red     */
    --good:     #0ca30c;
    --warning:  #fab219;
    --serious:  #ec835a;
    --critical: #d03b3b;
    --bid:  #0ca30c;
    --ask:  #d03b3b;
    --mono: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", sans-serif;
    --radius: 10px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--page);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: rgba(57,135,229,.35); }

  /* ---------- App chrome ---------- */
  .topbar {
    position: sticky; top: 0; z-index: 50;
    display: flex; align-items: center; gap: 20px;
    padding: 0 22px; height: 56px;
    background: rgba(13,13,13,.92);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border);
  }
  .logo { display: flex; align-items: baseline; gap: 8px; font-weight: 700; letter-spacing: .5px; white-space: nowrap; }
  .logo .tick { color: var(--s1); font-family: var(--mono); }
  .logo .sub { font-size: 11px; color: var(--ink-muted); font-weight: 500; letter-spacing: 1.2px; text-transform: uppercase; }
  nav.tabs { display: flex; gap: 4px; flex: 1; }
  .tab-btn {
    appearance: none; border: 0; background: transparent; color: var(--ink-2);
    font: 600 14px var(--sans); padding: 8px 14px; border-radius: 8px; cursor: pointer;
    transition: background .12s, color .12s;
  }
  .tab-btn:hover { background: var(--surface-2); color: var(--ink); }
  .tab-btn.active { background: var(--surface-3); color: var(--ink); box-shadow: inset 0 0 0 1px var(--border); }
  .session-pill {
    font: 500 12px var(--mono); color: var(--ink-muted);
    border: 1px solid var(--border); border-radius: 999px; padding: 4px 12px; white-space: nowrap;
  }
  .session-pill b { color: var(--ink-2); }

  main { max-width: 1180px; margin: 0 auto; padding: 26px 22px 80px; }
  section.view { display: none; }
  section.view.active { display: block; }

  h1 { font-size: 26px; font-weight: 750; letter-spacing: -.3px; }
  h2 { font-size: 19px; font-weight: 700; margin-bottom: 4px; }
  h3 { font-size: 15px; font-weight: 700; }
  .lede { color: var(--ink-2); max-width: 72ch; margin-top: 6px; }
  .muted { color: var(--ink-muted); }
  .small { font-size: 12.5px; }
  .mono { font-family: var(--mono); }
  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .spread { justify-content: space-between; }
  .mt8 { margin-top: 8px; } .mt16 { margin-top: 16px; } .mt24 { margin-top: 24px; } .mt32 { margin-top: 32px; }

  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 18px 20px;
  }
  .card.pad-sm { padding: 12px 14px; }

  .btn {
    appearance: none; cursor: pointer; border-radius: 8px;
    border: 1px solid var(--border); background: var(--surface-2); color: var(--ink);
    font: 600 13.5px var(--sans); padding: 8px 14px;
    transition: background .12s, border-color .12s, transform .05s;
  }
  .btn:hover { background: var(--surface-3); }
  .btn:active { transform: translateY(1px); }
  .btn.primary { background: var(--s1); border-color: transparent; color: #fff; }
  .btn.primary:hover { filter: brightness(1.1); }
  .btn.danger { background: var(--critical); border-color: transparent; color: #fff; }
  .btn.ghost { background: transparent; }
  .btn.sm { padding: 5px 10px; font-size: 12.5px; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn.bidb { background: rgba(12,163,12,.16); border-color: rgba(12,163,12,.5); }
  .btn.askb { background: rgba(208,59,59,.16); border-color: rgba(208,59,59,.5); }

  .badge {
    display: inline-flex; align-items: center; gap: 5px;
    font: 600 11px var(--sans); letter-spacing: .3px;
    padding: 2.5px 9px; border-radius: 999px;
    border: 1px solid var(--border); color: var(--ink-2); background: var(--surface-2);
    white-space: nowrap;
  }
  .badge .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
  .badge.easy   { color: #7fd97f; }
  .badge.medium { color: #f4c95d; }
  .badge.hard   { color: #f09a9a; }
  .badge.firm   { color: var(--ink-2); }

  select, input[type=text], input[type=number] {
    background: var(--surface-2); color: var(--ink);
    border: 1px solid var(--border); border-radius: 8px;
    font: 500 13.5px var(--sans); padding: 7px 10px; outline: none;
  }
  select:focus, input:focus { border-color: var(--s1); }
  input[type=number].qty { width: 90px; font-family: var(--mono); }
  input[type=range] { accent-color: var(--s1); }

  /* ---------- Roadmap ---------- */
  .stage {
    position: relative; margin-top: 22px; padding-left: 34px;
  }
  .stage::before {
    content: ""; position: absolute; left: 11px; top: 34px; bottom: -12px;
    width: 2px; background: var(--baseline);
  }
  .stage:last-child::before { display: none; }
  .stage-head { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  .stage-num {
    position: absolute; left: 0; top: 2px;
    width: 24px; height: 24px; border-radius: 50%;
    background: var(--surface-3); border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font: 700 12px var(--mono); color: var(--ink-2);
  }
  .stage.done .stage-num { background: var(--s1); color: #fff; border-color: transparent; }
  .topic-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(255px, 1fr)); gap: 12px; }
  .topic-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 14px 16px; cursor: pointer; transition: border-color .12s, background .12s;
  }
  .topic-card:hover { border-color: rgba(255,255,255,.25); background: var(--surface-2); }
  .topic-card .t-name { font-weight: 700; font-size: 14px; display: flex; gap: 8px; align-items: center; }
  .topic-card .t-desc { color: var(--ink-muted); font-size: 12.5px; margin-top: 4px; min-height: 34px; }
  .progress-track { height: 5px; border-radius: 3px; background: var(--surface-3); overflow: hidden; margin-top: 10px; }
  .progress-fill { height: 100%; border-radius: 3px; background: var(--s1); width: 0%; transition: width .3s; }
  .t-meta { display: flex; justify-content: space-between; margin-top: 6px; font: 500 11.5px var(--mono); color: var(--ink-muted); }

  .firm-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
  .firm-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 15px 17px; }
  .firm-card h3 { display: flex; justify-content: space-between; align-items: baseline; }
  .firm-card .style { font: 500 11px var(--sans); color: var(--ink-muted); text-transform: uppercase; letter-spacing: .8px; }
  .firm-card p { color: var(--ink-2); font-size: 13px; margin-top: 6px; }
  .firm-card .weights { margin-top: 10px; display: flex; flex-direction: column; gap: 5px; }
  .wrow { display: grid; grid-template-columns: 130px 1fr; gap: 10px; align-items: center; font-size: 12px; color: var(--ink-2); }
  .wbar { height: 5px; border-radius: 3px; background: var(--surface-3); overflow: hidden; }
  .wbar i { display: block; height: 100%; background: var(--s1); border-radius: 3px; }

  /* ---------- Question bank ---------- */
  .filters { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 18px; }
  .qlist { margin-top: 16px; display: flex; flex-direction: column; gap: 10px; }
  .qrow {
    display: grid; grid-template-columns: 26px 1fr auto; gap: 14px; align-items: center;
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 13px 16px; cursor: pointer; transition: border-color .12s, background .12s;
  }
  .qrow:hover { border-color: rgba(255,255,255,.25); background: var(--surface-2); }
  .qrow .status-ic { font-size: 15px; text-align: center; }
  .qrow .q-title { font-weight: 600; font-size: 14px; }
  .qrow .q-tags { display: flex; gap: 6px; margin-top: 5px; flex-wrap: wrap; }
  .qrow .q-right { display: flex; gap: 6px; align-items: center; }

  /* question modal */
  .modal-scrim {
    position: fixed; inset: 0; z-index: 100; display: none;
    background: rgba(0,0,0,.62); backdrop-filter: blur(3px);
    align-items: flex-start; justify-content: center; overflow-y: auto; padding: 5vh 16px 6vh;
  }
  .modal-scrim.open { display: flex; }
  .modal {
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    max-width: 780px; width: 100%; padding: 26px 30px;
  }
  .modal .q-body { font-size: 15.5px; margin-top: 14px; color: var(--ink); line-height: 1.65; }
  .reveal-box {
    margin-top: 14px; border: 1px solid var(--border); border-radius: var(--radius);
    background: var(--surface-2); overflow: hidden;
  }
  .reveal-box > button {
    width: 100%; text-align: left; background: transparent; border: 0; color: var(--ink-2);
    font: 600 13.5px var(--sans); padding: 11px 15px; cursor: pointer;
  }
  .reveal-box > button:hover { color: var(--ink); }
  .reveal-content { display: none; padding: 4px 15px 15px; color: var(--ink-2); line-height: 1.65; font-size: 14px; white-space: pre-line; }
  .reveal-box.open .reveal-content { display: block; }
  .rate-row { display: flex; gap: 8px; margin-top: 18px; align-items: center; flex-wrap: wrap; }

  /* ---------- Coding ---------- */
  .code-layout { display: grid; grid-template-columns: 340px 1fr; gap: 16px; margin-top: 18px; }
  @media (max-width: 900px) { .code-layout { grid-template-columns: 1fr; } }
  .mode-switch {
    display: inline-flex; background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 999px; padding: 3px; gap: 2px;
  }
  .mode-switch button {
    appearance: none; border: 0; background: transparent; color: var(--ink-2);
    font: 650 13px var(--sans); padding: 6px 16px; border-radius: 999px; cursor: pointer;
  }
  .mode-switch button.active { background: var(--s1); color: #fff; }
  .prob-list { display: flex; flex-direction: column; gap: 8px; max-height: 640px; overflow-y: auto; }
  .prob-item {
    background: var(--surface); border: 1px solid var(--border); border-radius: 9px;
    padding: 10px 13px; cursor: pointer; transition: border-color .12s;
  }
  .prob-item:hover { border-color: rgba(255,255,255,.25); }
  .prob-item.sel { border-color: var(--s1); background: var(--surface-2); }
  .prob-item .p-name { font-weight: 650; font-size: 13.5px; display: flex; justify-content: space-between; gap: 8px; align-items: center; }
  .editor-wrap { border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; background: #141413; }
  .editor-head { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; background: var(--surface-2); border-bottom: 1px solid var(--border); }
  textarea.code {
    width: 100%; min-height: 300px; resize: vertical; border: 0; outline: none;
    background: #141413; color: #e8e6df; font: 13.5px/1.55 var(--mono);
    padding: 14px 16px; tab-size: 4; white-space: pre;
  }
  .test-results { margin-top: 12px; display: flex; flex-direction: column; gap: 6px; }
  .tcase {
    font: 500 13px var(--mono); border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 12px; background: var(--surface); display:flex; gap:10px; align-items: baseline; flex-wrap: wrap;
  }
  .tcase.pass { border-color: rgba(12,163,12,.55); }
  .tcase.fail { border-color: rgba(208,59,59,.6); }
  .tcase .tt { font-weight: 700; }
  .tcase.pass .tt { color: var(--good); }
  .tcase.fail .tt { color: var(--critical); }
  pre.io { background: #141413; border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; font: 12.5px/1.5 var(--mono); overflow-x: auto; color: var(--ink-2); white-space: pre-wrap; }
  .runner-status { font: 500 12px var(--mono); color: var(--ink-muted); }

  /* ---------- Trading floor ---------- */
  .game-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; margin-top: 18px; }
  .game-card {
    background: linear-gradient(180deg, var(--surface-2), var(--surface));
    border: 1px solid var(--border); border-radius: 14px; padding: 20px 22px; cursor: pointer;
    transition: border-color .12s, transform .12s;
  }
  .game-card:hover { border-color: rgba(255,255,255,.3); transform: translateY(-2px); }
  .game-card .g-icon { font-size: 26px; }
  .game-card h3 { margin-top: 10px; font-size: 16.5px; }
  .game-card p { color: var(--ink-2); font-size: 13px; margin-top: 6px; }
  .game-card .g-skills { margin-top: 12px; display: flex; gap: 6px; flex-wrap: wrap; }

  .game-stage { margin-top: 18px; }
  .game-head { display: flex; justify-content: space-between; align-items: center; gap: 14px; flex-wrap: wrap; }
  .stat-tiles { display: flex; gap: 10px; flex-wrap: wrap; }
  .stat-tile {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 8px 14px; min-width: 96px;
  }
  .stat-tile .k { font: 600 10.5px var(--sans); letter-spacing: .8px; text-transform: uppercase; color: var(--ink-muted); }
  .stat-tile .v { font: 650 17px var(--mono); margin-top: 1px; }
  .v.pos { color: var(--good); } .v.neg { color: var(--critical); }

  .quote-panel { display: flex; gap: 14px; align-items: flex-end; flex-wrap: wrap; margin-top: 14px; }
  .quote-field { display: flex; flex-direction: column; gap: 4px; }
  .quote-field label { font: 600 10.5px var(--sans); letter-spacing: .8px; text-transform: uppercase; color: var(--ink-muted); }
  .quote-field input { width: 110px; font-family: var(--mono); font-size: 15px; }
  .quote-field input.bid-in:focus { border-color: var(--good); }
  .quote-field input.ask-in:focus { border-color: var(--critical); }

  canvas.game-canvas { width: 100%; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); display: block; touch-action: none; }

  .tape {
    font: 12.5px/1.7 var(--mono); background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 10px 14px; height: 190px; overflow-y: auto;
  }
  .tape .t-buy  { color: #7fd97f; }
  .tape .t-sell { color: #f09a9a; }
  .tape .t-info { color: var(--ink-muted); }
  .tape .t-warn { color: var(--warning); }
  .tape .t-me   { color: #8db9ef; }

  .book { font: 12.5px/1.6 var(--mono); }
  .book table { width: 100%; border-collapse: collapse; }
  .book th { font: 600 10.5px var(--sans); letter-spacing: .8px; text-transform: uppercase; color: var(--ink-muted); text-align: right; padding: 3px 8px; border-bottom: 1px solid var(--border); }
  .book td { text-align: right; padding: 2.5px 8px; position: relative; }
  .book .bid-px { color: #7fd97f; font-weight: 650; }
  .book .ask-px { color: #f09a9a; font-weight: 650; }
  .book .mine { outline: 1px solid rgba(57,135,229,.6); border-radius: 3px; }
  .depth-bar { position: absolute; top: 2px; bottom: 2px; right: 0; opacity: .14; border-radius: 2px; }

  .dice-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
  .die {
    width: 44px; height: 44px; border-radius: 9px; display: flex; align-items: center; justify-content: center;
    font: 800 20px var(--mono); background: var(--surface-3); border: 1px solid var(--border); color: var(--ink-muted);
  }
  .die.revealed { background: #efeee8; color: #16160f; border-color: transparent; }

  .timer-big { font: 700 22px var(--mono); }
  .timer-big.low { color: var(--critical); }

  .two-col { display: grid; grid-template-columns: 1fr 340px; gap: 16px; align-items: start; }
  @media (max-width: 980px) { .two-col { grid-template-columns: 1fr; } }

  .note { border-left: 3px solid var(--s1); padding: 8px 14px; background: var(--surface-2); border-radius: 0 8px 8px 0; color: var(--ink-2); font-size: 13px; }
  .kbd { font: 600 11.5px var(--mono); border: 1px solid var(--border); border-bottom-width: 2px; border-radius: 5px; padding: 1px 6px; background: var(--surface-2); color: var(--ink-2); }

  /* ---------- answer checking ---------- */
  .ans-card {
    margin-top: 16px; padding: 14px 16px; border-radius: var(--radius);
    border: 1px solid rgba(57,135,229,.35); background: var(--surface-2);
  }
  .ans-card label { font: 600 10.5px var(--sans); letter-spacing: .8px; text-transform: uppercase; color: var(--ink-muted); }
  .ans-row2 { display: flex; gap: 8px; margin-top: 6px; flex-wrap: wrap; }
  .ans-row2 input { flex: 1; min-width: 160px; font-family: var(--mono); font-size: 15px; }
  .ans-fb { margin-top: 10px; font-size: 13.5px; display: none; padding: 9px 12px; border-radius: 8px; }
  .ans-fb.good { display: block; background: rgba(12,163,12,.12); border: 1px solid rgba(12,163,12,.45); color: #9fe09f; }
  .ans-fb.bad  { display: block; background: rgba(208,59,59,.10); border: 1px solid rgba(208,59,59,.45); color: #f0a5a5; }
  .ans-fb.near { display: block; background: rgba(250,178,25,.10); border: 1px solid rgba(250,178,25,.4); color: #f4cd7c; }
  .solved-chip { color: var(--good); font-weight: 700; }

  /* ---------- progress tab ---------- */
  .skill-rows { display: flex; flex-direction: column; gap: 9px; margin-top: 14px; }
  .skill-row { display: grid; grid-template-columns: 210px 1fr 120px auto; gap: 12px; align-items: center; }
  @media (max-width: 800px) { .skill-row { grid-template-columns: 140px 1fr 90px auto; } }
  .skill-row .nm { font-size: 13px; font-weight: 650; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .skill-track { height: 8px; border-radius: 4px; background: var(--surface-3); overflow: hidden; }
  .skill-fill { height: 100%; border-radius: 4px; background: var(--s1); }
  .skill-row .pct { font: 600 12px var(--mono); color: var(--ink-muted); }
  .queue-row {
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 9px;
    padding: 9px 13px; cursor: pointer; transition: border-color .12s;
  }
  .queue-row:hover { border-color: rgba(255,255,255,.25); }
  .act-row { display: flex; gap: 10px; font-size: 12.5px; color: var(--ink-2); padding: 4px 0; border-bottom: 1px solid var(--grid); }
  .act-row:last-child { border-bottom: 0; }
  .act-row .when { color: var(--ink-muted); font-family: var(--mono); font-size: 11.5px; min-width: 70px; }

  /* ---------- desk coach ---------- */
  .lint-strip {
    font: 500 12px var(--mono); padding: 6px 14px; color: var(--ink-muted);
    background: var(--surface-2); border-top: 1px solid var(--border);
  }
  .lint-strip.ok { color: #7fd97f; }
  .lint-strip.warn { color: var(--warning); }
  .lint-strip.bad { color: #f09a9a; }
  .coach-card {
    border: 1px solid rgba(57,135,229,.35); border-radius: var(--radius);
    background: var(--surface-2); padding: 14px 16px;
  }
  .chat-log {
    margin-top: 10px; max-height: 260px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 8px;
  }
  .chat-msg { max-width: 92%; }
  .chat-msg .who { font: 600 10px var(--sans); letter-spacing: .8px; text-transform: uppercase; color: var(--ink-muted); margin-bottom: 2px; }
  .chat-msg .body { font-size: 13px; line-height: 1.55; padding: 7px 11px; border-radius: 9px; white-space: pre-wrap; }
  .chat-msg.me { align-self: flex-end; }
  .chat-msg.me .body { background: rgba(57,135,229,.18); border: 1px solid rgba(57,135,229,.35); }
  .chat-msg.me .who { text-align: right; }
  .chat-msg.coach .body { background: var(--surface-3); border: 1px solid var(--border); }
  .coach-settings { margin-top: 10px; padding: 10px 12px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; }

  .result-banner { border-radius: var(--radius); padding: 16px 20px; margin-top: 14px; border: 1px solid var(--border); background: var(--surface-2); }
  .result-banner h3 { font-size: 16px; }
  .hidden { display: none !important; }
  a { color: #8db9ef; }
</style>
</head>

  { id: "mental",  stage: "s1", icon: "⚡", name: "Mental Math & Speed",            desc: "Fast, accurate arithmetic under a clock. Optiver's 80-in-8 style." },
  { id: "brain",   stage: "s1", icon: "🧩", name: "Brainteasers & Logic",            desc: "Classic puzzles that test structured reasoning, not tricks." },
  { id: "prob1",   stage: "s2", icon: "🎲", name: "Probability I · Counting & Bayes", desc: "Combinatorics, conditional probability, Bayes' rule." },
  { id: "prob2",   stage: "s2", icon: "Σ",  name: "Probability II · Expectation",     desc: "Linearity, indicators, variance, geometric tricks." },
  { id: "games",   stage: "s2", icon: "🃏", name: "Dice, Cards & Betting Games",      desc: "Fair values of games, rerolls, and simple optimal play." },
  { id: "markov",  stage: "s3", icon: "🔗", name: "Markov Chains & Random Walks",     desc: "Gambler's ruin, hitting times, pattern waiting times." },
  { id: "mart",    stage: "s3", icon: "⏱", name: "Martingales & Optimal Stopping",   desc: "Optional stopping, Wald, secretary-style decisions." },
  { id: "stats",   stage: "s3", icon: "📈", name: "Statistics & Regression",          desc: "Distributions, CLT, estimators, regression intuition." },
  { id: "gametheory", stage: "s4", icon: "♟", name: "Game Theory & Auctions",         desc: "Nash equilibria, auctions, winner's curse, adverse selection." },
  { id: "mm",      stage: "s4", icon: "⇄", name: "Market Making & Sizing",           desc: "Making markets on quantities, width, inventory, Kelly." },
  { id: "options", stage: "s4", icon: "𝜎", name: "Options & Finance",                desc: "Parity, Greeks intuition, no-arbitrage, the rule of 16." },

/* diff: 1 easy, 2 medium, 3 hard */
const QUESTIONS = [

/* ---------- Mental math ---------- */
{ id:"m1", topic:"mental", diff:1, ans:{"t":"n","v":391,"label":"17 × 23"}, firms:["optiver","imc","sig"], title:"17 × 23, in your head",
  prompt:"Compute 17 × 23 mentally. Then explain the general trick you used, and use it again on 34 × 26.",
  hint:"Both numbers are equidistant from a round number.",
  solution:"17 × 23 = (20 − 3)(20 + 3) = 400 − 9 = 391.\nDifference of squares: (a−b)(a+b) = a² − b². Any pair symmetric around a round number is instant.\n34 × 26 = (30 + 4)(30 − 4) = 900 − 16 = 884.\nInterview point: firms like Optiver want this in ~3 seconds. Drill symmetric pairs until automatic." },
{ id:"m2", topic:"mental", diff:1, ans:{"t":"n","v":2304,"label":"48²"}, firms:["optiver","imc"], title:"48² fast",
  prompt:"Compute 48² mentally, then 52², then explain why the two answers are related.",
  hint:"(50 ± 2)².",
  solution:"48² = (50 − 2)² = 2500 − 200 + 4 = 2304.\n52² = (50 + 2)² = 2500 + 200 + 4 = 2704.\nThey differ by 400 = 2 × (48 + 52) ÷ ... more usefully: consecutive-ish squares around a base differ by 4ab = 4·50·2 = 400.\nGeneral tool: (a ± b)² = a² ± 2ab + b². Base everything on 50s and 100s." },
{ id:"m3", topic:"mental", diff:1, ans:{"t":"n","v":84,"label":"3.5% of 2,400"}, firms:["optiver","sig"], title:"3.5% of 2,400",
  prompt:"What is 3.5% of 2,400? Answer in under 5 seconds, then describe your decomposition.",
  hint:"Split into 1% pieces.",
  solution:"1% of 2400 = 24. So 3% = 72 and 0.5% = 12. Total = 84.\nPercent questions decompose into 1%, 10%, 0.5% blocks. This shows up constantly in quoting: '3.5 vol points on 2,400 of vega' is the same arithmetic." },
{ id:"m4", topic:"mental", diff:1, ans:{"t":"n","v":0.4375,"label":"7/16 as a decimal"}, firms:["optiver","imc","js"], title:"7/16 as a decimal",
  prompt:"Convert 7/16 to a decimal exactly, mentally. Then give 13/16.",
  hint:"1/16 = 0.0625. Build up.",
  solution:"1/16 = 0.0625, so 7/16 = 7 × 0.0625 = 0.4375.\n13/16 = 0.8125 (= 1 − 3/16 = 1 − 0.1875).\nMemorize the sixteenths ladder: .0625 / .125 / .1875 / .25 / ... Old bond prices and many quoting drills use sixteenths and thirty-seconds." },
{ id:"m5", topic:"mental", diff:1, ans:{"t":"n","v":4838,"label":"41 × 39 + 79 × 41"}, firms:["optiver","js"], title:"41 × 39 + 79 × 41",
  prompt:"Compute 41 × 39 + 79 × 41 in your head.",
  hint:"Factor before you multiply.",
  solution:"Factor out 41: 41 × (39 + 79) = 41 × 118.\n41 × 118 = 41 × 120 − 41 × 2 = 4920 − 82 = 4838.\nLesson: scan for structure before doing any raw multiplication. Interviewers deliberately build questions where the naive path is slow." },
{ id:"m6", topic:"mental", diff:1, ans:{"t":"n","v":45.011,"rel":0.001,"label":"√2026"}, firms:["optiver","citadel"], title:"√2026 to two decimals",
  prompt:"Estimate √2026 to about two decimal places without a calculator.",
  hint:"You know a perfect square extremely close by.",
  solution:"45² = 2025, so √2026 ≈ 45 + 1/(2·45) = 45 + 0.0111 ≈ 45.01.\nLinearization: √(a² + ε) ≈ a + ε/2a. The same first-order Taylor trick prices small changes: it is exactly how you mentally adjust an option value for a small move." },

/* ---------- Brainteasers ---------- */
{ id:"b1", topic:"brain", diff:1, ans:{"t":"n","v":10,"label":"how many lockers end open"}, firms:["citadel","deshaw","jump"], title:"100 lockers",
  prompt:"100 closed lockers. Person k toggles every k-th locker (person 1 toggles all, person 2 toggles 2,4,6…, etc.) for k = 1…100. Which lockers end open?",
  hint:"A locker's final state depends on how many divisors its number has.",
  solution:"Locker n is toggled once per divisor of n. It ends open iff it is toggled an odd number of times, i.e. n has an odd number of divisors.\nDivisors pair up (d, n/d) except when d = n/d — a perfect square.\nOpen lockers: 1, 4, 9, 16, 25, 36, 49, 64, 81, 100 — the ten perfect squares." },
{ id:"b2", topic:"brain", diff:1, firms:["js","fiverings","jump"], title:"Two ropes, 45 minutes",
  prompt:"You have two ropes and a lighter. Each rope burns end-to-end in exactly 60 minutes but burns non-uniformly. Measure exactly 45 minutes.",
  hint:"Lighting both ends of a rope halves its burn time regardless of uniformity.",
  solution:"t = 0: light rope A at both ends and rope B at one end.\nt = 30: rope A finishes (both-ends burn = 30 min). Rope B has 30 minutes of burn left — now light B's other end.\nB's remaining 30 minutes halves to 15. When B finishes: t = 30 + 15 = 45.\nKey insight: 'both ends' halves remaining time no matter how irregular the rope is." },
{ id:"b3", topic:"brain", diff:2, ans:{"t":"n","v":7,"label":"minimum number of races"}, firms:["citadel","hrt","deshaw"], title:"25 horses, 5 tracks",
  prompt:"25 horses, a 5-lane track, no stopwatch — only finishing order. Minimum races to find the top 3?",
  hint:"After 5 heats and one race of winners, most horses are provably out.",
  solution:"7 races.\nRaces 1–5: five heats of 5. Race 6: the five heat winners. Label heats by their winner's finish A > B > C > D > E.\nHeat winner A is #1 overall. Candidates for #2/#3: A2, A3 (2nd/3rd in A's heat), B1, B2 (B and its runner-up), C1. Everyone else is beaten by ≥3 horses.\nRace 7: {A2, A3, B1, B2, C1} — top two finishers are overall #2 and #3.\nLower bound argument: 5 heats are forced, race 6 is needed to order winners, and after 6 races five candidates remain — one more race is necessary and sufficient." },
{ id:"b4", topic:"brain", diff:2, ans:{"t":"n","v":14,"label":"worst-case drops"}, firms:["js","citadel","hrt"], title:"Two eggs, 100 floors",
  prompt:"Two identical eggs, a 100-floor building. Find the highest safe floor with the fewest drops in the worst case. What's the optimal number and strategy?",
  hint:"Make the worst case equal no matter when the first egg breaks: decreasing gaps.",
  solution:"Answer: 14 drops.\nIf your first drop is floor k and the egg breaks, you scan 1…k−1 one by one: worst case k. To keep worst case constant, each next jump shrinks by 1: k + (k−1) + … + 1 ≥ 100 → k(k+1)/2 ≥ 100 → k = 14.\nStrategy: drop at 14, 27, 39, 50, 60, 69, 77, 84, 90, 95, 99, 100. After any break, walk up from the last safe floor.\nThis 'equalize the worst case' idea is the standard template for a whole family of search problems." },
{ id:"b5", topic:"brain", diff:2, ans:{"t":"n","v":98,"label":"coins the senior pirate keeps"}, firms:["fiverings","sig","deshaw"], title:"Five pirates, 100 coins",
  prompt:"Five perfectly rational pirates (strict seniority) split 100 gold coins. The most senior proposes a split; all vote (proposer included); majority or tie passes, otherwise the proposer is thrown overboard and the next proposes. Pirates value: staying alive, then gold, then seeing others die. What does the senior pirate propose?",
  hint:"Solve it backwards from 2 pirates.",
  solution:"Backward induction.\n2 pirates: senior proposes (100, 0) — his own vote ties, passes.\n3 pirates: pirate 3 offers pirate 1 a single coin (better than the 0 he'd get with two pirates left): (99, 0, 1).\n4 pirates: needs one more vote; buys pirate 2 (who gets 0 in the 3-pirate world): (99, 0, 1, 0) reading senior→junior.\n5 pirates: needs two votes besides his own; buys the two who get nothing in the 4-pirate world (pirates 3 and 1): (98, 0, 1, 0, 1).\nThe senior pirate keeps 98. The interview skill: backward induction and 'pay only the cheapest pivotal voters'." },
{ id:"b6", topic:"brain", diff:1, ans:{"t":"n","v":7.5,"label":"angle in degrees"}, firms:["optiver","imc","sig"], title:"Clock hands at 3:15",
  prompt:"What is the angle between the hour and minute hands at 3:15?",
  hint:"The hour hand moves too.",
  solution:"Minute hand at 15 min = 90°.\nHour hand: 3 hours + 15 min = 3.25 hours × 30°/hour = 97.5°.\nAngle = 97.5° − 90° = 7.5°.\nThe trap is forgetting the hour hand drifts 0.5° per minute. Follow-up they love: 'when after 3:00 do the hands coincide?' → 180/11 min ≈ 3:16:22." },

/* ---------- Probability I ---------- */
{ id:"p1", topic:"prob1", diff:1, ans:{"t":"n","v":0.18182,"rel":0.03,"pct":1,"label":"P(sum = 8 | at least one 6) — fraction or decimal"}, firms:["js","sig","citadel"], title:"Sum is 8, given a six",
  prompt:"Two fair dice are rolled. Given that at least one die shows a 6, what is the probability the sum is 8?",
  hint:"Count the conditioning set carefully — (6,6) is one outcome, not two.",
  solution:"Outcomes with at least one 6: 36 − 25 = 11.\nOf these, sum = 8: (2,6) and (6,2) → 2 outcomes.\nAnswer: 2/11.\nClassic trap: intuition says 'the other die must be a 2, so 1/6.' Wrong because 'at least one 6' is not the same as 'die #1 shows 6' — the conditioning set has 11 elements, not 12." },
{ id:"p2", topic:"prob1", diff:1, ans:{"t":"n","v":0.66667,"rel":0.02,"pct":1,"label":"P(other side red)"}, firms:["js","sig","fiverings"], title:"Three cards, one red face up",
  prompt:"Three cards: one red on both sides, one blue on both sides, one red/blue. Pick a card and side at random; you see red. What's the probability the other side is red?",
  hint:"Count red faces, not cards.",
  solution:"There are 3 red faces: two on the red-red card, one on the mixed card. Given you see a red face, each is equally likely.\n2 of the 3 red faces have red on the back.\nAnswer: 2/3.\nThe error path is 'it's either the RR or RB card, so 1/2' — that ignores that the RR card is twice as likely to show you red." },
{ id:"p3", topic:"prob1", diff:1, ans:{"t":"n","v":0.0045249,"rel":0.03,"pct":1,"label":"P(both aces)"}, firms:["citadel","deshaw"], title:"Two aces off the top",
  prompt:"You draw two cards from a shuffled 52-card deck. What is the probability both are aces? And the probability of at least one ace?",
  hint:"Sequential multiplication for the first; complement for the second.",
  solution:"Both aces: (4/52) × (3/51) = 12/2652 = 1/221 ≈ 0.45%.\nAt least one ace: 1 − P(no aces) = 1 − (48/52)(47/51) = 1 − 2256/2652 = 396/2652 ≈ 14.9%.\nHabit to build: 'at least one' should trigger the complement automatically." },
{ id:"p4", topic:"prob1", diff:1, ans:{"t":"n","v":0.25,"pct":1,"label":"P(no collision)"}, firms:["js","jump","hrt"], title:"Ants on a triangle",
  prompt:"Three ants sit on the corners of a triangle. Each simultaneously picks a random edge direction and walks along it. Probability of no collision?",
  hint:"Collisions are avoided only if they all rotate the same way.",
  solution:"Each ant picks one of 2 directions → 8 equally likely configurations.\nNo collision iff all go clockwise or all go counterclockwise: 2 configurations.\nAnswer: 2/8 = 1/4.\nFollow-up: n ants on an n-gon → 2/2ⁿ = 2^{1−n}." },
{ id:"p5", topic:"prob1", diff:1, ans:{"t":"n","v":0.5,"pct":1,"label":"P(disease | positive)"}, firms:["citadel","deshaw","sig"], title:"The 99% accurate test",
  prompt:"A disease affects 1% of a population. A test is 99% sensitive (detects the disease when present) and has a 1% false-positive rate. You test positive. Probability you have the disease?",
  hint:"Run 10,000 imaginary people through the test.",
  solution:"Per 10,000 people: 100 have the disease → 99 true positives. 9,900 don't → 99 false positives.\nP(disease | positive) = 99 / (99 + 99) = 1/2.\nA '99% accurate' test with 1% prevalence is a coin flip. Base rates dominate — the same logic tells you why a backtest with weak priors and a huge search space produces mostly false discoveries." },
{ id:"p6", topic:"prob1", diff:3, ans:{"t":"n","v":0.48148,"rel":0.02,"pct":1,"label":"P(both boys)"}, firms:["js","fiverings"], title:"Both children, one boy born on Tuesday",
  prompt:"A family has two children. You learn that at least one is a boy born on a Tuesday. What is the probability both are boys? (Assume boys/girls and weekdays are uniform and independent.)",
  hint:"Enumerate (sex, weekday) pairs for both children; the Tuesday detail changes the count.",
  solution:"Each child has 14 equally likely types (sex × weekday). Condition on 'at least one is (Boy, Tue)'.\nTotal such families: 14 + 14 − 1 = 27 (first child B-Tue: 14 choices for other; second child B-Tue: 14; subtract the double-counted both-B-Tue).\nBoth boys among them: first is B-Tue (7 choices of brother's day) + second is B-Tue (7) − both B-Tue (1) = 13.\nAnswer: 13/27 ≈ 0.481 — not 1/3.\nThe more specific the information about 'which' child, the closer the answer moves to 1/2. Great test of disciplined enumeration." },

/* ---------- Probability II ---------- */
{ id:"e1", topic:"prob2", diff:1, ans:{"t":"n","v":6,"label":"expected rolls"}, firms:["js","sig","optiver"], title:"Rolls until a six",
  prompt:"On average, how many rolls of a fair die until you see the first 6? Prove it two ways.",
  hint:"Geometric distribution — or set up a one-step recursion.",
  solution:"Answer: 6.\nWay 1: number of rolls is Geometric(1/6); mean = 1/p = 6.\nWay 2 (recursion): E = 1 + (5/6)E → E/6 = 1 → E = 6.\nThe recursion method generalizes to almost every 'expected time until X' question, so make sure you can produce it on demand." },
{ id:"e2", topic:"prob2", diff:1, ans:{"t":"n","v":4.25,"label":"expected value with optimal play"}, firms:["js","sig","fiverings"], title:"Die with one reroll",
  prompt:"Roll a fair die. You may keep the result or reroll once (you must keep the second roll). Playing optimally, what is the game's expected value?",
  hint:"Compare each first roll to the value of rerolling.",
  solution:"A reroll is worth E[die] = 3.5. So keep any first roll > 3.5, i.e. keep 4, 5, 6; reroll 1, 2, 3.\nEV = P(keep)·E[roll | keep] + P(reroll)·3.5 = (1/2)(5) + (1/2)(3.5) = 4.25.\nThis threshold structure — 'continue iff current value < value of continuing' — is the seed of every optimal-stopping question." },
{ id:"e3", topic:"prob2", diff:2, ans:{"t":"n","v":3.99,"abs":0.05,"label":"expected distinct faces"}, firms:["js","citadel","deshaw"], title:"Distinct faces in six rolls",
  prompt:"Roll a fair die 6 times. What is the expected number of distinct faces that appear?",
  hint:"Indicator per face + linearity.",
  solution:"Let Iₖ indicate face k appears. P(face k missing in 6 rolls) = (5/6)⁶ ≈ 0.335.\nE[distinct] = 6 × (1 − (5/6)⁶) ≈ 6 × 0.665 = 3.99.\nLinearity of expectation needs no independence — this is the single most-used trick in quant interviews. If your first instinct on any 'expected number of…' question isn't indicators, retrain it." },
{ id:"e4", topic:"prob2", diff:1, ans:{"t":"n","v":14.7,"abs":0.15,"label":"expected rolls to see all six"}, firms:["js","deshaw","hrt"], title:"Coupon collector, die edition",
  prompt:"Roll a die repeatedly. Expected number of rolls until you've seen all six faces?",
  hint:"Time to each 'new' face is geometric with a shrinking success probability.",
  solution:"After seeing k faces, P(new face) = (6−k)/6, so the wait is 6/(6−k).\nE = 6/6 + 6/5 + 6/4 + 6/3 + 6/2 + 6/1 = 6(1 + 1/2 + 1/3 + 1/4 + 1/5 + 1/6) = 14.7.\nGeneral form: n·Hₙ. Also worth knowing: the last coupon takes n rolls on average — as long as everything before it combined-ish." },
{ id:"e5", topic:"prob2", diff:2, ans:{"t":"n","v":0.5,"pct":1,"label":"P(passenger 100 gets own seat)"}, firms:["js","citadel","fiverings"], title:"The 100th passenger",
  prompt:"100 passengers board in order; passenger 1 lost his ticket and sits uniformly at random. Everyone else sits in their own seat if free, otherwise picks a random free seat. Probability passenger 100 gets his own seat?",
  hint:"Track only two special seats: #1 and #100.",
  solution:"Answer: 1/2.\nAt every random choice, the chooser is equally likely to pick seat 1 or seat 100 (both are symmetric: choosing either ends the cascade — seat 1 resolves everything in passenger 100's favor, seat 100 against). All other choices just pass the problem along.\nSo the process ends with seat 1 or seat 100 taken first, with equal probability → 1/2.\nSaying '1/2 by symmetry' is fine, but you must articulate WHICH symmetry, or the interviewer will push." },
{ id:"e6", topic:"prob2", diff:1, ans:{"t":"n","v":2.9167,"abs":0.06,"label":"Var of one die roll"}, firms:["citadel","deshaw","optiver"], title:"Variance of a die",
  prompt:"Compute the variance of one fair die roll. Then, without further computation, give the variance and standard deviation of the sum of 10 dice.",
  hint:"E[X²] first. Variances add for independent rolls.",
  solution:"E[X] = 3.5. E[X²] = (1+4+9+16+25+36)/6 = 91/6.\nVar = 91/6 − 12.25 = 35/12 ≈ 2.92.\nSum of 10 independent dice: Var = 350/12 ≈ 29.17, σ ≈ 5.4.\nWhy traders care: 'fair 35, σ ≈ 5.4' is exactly how you should size a market on the sum of 10 dice — width scales with σ, and σ scales with √n." },

/* ---------- Dice / cards / betting games ---------- */
{ id:"g1", topic:"games", diff:1, ans:{"t":"n","v":12.25,"label":"fair value ($)"}, firms:["js","optiver","sig"], title:"Price the product of two dice",
  prompt:"A game pays the product of two fair dice, in dollars. What's the fair price? What would you actually quote as a market maker?",
  hint:"Independence lets you multiply expectations.",
  solution:"Fair value: E[XY] = E[X]E[Y] = 3.5² = 12.25 (independence).\nAs a quote: you need width for variance. σ of the product ≈ 8.9 (E[X²Y²] = (91/6)² ≈ 230, Var ≈ 230 − 150 = 80). A market like 11.5 – 13 for small size is defensible; tighten with more flow, widen with size.\nInterviewers want: fair value fast, then unprompted awareness that a quote is fair value ± compensation for risk." },
{ id:"g2", topic:"games", diff:2, ans:{"t":"n","v":4.66667,"abs":0.05,"label":"EV with optimal play"}, firms:["js","fiverings","sig"], title:"Three rolls, keep the last",
  prompt:"Roll a die up to 3 times; after each roll you may stop and take that value, but if you roll again you lose the previous roll. Optimal strategy and EV?",
  hint:"Work backwards from the last roll.",
  solution:"Backward induction.\nRoll 3 alone is worth 3.5.\nRoll 2: keep if ≥ 4 (beats 3.5). Value = (1/2)(5) + (1/2)(3.5) = 4.25.\nRoll 1: keep if ≥ 5 (beats 4.25). Value = (2/6)(5.5) + (4/6)(4.25) = 11/6 + 17/6 = 14/3 ≈ 4.67.\nStrategy: keep 5–6 on roll 1; keep 4–6 on roll 2; take roll 3.\nNote the threshold rises the more chances remain — more optionality makes you pickier." },
{ id:"g3", topic:"games", diff:1, ans:{"t":"n","v":0.54545,"rel":0.02,"pct":1,"label":"P(7 before 8)"}, firms:["sig","optiver","imc"], title:"Seven before eight",
  prompt:"Roll two dice repeatedly. What's the probability a sum of 7 appears before a sum of 8?",
  hint:"Ignore every roll that is neither.",
  solution:"P(7) = 6/36, P(8) = 5/36. Conditional on the game ending this roll, P(7 first) = 6/(6+5) = 6/11 ≈ 0.545.\nAll other rolls are irrelevant — the geometric 'race' reduces to relative probabilities. This 'condition on a decisive trial' move kills a whole class of questions instantly." },
{ id:"g4", topic:"games", diff:2, firms:["js","sig"], title:"St. Petersburg, briefly",
  prompt:"A game: flip a fair coin until the first head, and get paid 2ⁿ dollars where n is the number of flips. The EV is infinite. How much would you actually pay to play once, and why?",
  hint:"Separate the EV computation from the decision — what matters for one play?",
  solution:"EV = Σ (1/2ⁿ)(2ⁿ) = 1 + 1 + 1 + … = ∞, but nobody pays more than ~$10-20. Good answers mention several of:\n• Bankroll/utility: log utility caps the certainty equivalent (for wealth W it's roughly log₂W + 2 dollars).\n• The counterparty can't pay 2⁵⁰ — truncating at a credible cap of 2ᵏ makes EV ≈ k + 1 dollars.\n• One-shot variance: median payoff is 2; you get ≤ 4 with prob 3/4.\nThe question tests whether you understand that price = f(EV, variance, credit, repetition), not EV alone. Traders live in the gap between expectation and what you can actually monetize." },
{ id:"g5", topic:"games", diff:2, ans:{"t":"n","v":0.5,"pct":1,"label":"win probability of the best strategy"}, firms:["fiverings","js","sig"], title:"Bet on the next card",
  prompt:"A shuffled deck is dealt face up one card at a time. Once, at any moment of your choosing (before any deal, based on everything seen), you must bet that the NEXT card is red. When should you bet to maximize the win probability?",
  hint:"Compute the value of betting now vs. waiting — or find the martingale.",
  solution:"It doesn't matter: every strategy wins with probability exactly 1/2.\nSlick proof: your strategy picks a stopping time; couple the game with 'bet that the LAST card is red' — the next card after your stop and the bottom card of the deck are exchangeable, and P(bottom card red) = 1/2 regardless of anything you observed.\nEquivalently, the proportion of reds remaining is a martingale — no stopping rule beats it.\nThis is the cleanest interview gateway to optional stopping: you cannot out-time a fair game." },

/* ---------- Markov ---------- */
{ id:"k1", topic:"markov", diff:1, ans:{"t":"n","v":0.3,"abs":0.01,"pct":1,"label":"P(reach $100), fair coin"}, firms:["js","citadel","deshaw"], title:"Gambler's ruin, fair coin",
  prompt:"You have $30 and bet $1 on fair coin flips until you hit $0 or $100. Probability you reach $100? What if the coin pays you with probability 0.49?",
  hint:"Fair case: find the martingale. Biased case: know the geometric formula.",
  solution:"Fair: wealth is a martingale, so E[final] = 30 = 100·p → p = 30%.\nBiased (p = 0.49): P(reach N from k) = (1 − (q/p)ᵏ)/(1 − (q/p)ᴺ) with q/p = 51/49 ≈ 1.0408.\n(q/p)³⁰ ≈ 3.32, (q/p)¹⁰⁰ ≈ 54.6 → P ≈ (1 − 3.32)/(1 − 54.6) ≈ 4.3%.\nThe brutal takeaway: a 1% edge against you turns 30% into ~4%. Small negative edges compound viciously — the entire logic of transaction costs in one formula." },
{ id:"k2", topic:"markov", diff:2, ans:{"t":"n","v":9,"label":"expected steps"}, firms:["js","hrt","jump"], title:"Time to leave [−3, 3]",
  prompt:"A symmetric ±1 random walk starts at 0. What is the expected number of steps until it hits +3 or −3?",
  hint:"Sₙ² − n is a martingale.",
  solution:"Answer: 9.\nSₙ² − n is a martingale; optional stopping at the exit time T: E[S_T²] = E[T]. Since |S_T| = 3 always, E[T] = 9.\nGeneral: exit time of (−a, b) has E[T] = ab. Worth memorizing — it anchors intuition that diffusion covers distance in time ∝ distance²." },
{ id:"k3", topic:"markov", diff:1, ans:{"t":"n","v":42,"label":"expected rolls for 66"}, firms:["js","sig","citadel"], title:"Waiting for HH, then for 66",
  prompt:"Expected number of fair coin flips to see HH (two heads in a row)? Then: expected die rolls to see two 6s in a row?",
  hint:"Set up states: 'no progress' and 'one head so far'.",
  solution:"States: E₀ (no progress), E₁ (just saw one H).\nE₀ = 1 + ½E₁ + ½E₀,  E₁ = 1 + ½·0 + ½E₀ → E₀ = 6.\nDice: E₀ = 1 + (1/6)E₁ + (5/6)E₀; E₁ = 1 + (5/6)E₀ → E₀ = 42.\nPattern for 'k-in-a-row of an outcome with prob 1/n': n + n² + … + nᵏ. So HH = 2 + 4 = 6, and 66 = 6 + 36 = 42.\nContrast question they love: waiting for HT is only 4 — order matters because of self-overlap." },
{ id:"k4", topic:"markov", diff:2, ans:{"t":"n","v":10,"label":"expected steps to opposite vertex"}, firms:["js","fiverings","hrt"], title:"Cube walk",
  prompt:"A particle random-walks on the vertices of a cube, moving to one of the 3 adjacent vertices each step uniformly. Expected number of steps to reach the opposite vertex?",
  hint:"Group vertices by distance from the start: 0, 1, 2, 3 edges away.",
  solution:"By symmetry, only the distance to the target vertex matters: d ∈ {0, 1, 2, 3} edges. Let E_d = expected steps to reach the target from distance d.\nFrom d = 1: one of 3 neighbors is the target, the other two are at d = 2 → E₁ = 1 + (2/3)E₂.\nFrom d = 2: two neighbors are at d = 1, one is at d = 3 → E₂ = 1 + (2/3)E₁ + (1/3)E₃.\nFrom d = 3 (the start): all three neighbors are at d = 2 → E₃ = 1 + E₂.\nSubstitute: E₂ = 1 + (2/3)E₁ + (1/3)(1 + E₂) → E₂ = 2 + E₁. Then E₁ = 1 + (2/3)(2 + E₁) → E₁ = 7, E₂ = 9, E₃ = 10.\nAnswer: 10 steps.\nSanity check: for random walks on regular graphs, expected return time to a vertex = number of vertices = 8; the antipode taking a bit longer than that feels right." },
{ id:"k5", topic:"markov", diff:1, ans:{"t":"n","v":0.4,"abs":0.01,"pct":1,"label":"long-run fraction of rainy days"}, firms:["citadel","jump","tower"], title:"Rain chain",
  prompt:"Weather is Markov: if it rains today, it rains tomorrow with prob 0.7; if dry, it rains tomorrow with prob 0.2. Long-run fraction of rainy days? And if it's raining Monday, what's P(rain Wednesday)?",
  hint:"Stationary distribution: flow in = flow out.",
  solution:"Stationary π: π·0.3 = (1−π)·0.2 → π = 0.4. It rains 40% of days in the long run.\nTwo-step from rain: P = 0.7·0.7 + 0.3·0.2 = 0.55.\nNote 0.55 is already drifting from 0.7 toward the stationary 0.4 — mixing at rate |0.7 − 0.2| = 0.5 per step (the second eigenvalue). Interviewers often probe whether you know the chain forgets its start geometrically fast." },

/* ---------- Martingales / stopping ---------- */
{ id:"mg1", topic:"mart", diff:2, ans:{"t":"n","v":7,"label":"expected payout ($)"}, firms:["js","deshaw"], title:"Wald's identity in one flip",
  prompt:"Flip a fair coin until the first head; call the number of flips N. You then roll N dice and get paid their sum. Expected payout? Justify carefully.",
  hint:"E[N] = 2. Why are you allowed to multiply?",
  solution:"E[payout] = E[N] × E[die] = 2 × 3.5 = 7.\nJustification is Wald's identity: for iid Xᵢ and a stopping time N (here N is even decided before any dice are rolled), E[X₁ + … + X_N] = E[N]·E[X].\nThe interviewer's follow-up: when does this FAIL? When N is NOT a stopping time — when it peeks at the future. Example: 'sum the rolls, but stop right before the first 6' has E[X | kept] ≠ 3.5, so the product formula breaks. Wald DOES still hold for rules like 'stop once the running sum exceeds 10', because that decision uses only the past. Knowing the boundary of the theorem — stopping time vs. clairvoyant time — is the point of the question." },
{ id:"mg2", topic:"mart", diff:2, ans:{"t":"n","v":10,"label":"expected flips"}, firms:["js","fiverings","deshaw"], title:"Expected flips until HTH",
  prompt:"What is the expected number of fair coin flips until the pattern HTH first appears? Solve it with the casino/martingale trick if you can.",
  hint:"Imagine a gambler starting at every flip, each betting the pattern letter-by-letter at fair odds.",
  solution:"Answer: 10.\nABRACADABRA argument: before each flip a new gambler arrives with $1 and bets it on 'this flip starts HTH', parlaying at fair odds. The total money in play is a martingale. When HTH completes at time T, surviving gamblers hold: the one who started at T−2 has $8 (won H, T, H), and the one who started at T (betting just 'H') holds $2. All others lost $1 each.\nOptional stopping: E[T] = total stakes = 8 + 2 = 10.\nRule: E[T] = Σ 2ᵏ over every prefix of the pattern that is also a suffix (here HTH itself and H).\nCross-check: HH gives 4 + 2 = 6 ✓, HT gives 4 ✓." },
{ id:"mg3", topic:"mart", diff:1, ans:{"t":"n","v":0.37,"abs":0.025,"pct":1,"label":"success probability"}, firms:["js","sig","fiverings"], title:"The secretary rule",
  prompt:"You'll see 100 candidates in random order, must accept or reject each immediately, and want the single best. What's the optimal strategy, and roughly the probability it succeeds?",
  hint:"Observe for a while, then take the first record-breaker.",
  solution:"Optimal: reject the first ~100/e ≈ 37 candidates, then accept the first one better than everything seen so far.\nSuccess probability → 1/e ≈ 37% (for the strategy with cutoff n/e).\nWhy it works: you succeed if the best is after the cutoff AND the best-before-it lands in the observation window; summing gives (r/n)·ln(n/r), maximized at r = n/e.\nTrading relevance: it's the cleanest model of 'when do I stop looking and act' — and the 37% number itself gets asked cold." },
{ id:"mg4", topic:"mart", diff:2, firms:["js","deshaw","citadel"], title:"Stop when you're ahead?",
  prompt:"You flip a fair coin, +$1 heads, −$1 tails, and plan to 'quit as soon as I'm up $1.' You'll succeed with probability 1. So is this a money machine? What's E[time], and what breaks in practice?",
  hint:"The walk hits +1 almost surely — but check the expected time and the required bankroll.",
  solution:"P(hit +1 eventually) = 1 for a symmetric walk, but E[time to hit +1] = ∞, and the strategy needs unbounded credit: before finishing you may be arbitrarily deep underwater (the minimum has heavy tails).\nOptional stopping doesn't apply because T is not 'nice' (unbounded, E[T] = ∞) — that's exactly why E[S_T] = 1 ≠ 0 = S₀ doesn't contradict the martingale property.\nWith any finite bankroll b, P(success) = b/(b+1) and the loss when ruined is −b: EV is exactly 0 again.\nThis is the mathematically honest version of 'martingale betting systems don't work,' and interviewers use it to test whether you really understand optional stopping's conditions." },
{ id:"mg5", topic:"mart", diff:2, firms:["sig","js"], title:"Pick the best envelope of two",
  prompt:"Two sealed envelopes contain different unknown numbers. You open one, see its value, and may keep it or switch. Can you beat 50% probability of ending with the larger number?",
  hint:"Introduce your own randomness: a threshold drawn from a distribution with full support.",
  solution:"Yes — Cover's trick. Draw your own threshold T from any distribution positive everywhere (e.g. exponential). Keep the opened value if it exceeds T, otherwise switch.\nIf both numbers are on the same side of T, you're at 50%. But with positive probability T lands strictly between them — and then you win for sure.\nOverall: strictly better than 1/2 against ANY pair of numbers.\nMoral traders love: injecting calibrated randomness can extract edge where none seems to exist; certainty about 'no information' is often wrong." },

/* ---------- Stats ---------- */
{ id:"s1", topic:"stats", diff:1, ans:{"t":"n","v":0.5,"pct":1,"label":"P(X > 2Y)"}, firms:["citadel","deshaw","js"], title:"P(X > 2Y) for standard normals",
  prompt:"X and Y are independent standard normals. What is P(X > 2Y)? What about P(X > 2Y + 1)?",
  hint:"X − 2Y is itself normal.",
  solution:"X − 2Y ~ N(0, 1 + 4) = N(0, 5). By symmetry about 0: P(X − 2Y > 0) = 1/2.\nSecond part: P(N(0,5) > 1) = P(Z > 1/√5) = P(Z > 0.447) ≈ 0.327.\nAny linear combination of independent normals is normal — recognizing 'this reduces to one normal' is the entire question." },
{ id:"s2", topic:"stats", diff:1, ans:{"t":"n","v":0,"abs":0.001,"label":"Corr(X, X²)"}, firms:["deshaw","citadel","hrt"], title:"Uncorrelated but dependent",
  prompt:"X ~ N(0,1). What is the correlation between X and X²? Are they independent? Give the general lesson.",
  hint:"You need E[X·X²] = E[X³].",
  solution:"Cov(X, X²) = E[X³] − E[X]E[X²] = 0 − 0 = 0 (odd moments of a symmetric distribution vanish). Correlation = 0.\nBut they're maximally dependent — X² is a function of X.\nLesson: correlation only detects LINEAR relationships. In markets: returns are roughly uncorrelated day to day, but |returns| are strongly autocorrelated (vol clustering) — same structure as this toy example, and a favorite follow-up." },
{ id:"s3", topic:"stats", diff:2, ans:{"t":"n","v":1.0,"abs":0.02,"label":"slope of B on A"}, firms:["citadel","deshaw","tower"], title:"Regression beta from correlation",
  prompt:"Stock A's daily returns have volatility 2%, stock B's 4%, correlation 0.5. You regress B on A: what's the slope? What fraction of B's variance is explained? And the slope of A on B?",
  hint:"β = ρ·σ_B/σ_A. R² = ρ².",
  solution:"β(B on A) = ρ σ_B/σ_A = 0.5 × (4/2) = 1.0.\nR² = ρ² = 0.25 — only a quarter of B's variance is explained despite β = 1.\nA on B: β = 0.5 × (2/4) = 0.25 — NOT 1/1.0. The product of the two slopes is ρ² ≤ 1; regression is not invertible.\nHedging translation: to hedge 1 share of B you short 1 'unit' of A's return... but the hedge still leaves 75% of the variance. β tells you the hedge ratio; ρ² tells you if the hedge is any good." },
{ id:"s4", topic:"stats", diff:2, firms:["deshaw","citadel","js"], title:"MLE for Uniform[0, θ]",
  prompt:"You observe n iid draws from Uniform[0, θ]. What's the MLE of θ? Is it biased? How would you correct it?",
  hint:"The likelihood is (1/θ)ⁿ on θ ≥ max(xᵢ) — where is it maximized?",
  solution:"Likelihood = θ⁻ⁿ · 1{θ ≥ max xᵢ}, decreasing in θ, so MLE = max(xᵢ).\nBiased low: E[max] = θ·n/(n+1) (the max of n uniforms sits at n/(n+1) of the range on average).\nUnbiased corrections: (n+1)/n · max, or the German-tank flavor max + max/n − ... (the classic 'German tank problem' estimator max·(1 + 1/n) − 1 in the discrete case).\nWhy quants ask it: it's the simplest case where the MLE sits ON the boundary of the data — good probe of whether you actually understand likelihoods vs. just memorized calculus." },
{ id:"s5", topic:"stats", diff:1, ans:{"t":"n","v":0.0017,"abs":0.0009,"pct":1,"label":"P(sum > 400)"}, firms:["citadel","optiver","imc"], title:"100 dice above 400",
  prompt:"Roll 100 dice. Estimate the probability the sum exceeds 400.",
  hint:"CLT. You'll want σ of one die ≈ 1.71.",
  solution:"Mean = 350. Var = 100 × 35/12 ≈ 291.7, σ ≈ 17.1.\nz = (400.5 − 350)/17.1 ≈ 2.96 (continuity correction; ≈2.93 without).\nP ≈ 0.15%–0.2%.\nBar to clear: know Φ tail landmarks cold — 1σ:16%, 2σ:2.3%, 3σ:0.13% — traders quote event probabilities off these constantly." },
{ id:"s6", topic:"stats", diff:1, ans:{"t":"n","v":0.66667,"rel":0.02,"label":"E[max(U, V)]"}, firms:["js","sig","hrt"], title:"Max and min of two uniforms",
  prompt:"U, V are independent Uniform[0,1]. Find E[max(U,V)] and E[min(U,V)], and the correlation sign between max and min.",
  hint:"P(max ≤ x) = x². Or use symmetry: max + min = U + V.",
  solution:"P(max ≤ x) = x² → density 2x → E[max] = 2/3.\nmax + min = U + V → E[min] = 1 − 2/3 = 1/3.\nCorrelation is positive: Cov(max,min) = E[UV] − (2/3)(1/3) = 1/4 − 2/9 = 1/36 > 0.\nOrder statistics of uniforms (k-th of n has mean k/(n+1)) power a surprising number of interview questions — memorize the k/(n+1) rule." },

/* ---------- Game theory ---------- */
{ id:"gt1", topic:"gametheory", diff:1, ans:{"t":"n","v":0,"abs":0.5,"label":"Nash equilibrium pick"}, firms:["fiverings","sig","js"], title:"Two-thirds of the average",
  prompt:"Everyone in a group picks a number in [0,100]; closest to ⅔ of the group average wins. What do you pick against perfectly rational players? Against a real room of interviewees?",
  hint:"Iterate the dominance argument — then ask how many steps real people iterate.",
  solution:"Rational: no one plays above 66.7 (⅔·100). If all ≤ 66.7, target ≤ 44.4; iterating drives everything to 0 — unique Nash equilibrium: everyone picks 0.\nReal rooms: level-1 players pick 33 (⅔ of 50), level-2 pick 22; empirical winners cluster around 15–25.\nThe interview answer: 'Nash is 0; against humans I'd pick ~20, because you profit from being exactly one step ahead of the field, not infinitely ahead.' That last sentence is the trading lesson." },
{ id:"gt2", topic:"gametheory", diff:2, ans:{"t":"n","v":0.5,"rel":0.02,"label":"bid as a fraction of your value"}, firms:["fiverings","citadel","deshaw"], title:"First-price auction, two bidders",
  prompt:"Two bidders with private values drawn iid Uniform[0,1] compete in a sealed-bid first-price auction. Find the symmetric equilibrium bidding strategy.",
  hint:"Guess b(v) = c·v and verify, or set up the win-probability tradeoff.",
  solution:"Equilibrium: bid half your value, b(v) = v/2.\nDerivation: if opponent bids βw with w ~ U[0,1], bidding b wins with prob P(βw < b) = b/β and profits (v − b): maximize (v−b)·b/β → b = v/2. Consistency forces β = 1/2 ✓.\nShading intuition: you trade off win probability against margin; with n bidders the equilibrium is b = v(n−1)/n — competition compresses margins toward value.\nMarket-making version: quoting aggressively wins more flow at worse prices — the auction shading tradeoff IS the spread-setting tradeoff." },
{ id:"gt3", topic:"gametheory", diff:1, firms:["sig","fiverings","js"], title:"The jar of coins auction",
  prompt:"An interviewer auctions a jar of coins. Everyone privately estimates its value and bids. Why does the winner usually lose money, and how should you bid?",
  hint:"Condition on the event 'my bid won'.",
  solution:"Winner's curse: estimates are value + noise, and the auction systematically selects the MOST optimistic estimate. Winning is bad news — conditional on winning, your estimate was likely the highest error.\nCorrect play: bid as if your estimate is the maximum of n draws, i.e. shade down E[value | my estimate is the highest], and shade MORE with more bidders (opposite of naive instinct).\nTrading version: getting filled instantly on your bid often means you're the most wrong person in the market at that moment — adverse selection is the winner's curse in continuous time. SIG explicitly teaches this in poker terms: 'if everyone folds to your raise, your raise was too small... if you always get called, too big.'" },
{ id:"gt4", topic:"gametheory", diff:2, ans:{"t":"n","v":0.5,"rel":0.02,"pct":1,"label":"equilibrium weight on PAPER"}, firms:["fiverings","sig","hrt"], title:"RPS where rock pays double",
  prompt:"Zero-sum rock-paper-scissors, except winning WITH ROCK pays $2 instead of $1 (other wins pay $1, ties nothing). Find the equilibrium mix.",
  hint:"Make your opponent indifferent between all three throws.",
  solution:"Let opponent play (r, p, s). Your payoffs: U(R) = 2s − p, U(P) = r − s, U(S) = p − 2r.\nIndifference: 2s − p = r − s = p − 2r with r + p + s = 1.\nFrom the first pair: 3s = r + p = 1 − s → s = 1/4. From the second: 3r = p + s = 1 − r → r = 1/4. So p = 1/2.\nEquilibrium: (rock, paper, scissors) = (¼, ½, ¼); game value 0.\nCounterintuition worth saying aloud: the rock bonus makes you play PAPER more (to tax opponent's rock) and rock no more than baseline — the equilibrium response to a juiced strategy is to defend against it, not to spam it." },
{ id:"gt5", topic:"gametheory", diff:1, ans:{"t":"n","v":1,"label":"flags to take on move 1"}, firms:["fiverings","jump","js"], title:"21 flags",
  prompt:"21 flags; players alternate taking 1–3 flags; whoever takes the last flag wins. Do you move first or second, and what's the strategy?",
  hint:"Which totals are losing positions?",
  solution:"Positions ≡ 0 (mod 4) are losing for the player to move. 21 mod 4 = 1, so move FIRST and take 1, leaving 20.\nThen mirror: whatever k your opponent takes, take 4 − k, marching 20 → 16 → 12 → 8 → 4 → 0.\nGeneral: with take 1..m, losing positions are multiples of m+1. Say the invariant, not just the move — interviewers grade the generalization." },

/* ---------- Market making ---------- */
{ id:"mm1", topic:"mm", diff:1, firms:["js","optiver","sig"], title:"Make me a market on NYC windows",
  prompt:"'Make me a market on the number of windows in Manhattan, in millions.' Walk through the full protocol: estimate, quote, and how you respond when the interviewer trades against you.",
  hint:"Fair value first, then width from your uncertainty, then update from their trade.",
  solution:"1) Fair value: ~1.6M residents in Manhattan, ~1M housing units, ~5 windows each ≈ 5M residential; offices/retail plausibly similar or more → order 10–20M. Say fair ≈ 15M.\n2) Quote around fair with width reflecting your σ: e.g. 10M bid / 20M ask. Never quote tighter than your honest uncertainty just to look confident.\n3) They lift your offer (buy at 20M): update — they may know it's higher. Re-quote higher and/or wider (e.g. 15/25), and smaller if unsure. If they keep lifting, keep moving: repeated one-way flow means you're wrong, not that they're generous.\n4) Endgame: be able to say what would change your fair (a fact about office window density, say).\nGraded on: sane decomposition, width ∝ uncertainty, correct direction of updates, no panic." },
{ id:"mm2", topic:"mm", diff:1, ans:{"t":"n","v":0.2,"rel":0.02,"pct":1,"label":"Kelly fraction"}, firms:["js","sig","citadel"], title:"Kelly, the two-line version",
  prompt:"A bet wins with p = 0.6 at even money. What fraction of bankroll does Kelly say to bet, what growth does it buy, and why do pros bet less than Kelly?",
  hint:"f* = p − q for even money.",
  solution:"Even-money Kelly: f* = p − q = 0.6 − 0.4 = 20% of bankroll.\nGrowth: g = p·ln(1+f) + q·ln(1−f); at f* ≈ 0.0201 per bet (~2% geometric growth).\nWhy bet half-Kelly: (a) p is estimated, and overbetting is punished more than underbetting (growth is concave with a cliff — betting 2× Kelly gives ZERO growth, beyond that negative); (b) drawdown tolerance: full Kelly has 50% chance of halving before doubling... roughly, painful swings; (c) parameter drift.\nThe asymmetry sentence — 'the penalty for oversizing exceeds the penalty for undersizing' — is the answer interviewers wait for." },
{ id:"mm3", topic:"mm", diff:2, ans:{"t":"n","v":35,"label":"fair value of the sum"}, firms:["optiver","imc","js"], title:"Width on the sum of 10 dice",
  prompt:"Make a market on the sum of 10 dice, one contract, then the interviewer says '100 contracts.' Fair value, your quote at each size, and the reasoning.",
  hint:"You computed σ ≈ 5.4 in the variance question. Width scales with size and risk.",
  solution:"Fair = 35, σ ≈ 5.4.\n1 contract: risk is trivial → quote tight to attract flow, e.g. 34 / 36.\n100 contracts: your P&L swing is 100 × (outcome − price); a 1σ move is ±540. Quote wider and skewed to where you'd manage inventory, e.g. 31 / 39, or quote a smaller size.\nStructure of a good answer: (i) fair value from linearity, (ii) width from σ × size and your risk appetite, (iii) explicitly say that width buys you protection against both variance and informed counterparties, (iv) offer to tighten if allowed to hedge or see flow." },
{ id:"mm4", topic:"mm", diff:2, ans:{"t":"n","v":60,"label":"tightest no-loss ASK"}, firms:["js","sig","citadel"], title:"Quoting against an informed trader",
  prompt:"A coin is fair with prob ½ and 60%-heads with prob ½. You must quote a two-sided market on 100 × P(heads). Your counterparty KNOWS the coin. What's the tightest market you can quote without expected loss, and what does this teach about spreads?",
  hint:"Your fair is 55. Their fair is either 50 or 60. Where must your bid and ask sit?",
  solution:"Unconditional fair = ½·50 + ½·60 = 55. The informed counterparty values the coin at exactly 50 or 60.\nIf your ask < 60 they buy only when it's the 60 coin — you lose (60 − ask) whenever they trade. If your bid > 50 they sell you the fair coin — you lose (bid − 50).\nZero-expected-loss market against pure informed flow: 50 bid / 60 ask — the spread must span every value the informed side might know.\nAgainst a MIX of informed and uninformed flow, you can quote inside 50/60: uninformed losses subsidize the spread (Glosten–Milgrom). The spread is not greed — it is exactly the insurance premium for trading with people who know more than you, which is why spreads widen when information risk rises (earnings, data prints) and tighten when flow is mostly noise." },
{ id:"mm5", topic:"mm", diff:2, firms:["optiver","imc","tower"], title:"You're getting lifted repeatedly",
  prompt:"You're quoting 99 / 101, size 10, on an asset you think is worth 100. The same counterparty lifts your offer three times in a row. Talk through exactly what you do and why.",
  hint:"Inventory, information, and the difference between the two.",
  solution:"After fill 1: you're short 10 at 101. Two forces: inventory (you want to buy back → shade quotes UP is wrong for inventory alone... careful: short inventory means you raise your bid to attract sellers... but information says the buyer may know it's worth more) — both point the same direction here: move the market UP.\nRe-quote e.g. 100/102. Fill 2 at 102: move again, 101/103, and consider cutting size. Fill 3: you are now short 30 into persistent informed-looking flow — move fair materially (maybe 103), widen, reduce size, and think about hedging/buying back some short even at a loss.\nThe skill being tested: (1) you always have a position after a fill and must requote off your NEW risk, (2) repeated one-way flow is information, (3) losses should be cut by updating fair, not defended by freezing.\nBonus point: markouts — check what price did AFTER each fill; consistent adverse markouts = you're the exit liquidity." },

/* ---------- Options ---------- */
{ id:"o1", topic:"options", diff:2, ans:{"t":"n","v":2,"label":"riskless profit per package ($)"}, firms:["sig","citadel","imc"], title:"Put-call parity arbitrage",
  prompt:"Same strike/expiry, zero rates: stock = 100, K = 100 call = 5, put = 3. Is there an arbitrage? Construct it and state the profit.",
  hint:"C − P should equal S − K (zero rates).",
  solution:"Parity: C − P = S − K = 0, but market says C − P = 2 → the call is rich vs. the put.\nConversion: sell call (+5), buy put (−3), buy stock (−100). Net outlay 98.\nAt expiry, either the call is assigned or you exercise the put — both deliver the stock at 100. Riskless profit: 100 − 98 = 2 per package (× carry adjustments = 0 here).\nParity is the one identity you must be able to deploy under pressure: C − P = S − PV(K) always, model-free, dividends adjusted via PV." },
{ id:"o2", topic:"options", diff:1, ans:{"t":"n","v":2,"rel":0.05,"label":"implied daily move at 32 vol (%)"}, firms:["sig","optiver","imc"], title:"Rule of 16",
  prompt:"A stock moves about 1% a day. Roughly what annualized volatility is that? A different name has 32 vol into earnings — what daily move is the market implying?",
  hint:"√252 ≈ 16.",
  solution:"Annual vol ≈ daily vol × √252 ≈ 1% × 15.9 ≈ 16%.\n32 vol → 32/16 = 2% implied daily move.\nThe 'rule of 16' converts between the vol quoted on screens and the daily move your intuition understands; every options desk interview touches it. Bonus: for a single earnings day, compare straddle price to the rest-of-month vol to isolate the event move." },
{ id:"o3", topic:"options", diff:2, firms:["sig","citadel","fiverings"], title:"Why is ATM delta about 0.5?",
  prompt:"Explain, without formulas first, why an at-the-money call has delta ≈ 0.5, why deep ITM → 1 and deep OTM → 0. Then connect delta to a probability, including the caveat.",
  hint:"Think of delta as a hedge ratio and as a moneyness probability.",
  solution:"Intuition: ATM, the option gains on the up-half of outcomes and loses nothing extra on the down-half — it responds to about half of the stock's moves. Deep ITM it behaves like stock (delta→1); deep OTM it barely responds (delta→0).\nDelta ≈ N(d₁) ≈ risk-neutral P(finish ITM) (which is N(d₂)) — close but not equal; the gap grows with vol and time (d₁ = d₂ + σ√T). ATM delta is actually slightly ABOVE 0.5 because the lognormal drift term shifts d₁ positive.\nSharp follow-up to expect: 'is delta the probability of finishing ITM?' Correct answer: 'approximately, but it overstates it; N(d₂) is the risk-neutral probability.'" },
{ id:"o4", topic:"options", diff:2, ans:{"t":"n","v":-1,"abs":0.01,"label":"cost of the 90/100/110 butterfly"}, firms:["sig","citadel","optiver"], title:"Butterfly says no-arb",
  prompt:"Calls, same expiry: K=90 → 12, K=100 → 7, K=110 → 1. Find the arbitrage and the rule it violates.",
  hint:"Call prices must be convex in strike.",
  solution:"Butterfly: buy 90C, sell 2× 100C, buy 110C. Cost = 12 − 14 + 1 = −1: you're PAID 1 to own it.\nPayoff of a long butterfly is ≥ 0 everywhere (tent peaking +10 at 100). Negative cost + nonnegative payoff = arbitrage.\nRule violated: convexity of calls in strike — C(100) ≤ ½[C(90) + C(110)] = 6.5, but C(100) = 7.\nThis is precisely the check a vol market maker's fitter runs across the whole strike ladder: butterflies ≥ 0 (convexity), call spreads between 0 and width (monotonicity) — the exact constraints in this app's vol-fitting game." },
{ id:"o5", topic:"options", diff:2, firms:["sig","imc","citadel"], title:"Digital as a call spread",

{ id:"m7", topic:"mental", diff:2, ans:{"t":"n","v":31,"label":"number of digits in 2^100"}, firms:["optiver","hrt","js"], title:"Digits of 2¹⁰⁰",
