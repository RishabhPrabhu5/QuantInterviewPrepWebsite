/* ============================================================
   p3_app.js — part 3 of 6. State, persistence, and three of the five views.
   ============================================================
   Sections below, in order:
     1. `state` + `Store`      the single state object and its localStorage wrapper
     2. helpers                $/$$ selectors, esc(), formatters, solved predicates
     3. tab router             switchView() — the only way views change
     4. answer checking        parseAnswer() / checkAnswer() / fmtExpected()
     5. Roadmap view           stages, topic cards, firm playbooks
     6. Question Bank view     filters, list, and the question modal
     7. voice sessions         receipt schema, parser, and the parallel score
     8. Progress view          skill scores, recommendations, review queue, I/O

   RENDERING MODEL. No framework and no reactivity: each view owns a render
   function that rebuilds its subtree from a template string and re-binds its
   listeners. Mutating `state` does nothing visible until you call the render
   function again — so every mutation site ends with an explicit
   `Store.save()` and the relevant re-render. All interpolated content goes
   through esc(), which covers & < > " (single quotes are not escaped, which
   is safe only because every attribute in this file is double-quoted).

   PERSISTENCE. `Store` keys off "deskprep_progress_v1" and feature-detects
   localStorage in a try/catch at definition time (`Store.ok`). Sandboxed
   previews block storage entirely, so every call site must tolerate ok ===
   false; the Progress tab surfaces a banner explaining the degraded mode.
   Bump the KEY string only alongside a migration, since old blobs are read
   with Object.assign and unknown fields are ignored.

   VOICE SESSIONS come from spoken mocks held outside this app, so they cross
   the gap as a receipt: one JSON blob per session, pasted into the Progress
   tab. parseVoiceReceipt() is deliberately tolerant (finds the first {...} in
   fenced or prose-wrapped text) but strict on content — an unknown topic id
   or outcome rejects the whole receipt rather than silently dropping a skill.
   Sessions merge by id, so re-pasting a corrected receipt updates in place.
   voiceSkill() is a SECOND score and never feeds topicSkill(): what you can
   talk through with a human is not what you can answer cold, and merging the
   two would hide that gap. The Progress tab prints them side by side and
   calls out topics logged in voice but never tested here.

   ANSWER CHECKING is the subtle part. parseAnswer() normalizes currency
   symbols, thousands separators, unicode minus, percents, k/M/B/T suffixes
   and fractions into a number plus a "was a percent" flag. checkAnswer()
   then builds a candidate list — the parsed value, plus value/100 when the
   spec is `pct` and the user typed a bare number — and accepts if any
   candidate lands in tolerance. Verdicts are ok | near | wrong | invalid;
   `near` exists so that a rounding slip reads differently from a wrong
   method. Tolerance rules, which the question data depends on:
     - t:"f"       within spec.factor either direction; 2x factor => near
     - integer v   exact, with a near band of max(1, 2%)
     - otherwise   max(abs, rel * |v|) with rel defaulting to 0.01

   SCORING. qSolved() is true if the checker was ever satisfied OR the user
   self-rated Good/Easy, so the bank is honor-system by design. topicSkill()
   blends both signals — first-try 1.0, eventual 0.7, miss 0.12, ratings
   0.1/0.45/0.85/1.0 — and takes the max when both exist. It returns null for
   untouched topics, which the Progress view renders separately rather than
   as a zero, so that "not tried" never looks like "failed".
   ============================================================ */
const state = {
  ratings: {},          // qid -> 1(again) 2(hard) 3(good) 4(easy)
  qstats: {},           // qid -> {att, ok, first}  (answer-check outcomes)
  codingStatus: {},     // pid -> 'passed' | 'attempted'
  codingAtt: {},        // pid -> run count
  drillBests: {},       // "<drill>:<mode>" -> {score}   (timed drills, p5b)
  voiceSessions: [],    // [{id, t, source, minutes, skills:[{topic,label,outcome,note}]}]
  history: [],          // [{t, kind:'q'|'code'|'drill'|'voice', id, ok}]
  pnlTotal: 0,
  view: "roadmap",
  bankFilters: { topic: "all", firm: "all", diff: "all", status: "all" },
};

const Store = {
  KEY: "deskprep_progress_v1",
  ok: (() => { try { localStorage.setItem("__t", "1"); localStorage.removeItem("__t"); return true; } catch (e) { return false; } })(),
  save() {
    if (!this.ok) return;
    try {
      localStorage.setItem(this.KEY, JSON.stringify({
        ratings: state.ratings, qstats: state.qstats, codingStatus: state.codingStatus,
        codingAtt: state.codingAtt, drillBests: state.drillBests,
        voiceSessions: state.voiceSessions,
        history: state.history.slice(-200), pnlTotal: state.pnlTotal,
        drafts: (typeof Coding !== "undefined") ? Coding.drafts : {},
      }));
    } catch (e) {}
  },
  load() {
    if (!this.ok) return;
    try {
      const d = JSON.parse(localStorage.getItem(this.KEY) || "null");
      if (!d) return;
      Object.assign(state.ratings, d.ratings || {});
      Object.assign(state.qstats, d.qstats || {});
      Object.assign(state.codingStatus, d.codingStatus || {});
      Object.assign(state.codingAtt, d.codingAtt || {});
      Object.assign(state.drillBests, d.drillBests || {});
      state.voiceSessions = d.voiceSessions || [];
      state.history = d.history || [];
      state.pnlTotal = d.pnlTotal || 0;
      this._drafts = d.drafts || {};
    } catch (e) {}
  },
  exportJson() {
    const blob = new Blob([JSON.stringify({
      ratings: state.ratings, qstats: state.qstats, codingStatus: state.codingStatus,
      codingAtt: state.codingAtt, drillBests: state.drillBests,
      voiceSessions: state.voiceSessions,
      history: state.history, pnlTotal: state.pnlTotal,
      drafts: (typeof Coding !== "undefined") ? Coding.drafts : {}, exported: new Date().toISOString(),
    }, null, 1)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "deskprep-progress.json";
    a.click();
    URL.revokeObjectURL(a.href);
  },
  importJson(file, done) {
    const r = new FileReader();
    r.onload = () => {
      try {
        const d = JSON.parse(r.result);
        Object.assign(state.ratings, d.ratings || {});
        Object.assign(state.qstats, d.qstats || {});
        Object.assign(state.codingStatus, d.codingStatus || {});
        Object.assign(state.codingAtt, d.codingAtt || {});
        Object.assign(state.drillBests, d.drillBests || {});
        if (d.voiceSessions) d.voiceSessions.forEach(v => mergeVoiceSession(v));
        state.history = d.history || state.history;
        state.pnlTotal = d.pnlTotal ?? state.pnlTotal;
        if (d.drafts && typeof Coding !== "undefined") Object.assign(Coding.drafts, d.drafts);
        this.save(); done(true);
      } catch (e) { done(false); }
    };
    r.readAsText(file);
  },
  reset() {
    state.ratings = {}; state.qstats = {}; state.codingStatus = {}; state.codingAtt = {};
    state.drillBests = {}; state.history = []; state.pnlTotal = 0;
    state.voiceSessions = [];
    if (typeof Coding !== "undefined") Coding.drafts = {};
    if (this.ok) try { localStorage.removeItem(this.KEY); } catch (e) {}
  },
};

/* ============================================================
   ANSWER CHECKING
   ============================================================ */
function parseAnswer(raw) {
  let s = String(raw).trim().toLowerCase().replace(/[$,\s]/g, "").replace(/−/g, "-");
  if (!s) return null;
  let pct = false;
  if (s.endsWith("%")) { pct = true; s = s.slice(0, -1); }
  let mult = 1;
  const sufMap = { k: 1e3, m: 1e6, mm: 1e6, b: 1e9, bn: 1e9, t: 1e12 };
  const sufMatch = s.match(/(k|mm|m|bn|b|t)$/);
  if (sufMatch && !/e[-+]?\d+$/.test(s)) { mult = sufMap[sufMatch[1]]; s = s.slice(0, -sufMatch[1].length); }
  let v;
  if (s.includes("/")) {
    const [a, b] = s.split("/");
    const na = parseFloat(a), nb = parseFloat(b);
    if (isNaN(na) || isNaN(nb) || nb === 0) return null;
    v = na / nb;
  } else {
    v = parseFloat(s);
    if (isNaN(v)) return null;
  }
  v *= mult;
  return { v, pct };
}

function checkAnswer(spec, raw) {
  const p = parseAnswer(raw);
  if (!p) return { verdict: "invalid" };
  const candidates = [p.pct ? p.v / 100 : p.v];
  if (spec.pct && !p.pct) candidates.push(p.v / 100);      // typed "18" meaning 18%
  if (spec.t === "f") {
    for (const c of candidates) {
      if (c > 0 && Math.max(c / spec.v, spec.v / c) <= spec.factor) return { verdict: "ok", val: c };
    }
    const c = candidates[0];
    if (c > 0 && Math.max(c / spec.v, spec.v / c) <= spec.factor * 2) return { verdict: "near", val: c };
    return { verdict: "wrong", val: c };
  }
  const isInt = Number.isInteger(spec.v) && spec.abs === undefined && spec.rel === undefined;
  const tol = isInt ? 1e-9 : Math.max(spec.abs ?? 0, (spec.rel ?? 0.01) * Math.abs(spec.v), 1e-9);
  for (const c of candidates) {
    if (Math.abs(c - spec.v) <= tol) return { verdict: "ok", val: c };
  }
  const best = candidates[0];
  const nearTol = isInt ? Math.max(1, Math.abs(spec.v) * 0.02) : tol * 1.8;
  if (Math.abs(best - spec.v) <= nearTol) return { verdict: "near", val: best };
  return { verdict: "wrong", val: best };
}

function fmtExpected(spec) {
  const v = spec.v;
  if (spec.t === "f") {
    if (v >= 1e9) return (v / 1e9) + "B";
    if (v >= 1e6) return (v / 1e6) + "M";
    if (v >= 1e3) return (v / 1e3) + "k";
    return String(v);
  }
  return Math.abs(v) < 0.01 && v !== 0 ? v.toPrecision(2) : String(Math.round(v * 10000) / 10000);
}

function topicProgress(tid) {
  const qs = QUESTIONS.filter(q => q.topic === tid);
  const done = qs.filter(qSolved).length;
  return { done, total: qs.length, pct: qs.length ? Math.round(100 * done / qs.length) : 0 };
}

function questionStatus(q) {
  if (qSolved(q)) return "done";
  const st = state.qstats[q.id];
  if ((st && st.att > 0) || state.ratings[q.id]) return "weak";
  return "new";
}

    <div class="rate-row">
      <span class="muted small">Self-rate the solve:&nbsp;</span>

    logEvent("q", q.id, +b.dataset.rate >= 3);

  const checkBtn = $("#ansCheck");
  if (checkBtn) {
    const doCheck = () => {
      const raw = $("#ansIn").value;
      if (!raw.trim()) return;
      const s = state.qstats[q.id] || (state.qstats[q.id] = { att: 0, ok: false, first: false });
      const res = checkAnswer(q.ans, raw);
      const fb = $("#ansFb");
      if (res.verdict === "invalid") {
        fb.className = "ans-fb near";
        fb.textContent = "Couldn't parse that — try a plain number, a fraction like 2/11, a percent like 18%, or 4.2M.";
        return;
      }
      s.att++;
      if (res.verdict === "ok") {
        s.ok = true; s.first = s.att === 1;
        logEvent("q", q.id, true);
        fb.className = "ans-fb good";
        fb.textContent = s.first
          ? "✓ Correct, first try. Read the solution anyway — the method matters as much as the number."
          : `✓ Correct (attempt ${s.att}). Open the solution and make sure your path was the clean one.`;

        logEvent("q", q.id, false);

        fb.textContent = s.att === 1
          ? "✗ Not it. Re-read the prompt for the trap, or take the hint."
          : "✗ Still off. This one's now in your review queue — take the hint, or study the solution and come back tomorrow.";
        Store.save(); renderQList();
      }
    };
    checkBtn.addEventListener("click", doCheck);
    $("#ansIn").addEventListener("keydown", e => { if (e.key === "Enter") doCheck(); });
    $("#ansIn").focus();
  }
}

/* ============================================================
   PROGRESS TAB — solved tracking + skill gaps
   ============================================================ */
function topicSkill(tid) {
  const qs = QUESTIONS.filter(q => q.topic === tid);
  let sum = 0, n = 0, attempted = 0;
  for (const q of qs) {
    const st = state.qstats[q.id];
    const r = state.ratings[q.id] || 0;
    let sig = null;
    if (st && st.att > 0) sig = st.ok ? (st.first ? 1 : 0.7) : 0.12;
    if (r) sig = Math.max(sig ?? 0, [0, 0.1, 0.45, 0.85, 1][r]);
    if (sig !== null) { sum += sig; n++; attempted++; }
  }
  return { score: n ? sum / n : null, attempted, total: qs.length };
}

/* ---- Voice sessions -------------------------------------------------------
   Spoken mock interviews happen outside this file (and outside this app), so
   they cross the gap as a "receipt": one JSON blob the interviewer emits at
   the end of a session, which the Progress tab ingests. Deliberately kept as
   a SECOND, parallel signal — voiceSkill() never feeds topicSkill(), because
   what you can talk through with a human is not what you can answer cold, and
   collapsing the two would hide exactly the gap worth seeing.
   Outcome weights mirror the bank's: unaided 1.0 down to a miss at 0.12.  */
const VOICE_OUTCOMES = {
  solid:    { w: 1.0,  label: "Solid",    hint: "answered unaided" },
  prompted: { w: 0.7,  label: "Prompted", hint: "got there with hints" },
  shaky:    { w: 0.45, label: "Shaky",    hint: "partial or slow" },
  learned:  { w: 0.3,  label: "Learned",  hint: "newly taught, untested" },
  missed:   { w: 0.12, label: "Missed",   hint: "couldn't do it" },
};

/* Paste-into-the-voice-chat contract. Kept here so the site is the single
   source of truth for the schema it parses. */
const VOICE_PROMPT = [
  "At the end of every session, output a JSON block in exactly this shape and nothing else inside it:",
  "",
  '{"deskprep_voice_session":1,',
  ' "id":"js-YYYY-MM-DD-1",',
  ' "date":"YYYY-MM-DD",',
  ' "source":"jane-street-voice",',
  ' "minutes":30,',
  ' "skills":[',
  '   {"topic":"prob2","label":"linearity of expectation","outcome":"solid","note":"one line of context"}',
  " ]}",
  "",
  "topic must be exactly one of: " + TOPICS.map(t => t.id).join(", "),
  "outcome must be exactly one of:",
  ...Object.keys(VOICE_OUTCOMES).map(k => "  " + k + " = " + VOICE_OUTCOMES[k].hint),
  "",
  "One entry per distinct skill exercised. Keep label under 40 characters.",
  "Give each session a unique id; re-emitting the same id overwrites that session rather than adding a duplicate.",
].join("\n");

/* Tolerant on the way in: the receipt is copied out of a chat, so it may
   arrive fenced, quoted, or with prose wrapped around it. */
function parseVoiceReceipt(text) {
  const errors = [], warnings = [];
  const raw = String(text || "").trim();
  if (!raw) return { ok: false, errors: ["Nothing pasted."], warnings };
  const a = raw.indexOf("{"), b = raw.lastIndexOf("}");
  if (a < 0 || b <= a) return { ok: false, errors: ["No JSON object found in the pasted text."], warnings };
  let d;
  try { d = JSON.parse(raw.slice(a, b + 1)); }
  catch (e) { return { ok: false, errors: ["That isn't valid JSON — " + e.message], warnings }; }

  if (!Array.isArray(d.skills) || !d.skills.length)
    return { ok: false, errors: ["Receipt has no `skills` array — nothing to record."], warnings };

  const skills = [];
  d.skills.forEach((sk, i) => {
    const where = "skill " + (i + 1);
    if (!sk || typeof sk !== "object") { errors.push(where + " is not an object."); return; }
    const topic = String(sk.topic || "").trim();
    const outcome = String(sk.outcome || "").trim().toLowerCase();
    if (!TOPICS.some(t => t.id === topic)) { errors.push(where + ': unknown topic "' + topic + '".'); return; }
    if (!VOICE_OUTCOMES[outcome]) { errors.push(where + ': unknown outcome "' + outcome + '".'); return; }
    const label = String(sk.label || "").trim().slice(0, 80);
    if (!label) warnings.push(where + " has no label.");
    skills.push({ topic, outcome, label: label || "(unlabelled)", note: String(sk.note || "").trim().slice(0, 240) });
  });
  if (errors.length) return { ok: false, errors, warnings };

  const parsed = Date.parse(String(d.date || "") + "T12:00:00");
  const session = {
    id: String(d.id || "").trim() || ("voice-" + Date.now()),
    t: isNaN(parsed) ? Date.now() : parsed,
    date: String(d.date || "").trim(),
    source: String(d.source || "voice").trim().slice(0, 40),
    minutes: Number(d.minutes) > 0 ? Math.round(Number(d.minutes)) : null,
    skills,
  };
  return { ok: true, session, errors, warnings };
}

/* Replace-by-id, so re-importing a corrected receipt updates in place. */
function mergeVoiceSession(v) {
  if (!v || !v.id || !Array.isArray(v.skills)) return false;
  const i = state.voiceSessions.findIndex(x => x.id === v.id);
  const replaced = i >= 0;
  if (replaced) state.voiceSessions[i] = v; else state.voiceSessions.push(v);
  state.voiceSessions.sort((x, y) => x.t - y.t);
  return replaced;
}

function voiceSkill(tid) {
  let sum = 0, n = 0, last = 0;
  const labels = [];
  for (const sess of state.voiceSessions) {
    for (const sk of sess.skills) {
      if (sk.topic !== tid) continue;
      const o = VOICE_OUTCOMES[sk.outcome];
      if (!o) continue;
      sum += o.w; n++;
      if (sess.t > last) last = sess.t;
      if (labels.length < 6 && !labels.includes(sk.label)) labels.push(sk.label);
    }
  }
  return { score: n ? sum / n : null, count: n, last, labels };
}

function relTime(t) {
  const d = Date.now() - t;
  if (d < 60e3) return "just now";
  if (d < 3600e3) return Math.floor(d / 60e3) + "m ago";
  if (d < 86400e3) return Math.floor(d / 3600e3) + "h ago";
  return Math.floor(d / 86400e3) + "d ago";
}

/* ============================================================
   p4_coding.js — part 4 of 6. The coding tab: problems, Python, and the coach.
   ============================================================
   Sections below, in order:
     1. *_SETUP strings     Python dataset generators for the Data & ML problems
     2. CODING_PROBLEMS     16 problems: 10 mode:"algo", 6 mode:"data"
     3. Runtime             lazy Pyodide loader with CDN fallbacks
     4. buildRunnerScript   generates the Python test harness
     5. Coach               hints, regex review, live lint, offline KB, Claude API
     6. Coding              the UI: problem list, editor, test results, drafts

   PROBLEM SHAPE (full field table in README.md):
     { id, mode, diff, title, desc, hints: [3], review: [{re, miss}],
       setup?, starter, solution, tests: [{call, expected, show, label?}] }
   `show: false` hides a test from the user but it still gates the pass. The
   function name the tests call is inferred from `starter` with /def\s+(\w+)/,
   so the starter signature is load-bearing — Coach.fnName() and the lint both
   depend on it.

   HOW A RUN WORKS. Runtime.init() injects pyodide.js from the first reachable
   CDN (jsDelivr 0.26.4, then two cdnjs mirrors) and caches the interpreter;
   data-mode problems additionally loadPackage(["numpy","pandas"]) once.
   buildRunnerScript() then emits a Python program that execs the problem's
   `setup` into a namespace `_g`, execs the user's code into that SAME
   namespace, and evals each test's `call` and `expected` as expressions with
   stdout redirected. Results come back as JSON.

     Comparison is _deep_eq: math.isclose(rel_tol=1e-6, abs_tol=1e-9) on
     numerics, recursive over lists/tuples/dicts, and bools compared exactly
     so that True never equals 1.

     Consequence of the shared namespace: the held-out truth arrays
     (_PETS_TRUTH, _RENT_TRUTH) are in scope for user code, so the MAE bars
     are defeatable by reading them. Accepted trade-off for a solo practice
     tool — it is honor-system in the same way the reference solutions are.

   DATASET DETERMINISM IS AN INVARIANT. The setup strings seed
   np.random.default_rng(7) for pets, (11) for ticks, (21) for rent, and every
   expected value in `tests` was computed from those exact streams. Changing a
   seed, the order of generation calls, or a row count silently invalidates the
   hard-coded expectations (ticks is checked against a literal
   {'n_good': 470, 'vwap': 100.64}) and the MAE bars. Re-derive all of them by
   RUNNING the reference solution if you touch a generator. The messiness is
   deliberate and mirrors real screens: mixed-case categoricals, -1/0/-999
   sentinels, NaNs, replayed duplicate rows, fat-fingered x100 prices.

   THE COACH degrades in three layers, so it is useful with no network at all:
     - lint()        real Python compile() through Pyodide once loaded, which
                     yields true SyntaxError line numbers; before that, bracket
                     balance checks. Debounced 900 ms on input.
     - offlineReply  staged hints, the per-problem `review` regex checklist,
                     pandas anti-pattern detection (iterrows, indexed row
                     loops), and the KB table of syntax answers.
     - claudeReply   optional user-supplied API key, held in memory only and
                     never persisted, posting straight to api.anthropic.com
                     with anthropic-dangerous-direct-browser-access. Any
                     failure falls back to the offline coach with an
                     explanation rather than breaking the panel.

   embedded and sandboxed previews block CDN scripts and package downloads

const PETS_SETUP = `
def _make_pets():
    rng = np.random.default_rng(7)
    n = 400
    species = rng.choice(['dog', 'cat', 'bird'], n, p=[.5, .4, .1])
    variants = {'dog': ['dog','Dog','DOG'], 'cat': ['cat','Cat','CAT'], 'bird': ['bird','Bird','BIRD']}
    disp = [variants[s][rng.integers(0, 3)] for s in species]
    age = rng.integers(1, 15, n).astype(float)
    weight = np.where(species == 'dog', rng.normal(25, 8, n), np.where(species == 'cat', rng.normal(4.5, 1, n), rng.normal(0.4, 0.1, n)))
    base = np.array([{'dog': 320, 'cat': 180, 'bird': 90}[s] for s in species])
    y1 = np.clip(base + 12 * age + rng.normal(0, 60, n), 0, None).round(0)
    y2 = np.clip(0.6 * y1 + 0.4 * (base + 12 * age) + rng.normal(0, 50, n), 0, None).round(0)
    df = pd.DataFrame({'pet_id': np.arange(n), 'species': disp, 'age_years': age,
                       'weight_kg': weight.round(1), 'y1_claims': y1, 'y2_claims': y2})
    bad_age = rng.choice(n, 40, replace=False); df.loc[bad_age, 'age_years'] = -1.0
    bad_w = rng.choice(n, 30, replace=False); df.loc[bad_w, 'weight_kg'] = np.nan
    bad_y1 = rng.choice(n, 25, replace=False); df.loc[bad_y1, 'y1_claims'] = np.nan
    train = df[df['pet_id'] < 320].copy()
    test = df[df['pet_id'] >= 320].copy()
    truth = test['y2_claims'].to_numpy()
    test = test.drop(columns=['y2_claims'])
    dup = train.sample(15, random_state=3)
    train = pd.concat([train, dup], ignore_index=True).sample(frac=1, random_state=4).reset_index(drop=True)
    return train, test, truth

PETS_TRAIN, PETS_TEST, _PETS_TRUTH = _make_pets()
PETS_NAIVE_MAE = float(np.mean(np.abs(_PETS_TRUTH - PETS_TRAIN['y2_claims'].mean())))

def pets_mae(fn):
    preds = np.asarray(fn(PETS_TRAIN.copy(), PETS_TEST.copy()), dtype=float)
    assert len(preds) == len(PETS_TEST), "prediction length mismatch"
    return float(np.mean(np.abs(preds - _PETS_TRUTH)))
`;

const TICKS_SETUP = `
def _make_ticks():
    rng = np.random.default_rng(11)
    n = 500
    t = np.sort(rng.integers(0, 3000, n))
    px = 100 + np.cumsum(rng.normal(0, 0.05, n))
    sz = rng.integers(1, 100, n).astype(float)
    df = pd.DataFrame({'t': t, 'px': px.round(2), 'sz': sz})
    bad = rng.choice(n, 25, replace=False)
    df.loc[bad[:10], 'px'] = -999.0
    df.loc[bad[10:18], 'px'] = 0.0
    df.loc[bad[18:], 'px'] = np.nan
    ff = rng.choice(np.setdiff1d(np.arange(n), bad), 5, replace=False)
    df.loc[ff, 'px'] = df.loc[ff, 'px'] * 100
    dup = df.sample(20, random_state=5)
    df = pd.concat([df, dup], ignore_index=True).sample(frac=1, random_state=9).reset_index(drop=True)
    return df

TICKS = _make_ticks()
`;

const RENT_SETUP = `
def _make_rent():
    rng = np.random.default_rng(21)
    n = 500
    nb = rng.choice(['downtown', 'midtown', 'uptown', 'suburbs'], n, p=[.3, .3, .2, .2])
    mess = {'downtown': ['downtown','Downtown',' DOWNTOWN'], 'midtown': ['midtown','Midtown ','MIDTOWN'],
            'uptown': ['uptown','Uptown','UPTOWN '], 'suburbs': ['suburbs',' Suburbs','SUBURBS']}
    nb_disp = [mess[x][rng.integers(0, 3)] for x in nb]
    sqft = np.clip(rng.normal(850, 280, n), 320, 2200).round(0)
    beds = np.clip((sqft / 420 + rng.normal(0, 0.5, n)).round(0), 0, 4)
    park_true = rng.random(n) < 0.4
    pk = np.array(['yes', 'no'])[(~park_true).astype(int)]
    pk = np.array([{'yes': ['yes','Y','YES'], 'no': ['no','N','NO']}[p][rng.integers(0, 3)] for p in pk], dtype=object)
    base = np.array([{'downtown': 1900, 'midtown': 1550, 'uptown': 1300, 'suburbs': 950}[x] for x in nb])
    rent = (base + 2.1 * sqft + 140 * beds + 300 * park_true + rng.normal(0, 130, n)).round(0)
    df = pd.DataFrame({'apt_id': np.arange(n), 'neighborhood': nb_disp, 'sqft': sqft, 'beds': beds, 'parking': pk, 'rent': rent})
    z = rng.choice(n, 35, replace=False); df.loc[z, 'sqft'] = 0.0
    pn = rng.choice(n, 30, replace=False); df.loc[pn, 'parking'] = None
    train = df[df['apt_id'] < 400].copy()
    test = df[df['apt_id'] >= 400].copy()
    truth = test['rent'].to_numpy()
    test = test.drop(columns=['rent'])
    return train, test, truth

RENT_TRAIN, RENT_TEST, _RENT_TRUTH = _make_rent()
RENT_NAIVE_MAE = float(np.mean(np.abs(_RENT_TRUTH - RENT_TRAIN['rent'].mean())))

def rent_mae(fn):
    preds = np.asarray(fn(RENT_TRAIN.copy(), RENT_TEST.copy()), dtype=float)
    assert len(preds) == len(RENT_TEST), "prediction length mismatch"
    return float(np.mean(np.abs(preds - _RENT_TRUTH)))
`;

{ id:"a1", mode:"algo", diff:1, title:"Two Sum (warmup)",
  desc:`Given a list of integers nums and an integer target, return the indices of the two numbers that add up to target, as a sorted list [i, j]. Exactly one solution exists; you may not use the same element twice.

  hints:[

    "Keep a dict mapping value → index as you scan. Before inserting x, check whether target − x is already in the dict.",
    "One pass: for i, x in enumerate(nums): if target − x in seen: return sorted([seen[target−x], i]); seen[x] = i."],
  review:[{re:"\\{|dict\\(", miss:"No dict in sight — the O(n) solution needs a value → index hash map."}],
  starter:`def two_sum(nums, target):
    # return sorted [i, j] with nums[i] + nums[j] == target
    pass
`,
  solution:`def two_sum(nums, target):
    seen = {}                      # value -> index
    for i, x in enumerate(nums):
        if target - x in seen:

  solution:`from collections import deque

def window_max(nums, k):
    dq, out = deque(), []          # indices, values decreasing
    for i, x in enumerate(nums):
        while dq and nums[dq[-1]] <= x:
            dq.pop()
        dq.append(i)
        if dq[0] <= i - k:
            dq.popleft()
        if i >= k - 1:
            out.append(nums[dq[0]])
    return out

  hints:[

    "A heap works: asks keyed (px, seq), bids keyed (−px, seq). Loop: while incoming qty > 0 and the best opposite order crosses, fill min(qty, resting qty) at the RESTING price.",

  solution:`import heapq

def match_orders(events):
    bids, asks, seq, trades = [], [], 0, []      # heaps: (key, seq, [qty], px)
    for side, px, qty in events:
        seq += 1
        if side == 'B':
            while qty > 0 and asks and asks[0][3] <= px:
                q = min(qty, asks[0][2][0])
                trades.append([asks[0][3], q])
                qty -= q; asks[0][2][0] -= q
                if asks[0][2][0] == 0: heapq.heappop(asks)
            if qty > 0: heapq.heappush(bids, (-px, seq, [qty], px))
        else:
            while qty > 0 and bids and bids[0][3] >= px:
                q = min(qty, bids[0][2][0])
                trades.append([bids[0][3], q])
                qty -= q; bids[0][2][0] -= q
                if bids[0][2][0] == 0: heapq.heappop(bids)
            if qty > 0: heapq.heappush(asks, (px, seq, [qty], px))
    return trades
`,

Target: O(n) time, O(1) space with two pointers (the O(n)-space prefix-max version is a warmup; say both).`,

    "if left_max <= right_max: water += left_max − h[l] (if positive); advance l. Mirror on the right."],
  review:[],
  starter:`def trap(height):

`,
  solution:`def trap(height):
    l, r = 0, len(height) - 1
    lmax = rmax = water = 0
    while l < r:
        if height[l] < height[r]:
            lmax = max(lmax, height[l])
            water += lmax - height[l]
            l += 1
        else:
            rmax = max(rmax, height[r])
            water += rmax - height[r]
            r -= 1
    return water
`,

  desc:`n tasks labeled 0…n−1; prereqs is a list of [a, b] meaning "b must run before a". Return True iff all tasks can be completed (i.e., the dependency graph has no cycle).

Example: n=2, [[1,0]] → True   ·   n=2, [[1,0],[0,1]] → False

Target: topological sort (Kahn's) or DFS coloring. Dependency-graph cycle detection shows up constantly in build systems and pricing-graph questions at Jump.`,
  hints:[

    "Kahn's algorithm: repeatedly remove nodes with in-degree 0. If you can remove all n, no cycle.",
    "Build adjacency + indegree arrays; BFS from all indegree-0 nodes; count processed == n."],
  review:[],
  starter:`from collections import deque

def can_finish(n, prereqs):
    pass
`,
  solution:`from collections import deque

def can_finish(n, prereqs):
    adj = [[] for _ in range(n)]
    indeg = [0] * n
    for a, b in prereqs:
        adj[b].append(a)
        indeg[a] += 1
    q = deque(i for i in range(n) if indeg[i] == 0)
    seen = 0
    while q:
        u = q.popleft(); seen += 1
        for v in adj[u]:
            indeg[v] -= 1
            if indeg[v] == 0: q.append(v)
    return seen == n
`,

    { call:"can_finish(5, [[0,1],[1,2],[2,0],[3,4]])",   expected:"False", show:false },

/* ---------- pyodide runtime management ---------- */
const Runtime = {
  pyodide: null, loading: null, pandasReady: false, source: null,
  CANDIDATES: [
    { indexURL: "https://cdn.jsdelivr.net/pyodide/v0.26.4/full/" },
    { indexURL: "https://cdnjs.cloudflare.com/ajax/libs/pyodide/0.26.4/" },
    { indexURL: "https://cdnjs.cloudflare.com/ajax/libs/pyodide/0.24.1/" },
  ],
  loadScript(src) {
    return new Promise((res, rej) => {
      const s = document.createElement("script");
      s.src = src; s.onload = res; s.onerror = () => rej(new Error("script load failed: " + src));
      document.head.appendChild(s);
    });
  },
  async init(statusCb) {
    if (this.pyodide) return this.pyodide;
    if (this.loading) return this.loading;
    this.loading = (async () => {
      let lastErr;
      for (const c of this.CANDIDATES) {
        try {
          statusCb("loading Python runtime… (" + new URL(c.indexURL).host + ")");
          await this.loadScript(c.indexURL + "pyodide.js");
          this.pyodide = await loadPyodide({ indexURL: c.indexURL });
          this.source = c.indexURL;
          return this.pyodide;
        } catch (e) { lastErr = e; }
      }
      throw lastErr || new Error("no pyodide source reachable");
    })();
    try { return await this.loading; } finally { this.loading = null; }
  },
  async ensurePandas(statusCb) {
    if (this.pandasReady) return true;
    statusCb("loading pandas + numpy (~15 MB, one time)…");
    try { await this.pyodide.loadPackage(["numpy", "pandas"]); this.pandasReady = true; return true; }
    catch (e) { return false; }
  },
};

function buildRunnerScript(userCode, tests, needPandas, setup) {
  return `
import json, math, io, contextlib
def _deep_eq(a, b):
    if isinstance(a, bool) or isinstance(b, bool):
        return a == b
    if isinstance(a, (int, float)) and isinstance(b, (int, float)):
        return math.isclose(float(a), float(b), rel_tol=1e-6, abs_tol=1e-9)
    if isinstance(a, (list, tuple)) and isinstance(b, (list, tuple)):
        return len(a) == len(b) and all(_deep_eq(x, y) for x, y in zip(a, b))
    if isinstance(a, dict) and isinstance(b, dict):
        return set(a) == set(b) and all(_deep_eq(a[k], b[k]) for k in a)
    return a == b

_g = {}
${needPandas ? 'exec("import pandas as pd\\nimport numpy as np", _g)' : ""}
_setup = ${JSON.stringify(setup || "")}
_src = ${JSON.stringify(userCode)}
_tests = json.loads(${JSON.stringify(JSON.stringify(tests.map(t => ({ call: t.call, expected: t.expected }))))})
_results = []
_err = None
try:
    if _setup:
        exec(_setup, _g)
except Exception as e:
    _err = "problem setup failed: " + type(e).__name__ + ": " + str(e)
if _err is None:
    try:
        exec(_src, _g)
    except Exception as e:
        _err = type(e).__name__ + ": " + str(e)
if _err is None:
    for _t in _tests:
        _buf = io.StringIO()
        try:
            with contextlib.redirect_stdout(_buf):
                _got = eval(_t["call"], _g)
                _exp = eval(_t["expected"], _g)
            _results.append({"ok": bool(_deep_eq(_got, _exp)), "got": repr(_got)[:300], "exp": repr(_exp)[:300], "out": _buf.getvalue()[:800]})
        except Exception as e:
            _results.append({"ok": False, "got": type(e).__name__ + ": " + str(e), "exp": _t["expected"], "out": _buf.getvalue()[:800]})
json.dumps({"error": _err, "results": _results})
`;
}

/* ============================================================
   DESK COACH — offline hints/lint/review + optional Claude API
   ============================================================ */
const Coach = {
  apiKey: null, model: "claude-sonnet-4-5", histories: {}, hintIdx: {}, busy: false,

  hist(pid) { return this.histories[pid] || (this.histories[pid] = []); },

  push(pid, role, text) {
    this.hist(pid).push({ role, text });
    this.renderLog(pid);
  },

  renderLog(pid) {
    const log = $("#coachLog"); if (!log) return;
    const h = this.hist(pid);
    log.innerHTML = h.length ? h.map(m =>
      `<div class="chat-msg ${m.role === "user" ? "me" : "coach"}"><div class="who">${m.role === "user" ? "you" : "coach"}</div><div class="body">${esc(m.text)}</div></div>`
    ).join("") : `<div class="muted small" style="padding:8px">Ask anything — syntax, approach, "why does my test fail". Use <b>Hint</b> for a staged nudge, <b>Review</b> for a checklist pass on your current code.</div>`;
    log.scrollTop = log.scrollHeight;
  },

  statusLabel() { return this.apiKey ? "Claude connected" : (window.claude && window.claude.complete) ? "Claude (built-in)" : "offline coach"; },

  giveHint(p) {
    const i = this.hintIdx[p.id] || 0;
    if (i < p.hints.length) {
      this.hintIdx[p.id] = i + 1;
      this.push(p.id, "coach", `Hint ${i + 1}/${p.hints.length}: ${p.hints[i]}`);
    } else {
      this.push(p.id, "coach", "That was the last hint. The reference solution is in the panel below the tests — read it, then rewrite it from memory; that's the drill that sticks.");
    }
  },

  reviewCode(p, code, lastResults) {
    if (code.trim() === p.starter.trim()) {
      this.push(p.id, "coach", "That's still the starter template — nothing to review yet. Sketch your approach in code (even pseudocode-ish) and I'll critique it, or hit 💡 Hint to get moving.");
      return;
    }
    const notes = [];
    if (!new RegExp("def\\s+" + this.fnName(p) + "\\s*\\(").test(code)) {
      notes.push(`I don't see \`def ${this.fnName(p)}(…)\` — the tests call exactly that name.`);
    }
    for (const r of (p.review || [])) {
      if (!new RegExp(r.re, "i").test(code)) notes.push(r.miss);
    }
    if (/\.iterrows\(/.test(code)) notes.push("iterrows() spotted — in an interview, vectorize it; row loops in pandas are what the screen is screening for.");
    if (p.mode === "data" && /for .* in .*range\(len/.test(code)) notes.push("Indexed row loop over the frame — try a vectorized or groupby formulation.");
    if (!/return/.test(code)) notes.push("No return statement yet.");
    if (lastResults && lastResults.failed > 0) notes.push(`Last run: ${lastResults.passed}/${lastResults.total} tests passed — look at the first failing 'got vs expected' pair; it usually names the bug.`);
    this.push(p.id, "coach", notes.length
      ? "Code review:\n• " + notes.join("\n• ")
      : "Structurally this looks on track — the ingredients I'd expect are all present. Run the tests; if something fails, bring me the got-vs-expected diff.");
  },

  fnName(p) { const m = p.starter.match(/def\s+(\w+)/); return m ? m[1] : "solve"; },

  KB: [
    { re: /group\s*by|groupby/i, a: "groupby patterns:\ndf.groupby('key')['col'].mean() → per-group stat\ndf.groupby('key')['col'].transform('median') → same length as df, great for imputation\ng = df.groupby('key').agg(n=('col','size'), avg=('col','mean'))" },
    { re: /merge|join/i, a: "df.merge(other, on='key', how='left') — how ∈ {left, inner, outer}. Column mismatch after merge is usually a dtype or whitespace issue in the key: check .str.strip() first." },
    { re: /dumm|one.?hot|categor/i, a: "pd.get_dummies(s) one-hots a Series. The interview trap: test data may lack some categories — align with .reindex(columns=train_dummies.columns, fill_value=0)." },
    { re: /lstsq|regress|linear|fit\b/i, a: "No sklearn needed:\nX = np.column_stack([np.ones(n), f1, f2, dummies])\nbeta, *_ = np.linalg.lstsq(X, y, rcond=None)\npreds = X_test @ beta\nRemember the intercept column of ones." },
    { re: /fillna|impute|missing|nan/i, a: "s.fillna(value) or s.fillna(s.median()). Group-aware: s.fillna(df.groupby('k')[col].transform('median')). Sentinels (−1, 0, −999) must be converted to NaN FIRST: d.loc[d.age < 0, 'age'] = np.nan." },
    { re: /duplicate|dedup/i, a: "df.drop_duplicates() → exact row dupes; df.drop_duplicates(subset='id', keep='first') → entity dupes. Do it before any aggregation or the dupes bias your stats." },
    { re: /rolling|moving avg|sma/i, a: "df['x'].rolling(w).mean() — NaN until the window fills; add min_periods=1 to change that. .rolling(w).max(), .std() etc. all exist." },
    { re: /heap|priority/i, a: "import heapq — min-heap only. Max-heap: push negated values. heappush(h, x), heappop(h), h[0] peeks. For (priority, tiebreak) push tuples — that's how you get price-time priority." },
    { re: /deque/i, a: "from collections import deque — O(1) append/pop at BOTH ends: append, appendleft, pop, popleft. It's the backbone of sliding-window-max and BFS." },
    { re: /sort/i, a: "sorted(xs, key=lambda t: (t[0], -t[1])) for multi-key. list.sort() is in-place. For 'best price then earliest time', sort by (price, seq) or use a heap with that tuple." },
    { re: /pct_change|return/i, a: "df['close'].pct_change() → simple returns (NaN first row). Log returns: np.log(df.close).diff()." },
    { re: /apply\b/i, a: ".apply(f) runs Python per row/element — slow and usually avoidable. Prefer vectorized ops, .map for dict lookups, np.where / np.select for conditionals." },
  ],

  offlineReply(p, msg) {
    const m = msg.toLowerCase();
    if (/hint|stuck|help me|where do i start|idk/.test(m)) { this.giveHint(p); return null; }
    if (/review|feedback|look at my|check my/.test(m)) { this.reviewCode(p, $("#codeArea").value, Coding.lastResults[p.id]); return null; }
    if (/solution|answer|give up/.test(m)) return "The full reference solution is in the collapsible panel under the test results. Honest advice: take one more hint first — you learn 5× more finishing it yourself.";
    for (const k of this.KB) if (k.re.test(m)) return k.a;
    return "Offline coach here — I can do staged hints (button above), a checklist review of your code, and syntax help (ask about: groupby, merge, dummies, lstsq, fillna, duplicates, rolling, heaps, deque, sorting). For free-form conversation, click ⚙ and connect a Claude API key — it stays in memory only and talks straight to api.anthropic.com from your browser.";
  },

  async claudeReply(p, msg) {
    const code = $("#codeArea").value;
    const lastR = Coding.lastResults[p.id];
    const sys = `You are Desk Coach, a quant-interview coding coach inside a practice app. Be Socratic and concise (<150 words): nudge toward the answer, name the concept, show at most 1-3 line snippets. Only give a full solution if the user explicitly insists after you've offered a hint. Problem "${p.title}":\n${p.desc}\n\nUser's current code:\n${code}\n\nLatest test results: ${lastR ? `${lastR.passed}/${lastR.total} passed. Failures: ${lastR.failSummary}` : "not run yet"}`;
    const messages = this.hist(p.id).slice(-12).map(m => ({ role: m.role === "user" ? "user" : "assistant", content: m.text }));
    if (!messages.length || messages[messages.length - 1].role !== "user") messages.push({ role: "user", content: msg });
    if (this.apiKey) {
      const r = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: {
          "content-type": "application/json",
          "x-api-key": this.apiKey,
          "anthropic-version": "2023-06-01",
          "anthropic-dangerous-direct-browser-access": "true",
        },
        body: JSON.stringify({ model: this.model, max_tokens: 700, system: sys, messages }),
      });
      if (!r.ok) throw new Error("API " + r.status + ": " + (await r.text()).slice(0, 160));
      const data = await r.json();
      return data.content.map(c => c.text || "").join("");
    }
    if (window.claude && window.claude.complete) {
      return await window.claude.complete(sys + "\n\nConversation:\n" + messages.map(m => m.role + ": " + m.content).join("\n") + "\nassistant:");
    }
    throw new Error("no engine");
  },

  async send(p, msg) {
    if (!msg.trim() || this.busy) return;
    this.push(p.id, "user", msg.trim());
    const hasAI = this.apiKey || (window.claude && window.claude.complete);
    if (!hasAI) {
      const reply = this.offlineReply(p, msg);
      if (reply) this.push(p.id, "coach", reply);
      return;
    }
    this.busy = true;
    this.push(p.id, "coach", "…");
    try {
      const reply = await this.claudeReply(p, msg);
      this.hist(p.id).pop();
      this.push(p.id, "coach", reply);
    } catch (e) {
      this.hist(p.id).pop();
      this.push(p.id, "coach", "API call failed (" + e.message + "). Falling back to offline mode — check the key in ⚙, and note browser keys need an Anthropic key with CORS access enabled.");
    } finally { this.busy = false; }
  },

  /* ---- live lint ---- */
  lintTimer: null,
  scheduleLint(p) {
    clearTimeout(this.lintTimer);
    this.lintTimer = setTimeout(() => this.lint(p), 900);
  },
  async lint(p) {
    const strip = $("#lintStrip"); if (!strip) return;
    const code = $("#codeArea").value;
    if (!code.trim()) { strip.textContent = "live review: waiting for code…"; strip.className = "lint-strip"; return; }
    const notes = [];
    if (Runtime.pyodide) {
      try {
        const res = await Runtime.pyodide.runPythonAsync(
          `import json\ntry:\n    compile(${JSON.stringify(code)}, "solution.py", "exec")\n    _r = {"ok": True}\nexcept SyntaxError as e:\n    _r = {"ok": False, "line": e.lineno, "msg": e.msg}\njson.dumps(_r)`);
        const r = JSON.parse(res);
        if (!r.ok) { strip.textContent = `✗ SyntaxError line ${r.line}: ${r.msg}`; strip.className = "lint-strip bad"; return; }
        notes.push("✓ parses");
      } catch (e) { notes.push("lint unavailable"); }
    } else {
      for (const [o, c] of [["(", ")"], ["[", "]"], ["{", "}"]]) {
        const no = code.split(o).length, nc = code.split(c).length;
        if (no !== nc) notes.push(`⚠ unbalanced ${o}${c}`);
      }
      if (!notes.length) notes.push("✓ basic checks (full syntax check after first run loads Python)");
    }
    if (!new RegExp("def\\s+" + this.fnName(p) + "\\s*\\(").test(code)) notes.push(`⚠ tests call ${this.fnName(p)}() — not defined yet`);
    if (/\.iterrows\(/.test(code)) notes.push("⚠ iterrows() — vectorize");
    strip.textContent = "live review: " + notes.join(" · ");
    strip.className = "lint-strip" + (notes.some(n => n.startsWith("⚠")) ? " warn" : " ok");
  },
};

        state.codingStatus[p.id] = "attempted";
        this.lastResults[p.id] = { passed: 0, failed: 1, total: p.tests.length, failSummary: data.error };
        logEvent("code", p.id, false); Store.save();
      } else {
        let passed = 0; const failParts = [];
        results.innerHTML = data.results.map((r, i) => {
          if (r.ok) passed++;
          const t = p.tests[i];
          const label = t.show ? esc(t.label || t.call) : (t.label ? esc(t.label) : "hidden test " + (i + 1));
          if (!r.ok) failParts.push(`${t.label || t.call}: got ${r.got} expected ${r.exp}`);
          return `<div class="tcase ${r.ok ? "pass" : "fail"}">
            <span class="tt">${r.ok ? "✓" : "✗"}</span><span>${label}</span>
            ${r.ok ? "" : `<span class="muted">got</span> <span>${esc(r.got)}</span> <span class="muted">expected</span> <span>${esc(r.exp)}</span>`}
            ${r.out ? `<span class="muted">stdout: ${esc(r.out.trim().slice(0, 200))}</span>` : ""}
          </div>`;
        }).join("");
        const all = passed === data.results.length;
        results.innerHTML += `<div class="tcase ${all ? "pass" : "fail"}"><span class="tt">${all ? "✓ ALL TESTS PASSED" : `✗ ${passed}/${data.results.length} passed`}</span></div>`;
        state.codingStatus[p.id] = all ? "passed" : "attempted";
        this.lastResults[p.id] = { passed, failed: data.results.length - passed, total: data.results.length, failSummary: failParts.slice(0, 3).join(" | ") };
        logEvent("code", p.id, all); Store.save();
        status("python ready");
        this.renderList(); updatePill();
      }
    } catch (e) {
      status("runtime unavailable");
      results.innerHTML = `<div class="note">Python runtime couldn't load in this embedded preview (network restrictions on CDN scripts).
        Download the HTML file and open it directly in your browser — the runner and coach lint work there. Meanwhile, write your
        solution and check it against the reference below.</div>`;
    } finally { btn.disabled = false; }
  },
};
/* ============================================================
   p5a_cards.js — card games: High Show and Black − Red.
   ============================================================
   Concatenated BEFORE p5_games.js because p5 ends with the boot code, which
   must evaluate last. These objects are referenced only from
   Floor.renderHub's click handlers, so their definition order relative to
   Floor/pick/clamp does not matter — but for that same reason this file must
   contain NO top-level executable statements, only declarations.

   HighShow   optimal stopping: N sequential cards from a hidden start K
              (K ≤ 3N), shuffled; keep M of them, rejections may be penalized
              under one of five penalty functions. Ends with the player
              estimating K and their own net P&L before the reveal. Session
              PnL contribution = net result minus the no-skill baseline
              (taking the first M cards), plus estimate bonuses.
   BlackRed   poker-shaped market making: everyone gets 2 hole cards, 5 board
              cards reveal Pre-flop → Flop → Turn → River, and the contract
              settles to Σ(black ranks) − Σ(red ranks) over ALL dealt cards.
              The player quotes a two-sided market each street; bots — who
              each know their own hole cards — trade 1 lot against it.
              Endgame asks the player to compute the true value and estimate
              their own PnL before settlement. Actual PnL flows to addPnl().
   ============================================================ */

function shuffleArr(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* ============================================================
   HIGH SHOW
   ============================================================ */
const HighShow = {
  PEN: {
    none:    { name: "No penalty",                 hint: "Reject freely — pure optimal stopping." },
    linear:  { name: "Linear — flat per reject",   hint: "Default multiplier: N ÷ 10 per rejected card." },
    turn:    { name: "On turn — i × mult",         hint: "Rejecting the i-th card shown costs i × mult. Default mult = 2(N+K)/(N+4) — it depends on the hidden K, so the running penalty stays hidden until the reveal." },
    rejects: { name: "On value — v × mult",        hint: "Rejecting a card of value v costs v × mult. Default mult = 1/4." },
    turnval: { name: "Turn × value — v·i × mult",  hint: "Rejecting value v on turn i costs v × i × mult. Default mult = 1/8." },
  },

  start() {
    Floor.stopAll();
    $("#view-floor").innerHTML = `
      <div class="row spread">${Floor.backBtn()}<span class="muted small">an optimal-stopping game with teeth</span></div>
      <h2 class="mt16">🎴 High Show</h2>
      <p class="lede">A deck of <b>N</b> sequential cards runs from a hidden start <b>K</b> (K is random, at most 3N) up to K+N−1,
      shuffled. Each turn one card is shown: <b>cash out</b> (keep it) or <b>see another</b> — but rejecting can cost you,
      depending on the penalty function. Once you've kept the required number, you'll estimate K and your own net P&L
      before anything is revealed.</p>
      <div class="card mt16">
        <div class="row" style="gap:16px; align-items:flex-end">
          <div class="quote-field"><label>Deck size N</label><input type="number" id="hsN" value="50" min="5" max="300"></div>
          <div class="quote-field"><label>Cards to keep</label><input type="number" id="hsM" value="5" min="1"></div>
          <div class="quote-field"><label>Penalty</label>
            <select id="hsPen">${Object.entries(this.PEN).map(([k, p]) =>
              `<option value="${k}" ${k === "linear" ? "selected" : ""}>${p.name}</option>`).join("")}</select></div>
          <div class="quote-field"><label>Multiplier <span class="muted">(blank = default)</span></label>
            <input type="text" id="hsParam" placeholder="auto" style="width:110px"></div>
          <button class="btn primary" id="hsStart">Deal →</button>
        </div>
        <div class="small muted mt8" id="hsPenHint">${this.PEN.linear.hint}</div>
        <div class="small mt8" id="hsErr" style="color:var(--critical)"></div>
      </div>
      <div id="hsStage"></div>`;
    Floor.bindBack();
    $("#hsPen").addEventListener("change", () => { $("#hsPenHint").textContent = this.PEN[$("#hsPen").value].hint; });
    $("#hsStart").addEventListener("click", () => this.newGame());
  },

  newGame() {
    const N = clamp(Math.round(+$("#hsN").value || 50), 5, 300);
    const M = Math.round(+$("#hsM").value || 5);
    if (!(M >= 1 && M < N)) { $("#hsErr").textContent = "Cards to keep must be at least 1 and smaller than N."; return; }
    $("#hsErr").textContent = "";
    this.N = N; this.M = M;
    this.penType = $("#hsPen").value;
    this.K = 1 + Math.floor(Math.random() * 3 * N);
    this.order = shuffleArr(Array.from({ length: N }, (_, i) => this.K + i));
    const raw = parseFloat($("#hsParam").value);
    const userMult = Number.isFinite(raw) ? raw : null;
    const defs = { none: 0, linear: N / 10, turn: 2 * (N + this.K) / (N + 4), rejects: 0.25, turnval: 0.125 };
    this.mult = userMult ?? defs[this.penType];
    this.multHidden = this.penType === "turn" && userMult === null; // default depends on K
    this.turn = 0; this.selected = []; this.rejected = []; this.pen = 0;
    this.renderTurn();
  },

  penFor(v, i) {
    switch (this.penType) {
      case "linear":  return this.mult;
      case "turn":    return i * this.mult;
      case "rejects": return v * this.mult;
      case "turnval": return v * i * this.mult;
      default:        return 0;
    }
  },

  renderTurn() {
    this.turn++;
    const cur = this.order[this.turn - 1];
    const gain = this.selected.reduce((a, b) => a + b, 0);
    const canReject = (this.N - this.turn) >= (this.M - this.selected.length);
    $("#hsStage").innerHTML = `
      <div class="card mt16">
        <div class="stat-tiles">
          <div class="stat-tile"><div class="k">Turn</div><div class="v">${this.turn}</div></div>
          <div class="stat-tile"><div class="k">Kept</div><div class="v">${this.selected.length} / ${this.M}</div></div>
          <div class="stat-tile"><div class="k">Rejected</div><div class="v">${this.rejected.length}</div></div>
          <div class="stat-tile"><div class="k">Gain</div><div class="v pos">${gain}</div></div>
          <div class="stat-tile"><div class="k">Penalty</div><div class="v ${this.pen > 0 ? "neg" : ""}">${this.multHidden ? "hidden" : "−" + (Math.round(this.pen * 100) / 100)}</div></div>
        </div>
        <div style="text-align:center; padding:22px 0 8px">
          <div class="pcard big">${cur}</div>
          <div class="row mt16" style="justify-content:center; gap:12px">
            <button class="btn primary" id="hsKeep">💰 Cash out</button>
            <button class="btn" id="hsSee" ${canReject ? "" : "disabled"}>See another →</button>
          </div>
          ${canReject ? "" : `<div class="small muted mt8">Exactly enough cards remain — you must take the rest.</div>`}
        </div>
        ${this.selected.length ? `<div class="card-row mt16"><span class="small muted">kept:</span>${this.selected.map(v => `<span class="pcard">${v}</span>`).join("")}</div>` : ""}
        ${this.rejected.length ? `<div class="card-row mt8"><span class="small muted">rejected:</span>${this.rejected.map(r => `<span class="pcard dim">${r.v}</span>`).join("")}</div>` : ""}
      </div>`;
    $("#hsKeep").addEventListener("click", () => {
      this.selected.push(cur);
      if (this.selected.length === this.M) this.endForm(); else this.renderTurn();
    });
    $("#hsSee").addEventListener("click", () => {
      this.rejected.push({ v: cur, i: this.turn });
      this.pen += this.penFor(cur, this.turn);
      this.renderTurn();
    });
  },

  endForm() {
    const gain = this.selected.reduce((a, b) => a + b, 0);
    $("#hsStage").innerHTML = `
      <div class="card mt16">
        <h3>All ${this.M} cards kept — now the estimates</h3>
        <div class="card-row mt8"><span class="small muted">your cards:</span>${this.selected.map(v => `<span class="pcard">${v}</span>`).join("")}</div>
        <p class="small muted mt8">Before the reveal: what do you think the smallest card in the deck (K) was, and what is your
        net profit — gain ${this.multHidden ? "minus a penalty you'll have to reason about" : "of " + gain + " minus the penalty"}?</p>
        <div class="quote-panel">
          <div class="quote-field"><label>Estimate of K</label><input type="number" id="hsEstK"></div>
          <div class="quote-field"><label>Estimate of net P&L</label><input type="number" id="hsEstP" step="any"></div>
          <button class="btn primary" id="hsReveal" style="align-self:flex-end">Reveal →</button>
        </div>
      </div>`;
    $("#hsReveal").addEventListener("click", () => this.settle());
    $("#hsEstK").focus();
  },

  settle() {
    const estK = Math.round(+$("#hsEstK").value);
    const estP = +$("#hsEstP").value;
    const gain = this.selected.reduce((a, b) => a + b, 0);
    const pen = Math.round(this.pen * 100) / 100;
    const net = Math.round((gain - pen) * 100) / 100;
    const par = this.M * (this.K + (this.N - 1) / 2);      // EV of taking the first M cards, no rejects
    const skill = net - par;
    const kOk = estK === this.K, kNear = Math.abs(estK - this.K) <= 2;
    const pOk = Number.isFinite(estP) && Math.abs(estP - net) <= Math.max(5, 0.05 * Math.abs(net));
    const bonus = (kOk ? 25 : kNear ? 10 : 0) + (pOk ? 15 : 0);
    const session = Math.round(skill + bonus);
    addPnl(session);
    $("#hsStage").innerHTML = `
      <div class="result-banner">
        <h3>K was <span class="mono">${this.K}</span> — deck ran ${this.K} … ${this.K + this.N - 1}</h3>
        <div class="row mt8" style="gap:8px; flex-wrap:wrap">
          <div class="stat-tile"><div class="k">Gain</div><div class="v pos">${gain}</div></div>
          <div class="stat-tile"><div class="k">Penalty</div><div class="v ${pen > 0 ? "neg" : ""}">−${pen}</div></div>
          <div class="stat-tile"><div class="k">Net P&L</div><div class="v ${net > 0 ? "pos" : "neg"}">${net}</div></div>
          <div class="stat-tile"><div class="k">Naive baseline</div><div class="v">${Math.round(par * 10) / 10}</div></div>
          <div class="stat-tile"><div class="k">Skill vs naive</div><div class="v ${skill > 0 ? "pos" : skill < 0 ? "neg" : ""}">${skill > 0 ? "+" : ""}${Math.round(skill * 10) / 10}</div></div>
          <div class="stat-tile"><div class="k">Session PnL</div><div class="v ${session > 0 ? "pos" : session < 0 ? "neg" : ""}">${fmtMoney(session)}</div></div>
        </div>
        <div class="small mt8" style="color:var(--ink-2); display:flex; flex-direction:column; gap:6px">
          <div>• K estimate ${estK || estK === 0 ? estK : "—"}: ${kOk ? "✓ exact (+25)" : kNear ? "≈ within 2 (+10)" : "✗ off by " + Math.abs(estK - this.K)}.
            Your best evidence was the ${this.turn} card values you saw — min seen ${Math.min(...this.order.slice(0, this.turn))}, and E[min of ${this.turn} draws] ≈ K + (N−${this.turn ? this.turn : 1}·spacing)… the minimum you observed overshoots K by about N/${this.turn + 1}.</div>
          <div>• P&L estimate ${Number.isFinite(estP) ? estP : "—"}: ${pOk ? "✓ within tolerance (+15)" : "✗ actual was " + net}.${this.multHidden ? " The hidden multiplier was 2(N+K)/(N+4) = " + (Math.round(this.mult * 100) / 100) + "." : ""}</div>
          <div>• Baseline is taking the first ${this.M} cards blind: EV = M × (K + (N−1)/2) = ${Math.round(par * 10) / 10}. Beating it means your accept/reject thresholds earned more than the penalties cost.</div>
          <div>• Strategy shape: with m picks left and r cards remaining, accept a card in roughly the top m/r fraction of the values you believe remain — and every penalty lowers that bar. Early rejects are cheap information about K; late rejects are expensive.</div>
        </div>
        <div class="row mt16"><button class="btn primary" id="hsAgain">Play again</button></div>
      </div>`;
    $("#hsAgain").addEventListener("click", () => this.start());
  },
};

/* ============================================================
   BLACK − RED
   ============================================================ */
const BlackRed = {
  STYLES: [
    { n: "sharp",  t: 1.2, noise: 1.5 },
    { n: "quant",  t: 2.5, noise: 3.0 },
    { n: "tight",  t: 5.0, noise: 2.0 },
    { n: "punter", t: 0.6, noise: 8.0 },
  ],
  PHASES: ["Pre-flop", "Flop", "Turn", "River"],
  REVEAL: [0, 3, 4, 5],

  start() {
    Floor.stopAll();
    $("#view-floor").innerHTML = `
      <div class="row spread">${Floor.backBtn()}<span class="muted small">black adds, red subtracts, bots know their own cards</span></div>
      <h2 class="mt16">♠ Black − Red</h2>
      <p class="lede">Everyone — you and each bot — is dealt 2 hidden cards; 5 board cards reveal poker-style
      (pre-flop → flop → turn → river). The contract settles to <b>Σ black ranks − Σ red ranks over every card dealt</b>
      (A=1 … K=13; clubs/spades +, hearts/diamonds −). Each street you quote a two-sided market and the bots trade
      1 lot against it. At the end you compute the true value and estimate your own PnL before settlement.</p>
      <div class="card mt16">
        <div class="row" style="gap:16px; align-items:flex-end">
          <div class="quote-field"><label>Bots</label>
            <select id="brBots"><option>2</option><option selected>3</option><option>4</option><option>5</option></select></div>
          <button class="btn primary" id="brStart">Deal →</button>
        </div>
        <div class="small muted mt8">Tip: the full deck sums to zero, so E[unseen card] is pinned down by what you can see.
        A tight quote pre-flop, when ${""}everyone's information edge is at its largest relative to yours, is how you get picked off.</div>
      </div>
      <div id="brStage"></div>`;
    Floor.bindBack();
    $("#brStart").addEventListener("click", () => this.newGame(+$("#brBots").value));
  },

  newGame(nb) {
    const deck = [];
    for (const [suit, red] of [["♠", false], ["♣", false], ["♥", true], ["♦", true]])
      for (let r = 1; r <= 13; r++)
        deck.push({ r, suit, red, v: red ? -r : r, label: ({ 1: "A", 11: "J", 12: "Q", 13: "K" }[r] || String(r)) });
    shuffleArr(deck);
    this.you = deck.splice(0, 2);
    const pool = shuffleArr(this.STYLES.slice());
    this.bots = Array.from({ length: nb }, (_, i) => ({ id: i + 1, cards: deck.splice(0, 2), style: pool[i % pool.length] }));
    this.board = deck.splice(0, 5);
    this.trueV = [...this.you, ...this.board, ...this.bots.flatMap(b => b.cards)].reduce((a, c) => a + c.v, 0);
    this.phase = 0; this.tape = []; this.trades = []; this.cash = 0; this.pos = 0;
    this.renderPhase();
  },

  cardHTML(c, down) {
    return down ? `<span class="pcard down">▮</span>`
                : `<span class="pcard ${c.red ? "red" : ""}">${c.label}${c.suit}</span>`;
  },

  renderPhase() {
    const nRev = this.REVEAL[this.phase];
    const youSum = this.you.reduce((a, c) => a + c.v, 0);
    const boardSum = this.board.slice(0, nRev).reduce((a, c) => a + c.v, 0);
    $("#brStage").innerHTML = `
      <div class="card mt16">
        <div class="row spread">
          <h3>${this.PHASES[this.phase]} — make your market</h3>
          <div class="stat-tiles">
            <div class="stat-tile"><div class="k">Position</div><div class="v">${this.pos > 0 ? "+" : ""}${this.pos}</div></div>
            <div class="stat-tile"><div class="k">Trades</div><div class="v">${this.trades.length}</div></div>
          </div>
        </div>
        <div class="row mt16" style="gap:26px; flex-wrap:wrap">
          <div><div class="small muted">your cards (net ${youSum > 0 ? "+" : ""}${youSum})</div>
            <div class="card-row mt8">${this.you.map(c => this.cardHTML(c)).join("")}</div></div>
          <div><div class="small muted">board${nRev ? ` (visible net ${boardSum > 0 ? "+" : ""}${boardSum})` : ""}</div>
            <div class="card-row mt8">${this.board.map((c, i) => this.cardHTML(c, i >= nRev)).join("")}</div></div>
          <div><div class="small muted">bots</div>
            <div class="card-row mt8">${this.bots.map(b => `<span class="badge">bot ${b.id}</span>`).join("")}</div></div>
        </div>
        <div class="quote-panel">
          <div class="quote-field"><label>Your bid</label><input type="number" step="any" class="bid-in" id="brBid"></div>
          <div class="quote-field"><label>Your ask</label><input type="number" step="any" class="ask-in" id="brAsk"></div>
          <button class="btn primary" id="brQuote" style="align-self:flex-end">Quote it →</button>
          <span class="small" id="brErr" style="color:var(--critical); align-self:flex-end"></span>
        </div>
      </div>
      <div class="card mt16 pad-sm"><div class="tape" id="brTape">${this.tape.join("") || `<span class="t-info">The tape is empty — quote and the bots will act.</span>`}</div></div>`;
    const tp = $("#brTape"); tp.scrollTop = tp.scrollHeight;
    $("#brQuote").addEventListener("click", () => this.submit());
    $("#brAsk").addEventListener("keydown", e => { if (e.key === "Enter") this.submit(); });
    $("#brBid").focus();
  },

  submit() {
    const bid = +$("#brBid").value, ask = +$("#brAsk").value;
    if (!Number.isFinite(bid) || !Number.isFinite(ask) || !(ask > bid)) {
      $("#brErr").textContent = "Need bid < ask, both numbers."; return;
    }
    const ph = this.PHASES[this.phase], nRev = this.REVEAL[this.phase];
    this.tape.push(`<div class="t-me">[${ph}] you quote ${bid} / ${ask}</div>`);
    for (const b of this.bots) {
      const revealed = this.board.slice(0, nRev);
      const seen = [...b.cards, ...revealed];
      const seenSum = seen.reduce((a, c) => a + c.v, 0);
      const unseenDealt = 2 + 2 * (this.bots.length - 1) + (5 - nRev);
      const ev = seenSum + unseenDealt * (0 - seenSum) / (52 - seen.length) + b.style.noise * randn();
      if (ev > ask + b.style.t) {
        this.trades.push({ bot: b, side: "buy", px: ask, phase: ph });
        this.cash += ask; this.pos -= 1;
        this.tape.push(`<div class="t-buy">[${ph}] bot ${b.id} · ${b.style.n} BUYS 1 @ ${ask}</div>`);
      } else if (ev < bid - b.style.t) {
        this.trades.push({ bot: b, side: "sell", px: bid, phase: ph });
        this.cash -= bid; this.pos += 1;
        this.tape.push(`<div class="t-sell">[${ph}] bot ${b.id} · ${b.style.n} SELLS 1 @ ${bid}</div>`);
      } else {
        this.tape.push(`<div class="t-info">[${ph}] bot ${b.id} · ${b.style.n} passes</div>`);
      }
    }
    this.phase++;
    if (this.phase < 4) this.renderPhase(); else this.endForm();
  },

  endForm() {
    $("#brStage").innerHTML = `
      <div class="card mt16">
        <h3>River done — everything on the table</h3>
        <div class="row mt16" style="gap:26px; flex-wrap:wrap">
          <div><div class="small muted">you</div><div class="card-row mt8">${this.you.map(c => this.cardHTML(c)).join("")}</div></div>
          <div><div class="small muted">board</div><div class="card-row mt8">${this.board.map(c => this.cardHTML(c)).join("")}</div></div>
          ${this.bots.map(b => `<div><div class="small muted">bot ${b.id} · ${b.style.n}</div>
            <div class="card-row mt8">${b.cards.map(c => this.cardHTML(c)).join("")}</div></div>`).join("")}
        </div>
        <p class="small muted mt16">Two questions before settlement — do the arithmetic, don't eyeball it:</p>
        <div class="quote-panel">
          <div class="quote-field"><label>True value (Σ black − Σ red)</label><input type="number" id="brEstV"></div>
          <div class="quote-field"><label>Your PnL estimate</label><input type="number" step="any" id="brEstP"></div>
          <button class="btn primary" id="brSettle" style="align-self:flex-end">Settle →</button>
        </div>
      </div>
      <div class="card mt16 pad-sm"><div class="tape">${this.tape.join("")}</div></div>`;
    $("#brSettle").addEventListener("click", () => this.settle());
    $("#brEstV").focus();
  },

  settle() {
    const estV = Math.round(+$("#brEstV").value);
    const estP = +$("#brEstP").value;
    const V = this.trueV;
    const pnl = Math.round((this.cash + this.pos * V) * 100) / 100;
    addPnl(Math.round(pnl));
    const perTrade = this.trades.map(t => ({ ...t, pnl: t.side === "buy" ? t.px - V : V - t.px }));
    const vsPunter = perTrade.filter(t => t.bot.style.n === "punter").reduce((a, t) => a + t.pnl, 0);
    const vsSharp = perTrade.filter(t => t.bot.style.n !== "punter").reduce((a, t) => a + t.pnl, 0);
    const vOk = estV === V;
    const pOk = Number.isFinite(estP) && Math.abs(estP - pnl) <= 5;
    $("#brStage").innerHTML = `
      <div class="result-banner">
        <h3>True value: <span class="mono">${V > 0 ? "+" : ""}${V}</span></h3>
        <div class="row mt8" style="gap:8px; flex-wrap:wrap">
          <div class="stat-tile"><div class="k">Your PnL</div><div class="v ${pnl > 0 ? "pos" : pnl < 0 ? "neg" : ""}">${fmtMoney(pnl)}</div></div>
          <div class="stat-tile"><div class="k">Final position</div><div class="v">${this.pos > 0 ? "+" : ""}${this.pos}</div></div>
          <div class="stat-tile"><div class="k">vs punter flow</div><div class="v ${vsPunter > 0 ? "pos" : vsPunter < 0 ? "neg" : ""}">${fmtMoney(vsPunter)}</div></div>
          <div class="stat-tile"><div class="k">vs sharper flow</div><div class="v ${vsSharp > 0 ? "pos" : vsSharp < 0 ? "neg" : ""}">${fmtMoney(vsSharp)}</div></div>
        </div>
        <div class="small mt8" style="color:var(--ink-2); display:flex; flex-direction:column; gap:6px">
          <div>• True value ${Number.isFinite(estV) ? estV : "—"}: ${vOk ? "✓ exact." : "✗ it was " + V + " — settlement arithmetic has to be automatic."}</div>
          <div>• PnL estimate ${Number.isFinite(estP) ? estP : "—"}: ${pOk ? "✓ within ±5." : "✗ actual " + pnl + ". Track cash and position street by street: PnL = cash + position × value."}</div>
          <div>• The decomposition is the lesson: profit against punters, losses against sharp/tight flow means your quotes leaked
          information value. Bots know 2 cards you can't see — their willingness to trade IS information; move your market when
          they hit you, and note the deck sums to zero, so E[each unseen card] = −(sum you can see)/(cards you can't).</div>
        </div>
        ${perTrade.length ? `<div class="mt16" style="max-height:180px; overflow-y:auto">
          ${perTrade.map(t => `<div class="rev-row"><span>[${t.phase}] bot ${t.bot.id} · ${t.bot.style.n} ${t.side === "buy" ? "bought" : "sold"}</span>
            <span>@ ${t.px}</span><span></span>
            <span style="color:${t.pnl > 0 ? "var(--good)" : t.pnl < 0 ? "var(--critical)" : "var(--ink-muted)"}">${t.pnl > 0 ? "+" : ""}${Math.round(t.pnl * 100) / 100}</span></div>`).join("")}
        </div>` : `<p class="small muted mt8">No bot traded — your markets were wide enough to be safe and too wide to learn anything.</p>`}
        <div class="row mt16"><button class="btn primary" id="brAgain">Deal again</button></div>
      </div>`;
    $("#brAgain").addEventListener("click", () => this.start());
  },
};
/* ============================================================
   p5b_drills.js — timed drills: Mental Math, Sequences, Fermi Estimation.
   ============================================================
   Concatenated BEFORE p5_games.js (boot must evaluate last); no top-level
   executable statements, declarations only.

   All three games share one engine, runDrill(S), which owns the quiz loop:
   exam format (duration vs question count), typing vs multiple choice,
   skips, Enter-to-submit vs auto-advance, wrong-answer penalties, the
   timer, the results screen, and best-score persistence
   (state.drillBests["<game>:<mode>"], saved through Store).

   Each game object supplies a settings screen (start()), a question
   generator (gen() -> {q | qh, a, tol?, disp, sub?, choices?, note?}),
   and presets. Answers are parsed with parseAnswer() from p3, so players
   can type fractions, percents, and k/M/B/T suffixes anywhere.

   Scoring modes:
     binary   +1 per correct; optional −1 per wrong answer (penalize).
     scored   Fermi mode — partial credit in [0,1] per question. Math
              estimates score on relative error (3% off ≈ 0.9); real-world
              estimates score on log10 ratio (within ×1.26 ≈ 0.9, a factor
              of 10 = 0). A question at ≥ 0.9 counts as "correct".
   ============================================================ */

const ri = (lo, hi) => lo + Math.floor(Math.random() * (hi - lo + 1));
const fmtClock = s => Math.floor(s / 60) + ":" + String(Math.floor(s % 60)).padStart(2, "0");
function fmtBig(v) {
  const av = Math.abs(v);
  if (av >= 1e12) return +(v / 1e12).toPrecision(3) + "T";
  if (av >= 1e9)  return +(v / 1e9).toPrecision(3) + "B";
  if (av >= 1e6)  return +(v / 1e6).toPrecision(3) + "M";
  if (av >= 1e4)  return Math.round(v).toLocaleString("en-US");
  return String(Number.isInteger(v) ? v : Math.round(v * 100) / 100);
}
const gcd2 = (a, b) => b ? gcd2(b, a % b) : a;

/* Build 4 multiple-choice options (as display strings) around the answer. */
function mcChoices(a, disp, step) {
  const s = Math.max(1, Math.round(Math.abs(step || a * 0.1) ) || 1);
  const cands = [a + s, a - s, a + 2 * s, a - 2 * s, a + 1, a - 1, a + s + 1];
  const out = [disp];
  for (const c of cands) {
    const d = String(c);
    if (!out.includes(d)) out.push(d);
    if (out.length === 4) break;
  }
  return shuffleArr(out);
}

/* ---------- shared settings controls ---------- */
function drillSettingsHTML(o) {

    <div class="quote-field"><label>Exam format</label>
      <select id="dsFormat">
        <option value="time" ${o.format !== "count" ? "selected" : ""}>Duration</option>
        <option value="count" ${o.format === "count" ? "selected" : ""}>Number of questions</option>

    <div class="quote-field" id="dsTimeWrap"><label>Minutes</label>

    ${o.noFmt ? "" : `<div class="quote-field"><label>Answer format</label>

    <div class="quote-field"><label>Allow skips</label>
