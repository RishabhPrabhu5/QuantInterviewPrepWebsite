  solution:"log₁₀(2¹⁰⁰) = 100 × 0.30103 = 30.103 → ⌊30.103⌋ + 1 = 31 digits.\nLeading digits: 10^0.103 ≈ 1.27, so 2¹⁰⁰ ≈ 1.27 × 10³⁰ (exactly 1.2676…×10³⁰).\nThe toolkit: log₁₀2 ≈ 0.301, log₁₀3 ≈ 0.477, log₁₀7 ≈ 0.845, and 2¹⁰ = 1024 ≈ 10³ for quick-and-dirty work. Log fluency is what makes big-number mental math possible at all." },
{ id:"b7", topic:"brain", diff:3, ans:{"t":"n","v":0.31,"abs":0.03,"pct":1,"label":"success probability of the loop strategy"}, firms:["js","deshaw","fiverings"], title:"100 prisoners, 100 boxes",
  prompt:"100 prisoners' names are placed randomly in 100 boxes, one per box. Each prisoner may open 50 boxes looking for their own name; no communication once the searches start. If ALL succeed, everyone goes free. Random guessing gives (1/2)¹⁰⁰ ≈ 0. Find a strategy with ~31% success, and explain why it works.",
  hint:"Number the prisoners and boxes. Follow the permutation: open your own number, then the box of the name you find, and so on.",
  solution:"Loop-following strategy: prisoner k opens box k, reads name j inside, opens box j, and keeps following the chain.\nThe boxes define a random permutation; prisoner k's chain traces the cycle containing k, and they find their own name in ≤ 50 steps iff their cycle has length ≤ 50.\nEveryone succeeds iff the permutation has NO cycle longer than 50. P(some cycle of length ℓ > 50) = Σ_{ℓ=51}^{100} 1/ℓ ≈ ln(100/50) = ln 2 ≈ 0.693 (at most one such cycle can exist).\nSuccess ≈ 1 − ln 2 ≈ 30.7%.\nThe magic: the strategy correlates everyone's failures — either the permutation is bad for many prisoners at once, or good for all. You can't raise each individual's 50% success chance; you CAN make the successes happen together. Correlating your risks on purpose is a deeply trading-flavored idea." },
{ id:"p7", topic:"prob1", diff:3, ans:{"t":"n","v":0.5,"pct":1,"label":"probability for n = 4"}, firms:["js","deshaw","citadel"], title:"All points in a semicircle",
  prompt:"n points are placed independently and uniformly on a circle. What is the probability that all n lie within some semicircle? Compute it for n = 4.",
  hint:"For each point, consider the event that the semicircle starting at that point (going clockwise) contains all the others.",
  solution:"For point i, let A_i = 'the semicircle starting at point i, running clockwise, contains all n points.' The A_i are disjoint (at most one point can be the clockwise-most 'leader'), and each has probability (1/2)^{n−1} (each other point independently falls in that half).\nP = n / 2^{n−1}.\nFor n = 4: 4/8 = 1/2.\nSanity checks: n = 2 gives 1 ✓ (two points always share a semicircle), n = 3 gives 3/4 ✓.\nThe disjointification trick — find an event decomposition indexed by a 'leader' — recurs in many geometric probability questions and is worth internalizing." },
{ id:"e7", topic:"prob2", diff:3, ans:{"t":"n","v":2.71828,"abs":0.03,"label":"expected number of draws"}, firms:["js","sig","deshaw"], title:"Uniforms until the sum exceeds 1",
  prompt:"Draw independent Uniform[0,1] variables one at a time and stop when their sum first exceeds 1. What is the expected number of draws?",
  hint:"Find P(N > n) — it's the volume of a simplex.",
  solution:"P(N > n) = P(U₁ + … + Uₙ ≤ 1) = 1/n! (the volume of the n-dimensional simplex).\nE[N] = Σ_{n≥0} P(N > n) = Σ 1/n! = e ≈ 2.718.\nTwo reusable tools in one question: the tail-sum formula E[N] = ΣP(N > n), and the simplex volume 1/n!.\nFollow-up they sometimes run: expected value of the OVERSHOOT (sum − 1) at stopping ≈ e/2 − 1 + … (harder); or: expected number of draws for the sum to exceed 2 (answer e² − e)." },
{ id:"e8", topic:"prob2", diff:3, ans:{"t":"n","v":3.0,"abs":0.45,"label":"expected max, n = 100"}, firms:["deshaw","citadel","js"], title:"Expected max of 100 normals",
  prompt:"Roughly what is the expected maximum of 100 iid standard normals? Of 10,000? Give the scaling law and why any trader should carry it around.",
  hint:"Set the tail probability ≈ 1/n.",
  solution:"The max sits where the tail holds about 1/n of the mass: P(Z > z) ≈ 1/n → z ≈ √(2 ln n).\nn = 100: √(2 × 4.6) ≈ 3.0. n = 10,000: √(2 × 9.2) ≈ 4.3. (True values ≈ 2.51 and 3.85 — the √(2 ln n) law overshoots slightly but nails the scaling.)\nGrowth is only √log: to add one more sigma to the expected max you must MULTIPLY the number of draws enormously.\nWhy it matters: run 100 random strategies and the best backtest shows ~2.5σ 'significance' by pure luck. The expected-max formula IS the multiple-testing correction — quant research desks (DE Shaw, Citadel) probe exactly this." },
{ id:"g6", topic:"games", diff:3, ans:{"t":"n","v":3,"label":"value of the game ($)"}, firms:["js","sig","fiverings"], title:"Dollar-a-roll die",
  prompt:"You may roll a fair die as many times as you like, paying $1 per roll (including the first). When you stop, you receive the face value of your last roll, in dollars. What's the optimal strategy and the value of the game?",
  hint:"Let V be the value of the game and find the self-consistent stopping set.",
  solution:"Guess the stopping set is {4, 5, 6}: V = −1 + (1/2)(5) + (1/2)V → V = 3.\nConsistency: keep a face iff face ≥ V = 3... face 3 pays exactly V, so you're indifferent; keeping {4,5,6} (or {3,…,6}) both give V = 3. Check {3,4,5,6}: V = −1 + (4/6)(4.5) + (2/6)V → V = 3 ✓ — indeed indifferent.\nValue: $3. Strategy: reroll 1s and 2s (3 is a matter of taste), keep 4+.\nThe general method — value function + self-consistent threshold — is the discrete version of how you price American options. Say that sentence in the interview." },
{ id:"k6", topic:"markov", diff:3, firms:["js","deshaw","fiverings"], title:"Pólya's urn",
  prompt:"An urn starts with 1 red and 1 blue ball. Repeatedly: draw a ball uniformly, put it back along with one more of the same color. (a) What's the probability the 10th draw is red? (b) What does the red fraction converge to?",
  hint:"(a) has a symmetry answer. For (b), show the red fraction is a martingale — then find the limit's distribution.",
  solution:"(a) 1/2 — by symmetry between colors at every step (exchangeability). More strikingly, the probability the n-th draw is red is 1/2 for ALL n.\n(b) The red fraction is a martingale (check: from (r, b), E[next fraction] = current fraction). Bounded martingales converge — but to a RANDOM limit: for the 1+1 start, the limiting red fraction is Uniform[0, 1].\nSo 'rich get richer' dynamics converge, but where they converge is pure luck of the early draws.\nInterview traps: people answer (a) with heavy computation instead of symmetry, and assume (b) converges to 1/2. The urn is the canonical model for path dependence — early random advantages that lock in — from market-share races to order-flow toxicity." },
{ id:"mg6", topic:"mart", diff:3, firms:["js","deshaw"], title:"The monkey types ABRACADABRA",
  prompt:"A monkey types uniform random capital letters forever. What is the expected number of keystrokes until 'ABRACADABRA' first appears? Give the exact closed form.",
  hint:"The martingale-casino argument from HTH generalizes: which prefixes of ABRACADABRA are also suffixes?",
  solution:"Fair-casino argument: before each keystroke a new gambler bets $1 that the next 11 letters spell ABRACADABRA, parlaying at fair 26× odds per letter. At the completion time T, total stakes paid in = E[T], and surviving wealth = Σ 26^k over each prefix of the pattern that is also a suffix.\nABRACADABRA's borders: the whole word (11), 'ABRA' (4), and 'A' (1).\nE[T] = 26¹¹ + 26⁴ + 26 ≈ 3.67 × 10¹⁵.\nThe overlap terms mean self-similar patterns take LONGER to appear than non-overlapping ones — the same reason waiting for HH (6) beats waiting for HT (4). Full credit requires naming the optional stopping theorem and why T is a legal stopping time." },
{ id:"s7", topic:"stats", diff:3, firms:["citadel","deshaw","tower"], title:"Noise in x: attenuation bias",
  prompt:"You want the true regression y = βx + ε, but you only observe x* = x + u (measurement noise, independent). You regress y on x*. What does your slope estimate converge to, and what does this mean for trading signals?",
  hint:"Compute Cov(y, x*)/Var(x*).",
  solution:"β̂ → Cov(y, x*)/Var(x*) = β·σ²ₓ / (σ²ₓ + σ²ᵤ) = β · (signal / (signal + noise)).\nErrors in the regressor bias the slope TOWARD ZERO (attenuation) — never away. Noise in y doesn't bias β; noise in x does.\nTrading translation: your predictive signal is always measured with noise, so the fitted response to it systematically understates the true response — and the noisier the feature, the more shrinkage. This is also why naively 'cleaning' the target but not the features changes nothing, and why Bayesian shrinkage of betas is the right instinct rather than a hack.\nFollow-up to expect: how to fix it (instrumental variables, or SNR-based deattenuation if σ²ᵤ is known)." },
{ id:"s8", topic:"stats", diff:3, ans:{"t":"n","v":0.33333,"rel":0.02,"pct":1,"label":"P(both > 0) at rho = 1/2"}, firms:["deshaw","citadel","js"], title:"P(both positive) for correlated normals",
  prompt:"X, Y are standard normals with correlation ρ. Find P(X > 0 and Y > 0). Verify it makes sense at ρ = 0, 1, −1, and compute it for ρ = 1/2.",
  hint:"Write Y = ρX + √(1−ρ²)Z and think in angles — or quote the orthant formula.",
  solution:"Orthant probability: P(X > 0, Y > 0) = 1/4 + arcsin(ρ)/(2π).\nGeometric proof sketch: (X, Y) = radially symmetric Gaussian in the plane after writing Y = ρX + √(1−ρ²)Z; the event is a wedge of angle (π/2 + arcsin ρ) out of 2π.\nChecks: ρ = 0 → 1/4 ✓ (independence). ρ = 1 → 1/4 + 1/4 = 1/2 ✓ (X = Y). ρ = −1 → 0 ✓.\nρ = 1/2: arcsin(1/2) = π/6 → 1/4 + 1/12 = 1/3.\nDesk relevance: this is exactly 'probability both assets are up' as a function of correlation — and note how NONLINEAR it is: going from ρ = 0.5 to ρ = 1 adds as much probability as 0 to 0.5." },
{ id:"mm6", topic:"mm", diff:3, firms:["js","citadel","optiver"], title:"Two market makers, one market",
  prompt:"You and a rival both quote the same instrument; flow hits whoever posts the better price. Walk through the game theory: where do spreads end up, why don't they go to zero, and what happens if your rival is slower than you?",
  hint:"Start from Bertrand competition, then add the costs that stop the race.",
  solution:"Pure Bertrand logic: undercut by a tick to capture ALL the flow → rival undercuts back → spreads compress until quoting tighter loses money. Equilibrium spread = the marginal COST of providing liquidity, which is not zero:\n• adverse selection (Glosten–Milgrom): each fill has expected loss to informed flow — the spread must cover it;\n• inventory risk: holding positions costs variance × risk aversion;\n• tick size & queue: you can't undercut by less than a tick, so at the constrained tick, PRIORITY (speed) decides who trades — this is why sub-penny economics turn into a latency race.\nIf you're faster: you can quote the same price but always be first in queue, and you can cancel stale quotes before being picked off — speed converts directly into both more volume and less adverse selection. That's the entire HFT business model in one question.\nGreat candidates connect all three: spread floor = adverse selection + inventory cost, competition drives you TO the floor, speed decides allocation AT the floor." },
{ id:"o6", topic:"options", diff:2, ans:{"t":"n","v":11.6,"rel":0.07,"label":"straddle price ($)"}, firms:["sig","optiver","imc"], title:"Straddle rule of thumb",

  solution:"ATM (zero rates) call = S[N(d₁) − N(d₂)] with d₁ = −d₂ = σ√T/2 → C ≈ S·φ(0)·σ√T = 0.3989·S·σ√T ≈ 0.4·S·σ√T.\nStraddle = call + put ≈ 0.8·S·σ√T.\nExample: S = 200, σ = 0.25, T = 1/12 → √T ≈ 0.289 → straddle ≈ 0.8 × 200 × 0.25 × 0.289 ≈ $11.6 (call ≈ $5.8).\nEquivalently: straddle ≈ 0.8 × implied move-to-expiry. Interviewers at options shops expect this in seconds; it's also how you sanity-check a screen price before quoting." },

   ============================================================ */
const state = {
  ratings: {},          // qid -> 1(again) 2(hard) 3(good) 4(easy)
  qstats: {},           // qid -> {att, ok, first}  (answer-check outcomes)
  codingStatus: {},     // pid -> 'passed' | 'attempted'
  codingAtt: {},        // pid -> run count
  history: [],          // [{t, kind:'q'|'code', id, ok}]
  pnlTotal: 0,
  view: "roadmap",
  bankFilters: { topic: "all", firm: "all", diff: "all", status: "all" },
};

const Store = {
  KEY: "deskprep_progress_v1",
  ok: (() => { try { localStorage.setItem("__t", "1"); localStorage.removeItem("__t"); return true; } catch (e) { return false; } })(),
  save() {
    if (!this.ok) return;
    try {
      localStorage.setItem(this.KEY, JSON.stringify({
        ratings: state.ratings, qstats: state.qstats, codingStatus: state.codingStatus,
        codingAtt: state.codingAtt, history: state.history.slice(-200), pnlTotal: state.pnlTotal,
        drafts: (typeof Coding !== "undefined") ? Coding.drafts : {},
      }));
    } catch (e) {}
  },
  load() {
    if (!this.ok) return;
    try {
      const d = JSON.parse(localStorage.getItem(this.KEY) || "null");
      if (!d) return;
      Object.assign(state.ratings, d.ratings || {});
      Object.assign(state.qstats, d.qstats || {});
      Object.assign(state.codingStatus, d.codingStatus || {});
      Object.assign(state.codingAtt, d.codingAtt || {});
      state.history = d.history || [];
      state.pnlTotal = d.pnlTotal || 0;
      this._drafts = d.drafts || {};
    } catch (e) {}
  },
  exportJson() {
    const blob = new Blob([JSON.stringify({
      ratings: state.ratings, qstats: state.qstats, codingStatus: state.codingStatus,
      codingAtt: state.codingAtt, history: state.history, pnlTotal: state.pnlTotal,
      drafts: (typeof Coding !== "undefined") ? Coding.drafts : {}, exported: new Date().toISOString(),
    }, null, 1)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "deskprep-progress.json";
    a.click();
    URL.revokeObjectURL(a.href);
  },
  importJson(file, done) {
    const r = new FileReader();
    r.onload = () => {
      try {
        const d = JSON.parse(r.result);
        Object.assign(state.ratings, d.ratings || {});
        Object.assign(state.qstats, d.qstats || {});
        Object.assign(state.codingStatus, d.codingStatus || {});
        Object.assign(state.codingAtt, d.codingAtt || {});
        state.history = d.history || state.history;
        state.pnlTotal = d.pnlTotal ?? state.pnlTotal;
        if (d.drafts && typeof Coding !== "undefined") Object.assign(Coding.drafts, d.drafts);
        this.save(); done(true);
      } catch (e) { done(false); }
    };
    r.readAsText(file);
  },
  reset() {
    state.ratings = {}; state.qstats = {}; state.codingStatus = {}; state.codingAtt = {};
    state.history = []; state.pnlTotal = 0;
    if (typeof Coding !== "undefined") Coding.drafts = {};
    if (this.ok) try { localStorage.removeItem(this.KEY); } catch (e) {}
  },
};

const $ = (sel, el=document) => el.querySelector(sel);
const $$ = (sel, el=document) => [...el.querySelectorAll(sel)];
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
const fmtMoney = v => (v < 0 ? "−$" : "$") + Math.abs(v).toFixed(0);
const topicById = id => TOPICS.find(t => t.id === id);
const firmById = id => FIRMS.find(f => f.id === id);

function qSolved(q) { return (state.qstats[q.id] && state.qstats[q.id].ok) || (state.ratings[q.id] || 0) >= 3; }

function logEvent(kind, id, ok) {
  state.history.push({ t: Date.now(), kind, id, ok });

}

function updatePill() {
  $("#pillSolved").textContent = bankSolvedCount() + codeSolvedCount();

/* ============================================================
   ANSWER CHECKING
   ============================================================ */
function parseAnswer(raw) {
  let s = String(raw).trim().toLowerCase().replace(/[$,\s]/g, "").replace(/−/g, "-");
  if (!s) return null;
  let pct = false;
  if (s.endsWith("%")) { pct = true; s = s.slice(0, -1); }
  let mult = 1;
  const sufMap = { k: 1e3, m: 1e6, mm: 1e6, b: 1e9, bn: 1e9, t: 1e12 };
  const sufMatch = s.match(/(k|mm|m|bn|b|t)$/);
  if (sufMatch && !/e[-+]?\d+$/.test(s)) { mult = sufMap[sufMatch[1]]; s = s.slice(0, -sufMatch[1].length); }
  let v;
  if (s.includes("/")) {
    const [a, b] = s.split("/");
    const na = parseFloat(a), nb = parseFloat(b);
    if (isNaN(na) || isNaN(nb) || nb === 0) return null;
    v = na / nb;
  } else {
    v = parseFloat(s);
    if (isNaN(v)) return null;
  }
  v *= mult;
  return { v, pct };
}

function checkAnswer(spec, raw) {
  const p = parseAnswer(raw);
  if (!p) return { verdict: "invalid" };
  const candidates = [p.pct ? p.v / 100 : p.v];
  if (spec.pct && !p.pct) candidates.push(p.v / 100);      // typed "18" meaning 18%
  if (spec.t === "f") {
    for (const c of candidates) {
      if (c > 0 && Math.max(c / spec.v, spec.v / c) <= spec.factor) return { verdict: "ok", val: c };
    }
    const c = candidates[0];
    if (c > 0 && Math.max(c / spec.v, spec.v / c) <= spec.factor * 2) return { verdict: "near", val: c };
    return { verdict: "wrong", val: c };
  }
  const isInt = Number.isInteger(spec.v) && spec.abs === undefined && spec.rel === undefined;
  const tol = isInt ? 1e-9 : Math.max(spec.abs ?? 0, (spec.rel ?? 0.01) * Math.abs(spec.v), 1e-9);
  for (const c of candidates) {
    if (Math.abs(c - spec.v) <= tol) return { verdict: "ok", val: c };
  }
  const best = candidates[0];
  const nearTol = isInt ? Math.max(1, Math.abs(spec.v) * 0.02) : tol * 1.8;
  if (Math.abs(best - spec.v) <= nearTol) return { verdict: "near", val: best };
  return { verdict: "wrong", val: best };
}

function fmtExpected(spec) {
  const v = spec.v;
  if (spec.t === "f") {
    if (v >= 1e9) return (v / 1e9) + "B";
    if (v >= 1e6) return (v / 1e6) + "M";
    if (v >= 1e3) return (v / 1e3) + "k";
    return String(v);
  }
  return Math.abs(v) < 0.01 && v !== 0 ? v.toPrecision(2) : String(Math.round(v * 10000) / 10000);
}

/* ============================================================

   ============================================================ */
function topicProgress(tid) {
  const qs = QUESTIONS.filter(q => q.topic === tid);
  const done = qs.filter(qSolved).length;
  return { done, total: qs.length, pct: qs.length ? Math.round(100 * done / qs.length) : 0 };
}

function renderRoadmap() {
  const el = $("#view-roadmap");
  let html = `
    <h1>Roadmap</h1>
    <p class="lede">Work the stages in order. A question counts as cleared when you <b>answer it correctly</b> in the checker
    or rate it Good/Easy after solving. The Progress tab tracks accuracy and tells you what to drill.</p>
    <div class="row mt16" style="gap:18px">
      <div class="stat-tile"><div class="k">Questions cleared</div><div class="v">${bankSolvedCount()} / ${QUESTIONS.length}</div></div>
      <div class="stat-tile"><div class="k">Coding solved</div><div class="v">${codeSolvedCount()} / ${CODING_PROBLEMS.length}</div></div>
      <div class="stat-tile"><div class="k">Trading PnL</div><div class="v ${state.pnlTotal>0?"pos":state.pnlTotal<0?"neg":""}">${fmtMoney(state.pnlTotal)}</div></div>
    </div>`;
  for (const st of STAGES) {
    const topics = TOPICS.filter(t => t.stage === st.id);
    const allDone = topics.every(t => { const p = topicProgress(t.id); return p.total && p.done === p.total; });
    html += `
      <div class="stage ${allDone ? "done" : ""}">
        <div class="stage-num">${st.id.slice(1)}</div>
        <div class="stage-head"><div><h2>${esc(st.name)}</h2><div class="muted small">${esc(st.desc)}</div></div></div>
        <div class="topic-grid">
          ${topics.map(t => {
            const p = topicProgress(t.id);
            return `<div class="topic-card" data-topic="${t.id}">
              <div class="t-name"><span>${t.icon}</span> ${esc(t.name)}</div>
              <div class="t-desc">${esc(t.desc)}</div>
              <div class="progress-track"><div class="progress-fill" style="width:${p.pct}%"></div></div>
              <div class="t-meta"><span>${p.done}/${p.total} cleared</span><span>${p.pct}%</span></div>
            </div>`;
          }).join("")}
        </div>
      </div>`;
  }
  html += `
    <div class="mt32">
      <h2>Firm playbooks</h2>
      <p class="muted small" style="max-width:70ch">What each desk actually screens for, and how their loops run.</p>
      <div class="firm-grid mt16">
        ${FIRMS.map(f => {
          const top = Object.entries(f.weights).sort((a,b) => b[1]-a[1]).slice(0,5);
          return `<div class="firm-card">
            <h3>${esc(f.name)} <span class="style">${esc(f.style)}</span></h3>
            <p>${esc(f.blurb)}</p>
            <p class="small muted" style="margin-top:8px"><b style="color:var(--ink-2)">Process:</b> ${esc(f.process)}</p>
            <div class="weights">
              ${top.map(([tid,w]) => `
                <div class="wrow"><span>${esc(topicById(tid).name.split("·")[0].trim())}</span>
                <div class="wbar"><i style="width:${Math.round(w*100)}%"></i></div></div>`).join("")}
            </div>
            <div class="mt8"><button class="btn sm ghost" data-firmdrill="${f.id}">Drill ${esc(f.name)} questions →</button></div>
          </div>`;
        }).join("")}
      </div>
    </div>`;
  el.innerHTML = html;
  $$(".topic-card", el).forEach(c => c.addEventListener("click", () => {
    state.bankFilters = { topic: c.dataset.topic, firm: "all", diff: "all", status: "all" };
    switchView("bank");
  }));
  $$("[data-firmdrill]", el).forEach(b => b.addEventListener("click", () => {
    state.bankFilters = { topic: "all", firm: b.dataset.firmdrill, diff: "all", status: "all" };
    switchView("bank");
  }));
}

function renderBank() {

  const f = state.bankFilters;
  el.innerHTML = `
    <h1>Question Bank</h1>
    <p class="lede">${QUESTIONS.length} original questions in the style of the top desks. Most have an answer checker —
    commit to a number <i>before</i> touching the hint. Wrong answers land in your review queue automatically.</p>
    <div class="filters">
      <select id="fTopic">

        ${TOPICS.map(t => `<option value="${t.id}" ${f.topic===t.id?"selected":""}>${esc(t.name)}</option>`).join("")}
      </select>
      <select id="fFirm">
        <option value="all">All firms</option>
        ${FIRMS.map(fr => `<option value="${fr.id}" ${f.firm===fr.id?"selected":""}>${esc(fr.name)}</option>`).join("")}

    renderQList();

function questionStatus(q) {
  if (qSolved(q)) return "done";
  const st = state.qstats[q.id];
  if ((st && st.att > 0) || state.ratings[q.id]) return "weak";
  return "new";
}

function renderQList() {
  const f = state.bankFilters;
  const list = QUESTIONS.filter(q =>
    (f.topic === "all" || q.topic === f.topic) &&
    (f.firm === "all" || q.firms.includes(f.firm)) &&
    (f.diff === "all" || String(q.diff) === f.diff) &&
    (f.status === "all" || questionStatus(q) === f.status)
  );
  $("#bankCount").textContent = list.length + " question" + (list.length === 1 ? "" : "s");
  const ICONS = { new: "·", weak: "↻", done: "✓" };
  const COLORS = { new: "var(--ink-muted)", weak: "var(--warning)", done: "var(--good)" };
  $("#qList").innerHTML = list.map(q => {
    const st = questionStatus(q);
    const [cls, lbl] = DIFF_LABEL[q.diff];
    return `<div class="qrow" data-q="${q.id}">
      <div class="status-ic" style="color:${COLORS[st]}">${ICONS[st]}</div>
      <div>
        <div class="q-title">${esc(q.title)}</div>
        <div class="q-tags">
          <span class="badge">${topicById(q.topic).icon} ${esc(topicById(q.topic).name.split("·")[0].trim())}</span>
          ${q.firms.slice(0,3).map(fid => `<span class="badge firm">${esc(firmById(fid).name)}</span>`).join("")}
          ${q.ans ? "" : `<span class="badge">discussion</span>`}
        </div>
      </div>
      <div class="q-right"><span class="badge ${cls}">${lbl}</span></div>
    </div>`;
  }).join("") || `<div class="muted" style="padding:30px;text-align:center">No questions match these filters.</div>`;
  $$("#qList .qrow").forEach(r => r.addEventListener("click", () => openQuestion(r.dataset.q)));
}

function openQuestion(qid) {
  const q = QUESTIONS.find(x => x.id === qid);
  const [cls, lbl] = DIFF_LABEL[q.diff];
  const st = state.qstats[q.id] || { att: 0, ok: false, first: false };
  const ansBlock = q.ans ? `
    <div class="ans-card" id="ansCard">
      <label>Your answer — ${esc(q.ans.label || "final value")}</label>
      ${st.ok ? `
        <div class="mt8"><span class="solved-chip">✓ Solved${st.first ? " on the first try" : ""}</span>
        <span class="muted small"> · reference: ${esc(fmtExpected(q.ans))}</span></div>` : `
        <div class="ans-row2">
          <input type="text" id="ansIn" placeholder="e.g. 2/11, 0.18, 18%, 4.2M" autocomplete="off">
          <button class="btn primary" id="ansCheck">Check</button>
        </div>
        <div class="ans-fb" id="ansFb"></div>
        <div class="small muted mt8">${st.att ? st.att + " attempt" + (st.att > 1 ? "s" : "") + " so far · " : ""}accepts fractions, decimals, %, and k/M/B suffixes</div>`}
    </div>` : `
    <div class="ans-card"><label>Discussion question</label>
      <div class="small mt8" style="color:var(--ink-2)">No single number to check — talk your answer out loud (seriously: out loud), then open the solution and self-rate against it. Structure &gt; conclusion.</div>
    </div>`;
  $("#qModal").innerHTML = `
    <div class="row spread">
      <div class="row" style="gap:8px">
        <span class="badge">${topicById(q.topic).icon} ${esc(topicById(q.topic).name)}</span>
        <span class="badge ${cls}">${lbl}</span>
        ${q.firms.map(fid => `<span class="badge firm">${esc(firmById(fid).name)}</span>`).join("")}
      </div>
      <button class="btn sm ghost" id="qClose">✕ close</button>
    </div>
    <h2 class="mt16">${esc(q.title)}</h2>
    <div class="q-body">${esc(q.prompt)}</div>
    ${ansBlock}
    <div class="reveal-box" id="hintBox"><button>💡 Show hint</button>
      <div class="reveal-content">${esc(q.hint)}</div></div>
    <div class="reveal-box" id="solBox"><button>📖 Show solution</button>
      <div class="reveal-content">${esc(q.solution)}</div></div>
    <div class="rate-row">
      <span class="muted small">Self-rate the solve:&nbsp;</span>
      <button class="btn sm" data-rate="1" style="border-color:rgba(208,59,59,.6)">Again</button>
      <button class="btn sm" data-rate="2" style="border-color:rgba(250,178,25,.5)">Hard</button>
      <button class="btn sm" data-rate="3" style="border-color:rgba(12,163,12,.5)">Good</button>
      <button class="btn sm" data-rate="4" style="border-color:rgba(12,163,12,.8)">Easy</button>
      <span class="small muted" id="rateEcho">${state.ratings[q.id] ? "rated " + ["","Again","Hard","Good","Easy"][state.ratings[q.id]] : ""}</span>
    </div>`;
  $("#qModalScrim").classList.add("open");
  $("#qClose").addEventListener("click", closeQuestion);
  $$("#qModal .reveal-box > button").forEach(b =>
    b.addEventListener("click", () => b.parentElement.classList.toggle("open")));
  $$("#qModal [data-rate]").forEach(b => b.addEventListener("click", () => {
    state.ratings[q.id] = +b.dataset.rate;
    $("#rateEcho").textContent = "rated " + ["","Again","Hard","Good","Easy"][+b.dataset.rate];
    logEvent("q", q.id, +b.dataset.rate >= 3);
    updatePill(); Store.save(); renderQList();
  }));
  const checkBtn = $("#ansCheck");
  if (checkBtn) {
    const doCheck = () => {
      const raw = $("#ansIn").value;
      if (!raw.trim()) return;
      const s = state.qstats[q.id] || (state.qstats[q.id] = { att: 0, ok: false, first: false });
      const res = checkAnswer(q.ans, raw);
      const fb = $("#ansFb");
      if (res.verdict === "invalid") {
        fb.className = "ans-fb near";
        fb.textContent = "Couldn't parse that — try a plain number, a fraction like 2/11, a percent like 18%, or 4.2M.";
        return;
      }
      s.att++;
      if (res.verdict === "ok") {
        s.ok = true; s.first = s.att === 1;
        logEvent("q", q.id, true);
        fb.className = "ans-fb good";
        fb.textContent = s.first
          ? "✓ Correct, first try. Read the solution anyway — the method matters as much as the number."
          : `✓ Correct (attempt ${s.att}). Open the solution and make sure your path was the clean one.`;
        $("#solBox").classList.add("open");
        updatePill(); Store.save(); renderQList();
        setTimeout(() => openQuestion(qid), 900);
      } else if (res.verdict === "near") {
        logEvent("q", q.id, false);
        fb.className = "ans-fb near";
        fb.textContent = "Close but outside tolerance — check rounding, sign, or whether they asked for a probability vs a percent.";
        Store.save();
      } else {
        logEvent("q", q.id, false);
        fb.className = "ans-fb bad";
        fb.textContent = s.att === 1
          ? "✗ Not it. Re-read the prompt for the trap, or take the hint."
          : "✗ Still off. This one's now in your review queue — take the hint, or study the solution and come back tomorrow.";
        Store.save(); renderQList();
      }

function topicSkill(tid) {
  const qs = QUESTIONS.filter(q => q.topic === tid);
  let sum = 0, n = 0, attempted = 0;
  for (const q of qs) {
    const st = state.qstats[q.id];
    const r = state.ratings[q.id] || 0;
    let sig = null;
    if (st && st.att > 0) sig = st.ok ? (st.first ? 1 : 0.7) : 0.12;
    if (r) sig = Math.max(sig ?? 0, [0, 0.1, 0.45, 0.85, 1][r]);
    if (sig !== null) { sum += sig; n++; attempted++; }
  }
  return { score: n ? sum / n : null, attempted, total: qs.length };
}

function relTime(t) {
  const d = Date.now() - t;
  if (d < 60e3) return "just now";
  if (d < 3600e3) return Math.floor(d / 60e3) + "m ago";
  if (d < 86400e3) return Math.floor(d / 3600e3) + "h ago";
  return Math.floor(d / 86400e3) + "d ago";
}

const PETS_SETUP = `
def _make_pets():
    rng = np.random.default_rng(7)
    n = 400
    species = rng.choice(['dog', 'cat', 'bird'], n, p=[.5, .4, .1])
    variants = {'dog': ['dog','Dog','DOG'], 'cat': ['cat','Cat','CAT'], 'bird': ['bird','Bird','BIRD']}
    disp = [variants[s][rng.integers(0, 3)] for s in species]
    age = rng.integers(1, 15, n).astype(float)
    weight = np.where(species == 'dog', rng.normal(25, 8, n), np.where(species == 'cat', rng.normal(4.5, 1, n), rng.normal(0.4, 0.1, n)))
    base = np.array([{'dog': 320, 'cat': 180, 'bird': 90}[s] for s in species])
    y1 = np.clip(base + 12 * age + rng.normal(0, 60, n), 0, None).round(0)
    y2 = np.clip(0.6 * y1 + 0.4 * (base + 12 * age) + rng.normal(0, 50, n), 0, None).round(0)
    df = pd.DataFrame({'pet_id': np.arange(n), 'species': disp, 'age_years': age,
                       'weight_kg': weight.round(1), 'y1_claims': y1, 'y2_claims': y2})
    bad_age = rng.choice(n, 40, replace=False); df.loc[bad_age, 'age_years'] = -1.0
    bad_w = rng.choice(n, 30, replace=False); df.loc[bad_w, 'weight_kg'] = np.nan
    bad_y1 = rng.choice(n, 25, replace=False); df.loc[bad_y1, 'y1_claims'] = np.nan
    train = df[df['pet_id'] < 320].copy()
    test = df[df['pet_id'] >= 320].copy()
    truth = test['y2_claims'].to_numpy()
    test = test.drop(columns=['y2_claims'])
    dup = train.sample(15, random_state=3)
    train = pd.concat([train, dup], ignore_index=True).sample(frac=1, random_state=4).reset_index(drop=True)
    return train, test, truth

PETS_TRAIN, PETS_TEST, _PETS_TRUTH = _make_pets()
PETS_NAIVE_MAE = float(np.mean(np.abs(_PETS_TRUTH - PETS_TRAIN['y2_claims'].mean())))

def pets_mae(fn):
    preds = np.asarray(fn(PETS_TRAIN.copy(), PETS_TEST.copy()), dtype=float)
    assert len(preds) == len(PETS_TEST), "prediction length mismatch"
    return float(np.mean(np.abs(preds - _PETS_TRUTH)))
`;

def _make_ticks():
    rng = np.random.default_rng(11)
    n = 500
    t = np.sort(rng.integers(0, 3000, n))
    px = 100 + np.cumsum(rng.normal(0, 0.05, n))
    sz = rng.integers(1, 100, n).astype(float)
    df = pd.DataFrame({'t': t, 'px': px.round(2), 'sz': sz})

    df.loc[ff, 'px'] = df.loc[ff, 'px'] * 100
    dup = df.sample(20, random_state=5)
    df = pd.concat([df, dup], ignore_index=True).sample(frac=1, random_state=9).reset_index(drop=True)
    return df

TICKS = _make_ticks()

const RENT_SETUP = `
def _make_rent():
    rng = np.random.default_rng(21)
    n = 500
    nb = rng.choice(['downtown', 'midtown', 'uptown', 'suburbs'], n, p=[.3, .3, .2, .2])
    mess = {'downtown': ['downtown','Downtown',' DOWNTOWN'], 'midtown': ['midtown','Midtown ','MIDTOWN'],
            'uptown': ['uptown','Uptown','UPTOWN '], 'suburbs': ['suburbs',' Suburbs','SUBURBS']}
    nb_disp = [mess[x][rng.integers(0, 3)] for x in nb]
    sqft = np.clip(rng.normal(850, 280, n), 320, 2200).round(0)
    beds = np.clip((sqft / 420 + rng.normal(0, 0.5, n)).round(0), 0, 4)
    park_true = rng.random(n) < 0.4
    pk = np.array(['yes', 'no'])[(~park_true).astype(int)]
    pk = np.array([{'yes': ['yes','Y','YES'], 'no': ['no','N','NO']}[p][rng.integers(0, 3)] for p in pk], dtype=object)
    base = np.array([{'downtown': 1900, 'midtown': 1550, 'uptown': 1300, 'suburbs': 950}[x] for x in nb])
    rent = (base + 2.1 * sqft + 140 * beds + 300 * park_true + rng.normal(0, 130, n)).round(0)
    df = pd.DataFrame({'apt_id': np.arange(n), 'neighborhood': nb_disp, 'sqft': sqft, 'beds': beds, 'parking': pk, 'rent': rent})
    z = rng.choice(n, 35, replace=False); df.loc[z, 'sqft'] = 0.0
    pn = rng.choice(n, 30, replace=False); df.loc[pn, 'parking'] = None
    train = df[df['apt_id'] < 400].copy()
    test = df[df['apt_id'] >= 400].copy()
    truth = test['rent'].to_numpy()
    test = test.drop(columns=['rent'])
    return train, test, truth

RENT_TRAIN, RENT_TEST, _RENT_TRUTH = _make_rent()
RENT_NAIVE_MAE = float(np.mean(np.abs(_RENT_TRUTH - RENT_TRAIN['rent'].mean())))

def rent_mae(fn):
    preds = np.asarray(fn(RENT_TRAIN.copy(), RENT_TEST.copy()), dtype=float)
    assert len(preds) == len(RENT_TEST), "prediction length mismatch"
    return float(np.mean(np.abs(preds - _RENT_TRUTH)))
`;

    low, high, out = [], [], []    # low: max-heap (negated), high: min-heap
    for x in nums:

  solution:`import heapq

def match_orders(events):
    bids, asks, seq, trades = [], [], 0, []      # heaps: (key, seq, [qty], px)
    for side, px, qty in events:
        seq += 1
        if side == 'B':
            while qty > 0 and asks and asks[0][3] <= px:
                q = min(qty, asks[0][2][0])
                trades.append([asks[0][3], q])
                qty -= q; asks[0][2][0] -= q
                if asks[0][2][0] == 0: heapq.heappop(asks)
            if qty > 0: heapq.heappush(bids, (-px, seq, [qty], px))
        else:
            while qty > 0 and bids and bids[0][3] >= px:
                q = min(qty, bids[0][2][0])
                trades.append([bids[0][3], q])
                qty -= q; bids[0][2][0] -= q
                if bids[0][2][0] == 0: heapq.heappop(bids)
            if qty > 0: heapq.heappush(asks, (px, seq, [qty], px))
    return trades
`,

Target: O(n) time, O(1) space with two pointers (the O(n)-space prefix-max version is a warmup; say both).`,

    "if left_max <= right_max: water += left_max − h[l] (if positive); advance l. Mirror on the right."],

  starter:`def trap(height):

`,
  solution:`def trap(height):
    l, r = 0, len(height) - 1
    lmax = rmax = water = 0
    while l < r:
        if height[l] < height[r]:
            lmax = max(lmax, height[l])
            water += lmax - height[l]
            l += 1
        else:
            rmax = max(rmax, height[r])
            water += rmax - height[r]
            r -= 1
    return water

  desc:`n tasks labeled 0…n−1; prereqs is a list of [a, b] meaning "b must run before a". Return True iff all tasks can be completed (i.e., the dependency graph has no cycle).

Example: n=2, [[1,0]] → True   ·   n=2, [[1,0],[0,1]] → False

Target: topological sort (Kahn's) or DFS coloring. Dependency-graph cycle detection shows up constantly in build systems and pricing-graph questions at Jump.`,
  hints:[

    "Kahn's algorithm: repeatedly remove nodes with in-degree 0. If you can remove all n, no cycle.",
    "Build adjacency + indegree arrays; BFS from all indegree-0 nodes; count processed == n."],
  review:[],
  starter:`from collections import deque

def can_finish(n, prereqs):
    pass
`,
  solution:`from collections import deque

def can_finish(n, prereqs):
    adj = [[] for _ in range(n)]
    indeg = [0] * n
    for a, b in prereqs:
        adj[b].append(a)
        indeg[a] += 1
    q = deque(i for i in range(n) if indeg[i] == 0)
    seen = 0
    while q:
        u = q.popleft(); seen += 1
        for v in adj[u]:
            indeg[v] -= 1
            if indeg[v] == 0: q.append(v)
    return seen == n
`,

        return d
    tr = clean(train.drop_duplicates(subset='pet_id'))
    te = clean(test)
    D = pd.get_dummies(tr['species'])
    X = np.column_stack([np.ones(len(tr)), tr['age_years'], tr['y1_claims'], D.to_numpy(dtype=float)])
    beta, *_ = np.linalg.lstsq(X, tr['y2_claims'].to_numpy(), rcond=None)
    Dt = pd.get_dummies(te['species']).reindex(columns=D.columns, fill_value=0)
    Xt = np.column_stack([np.ones(len(te)), te['age_years'], te['y1_claims'], Dt.to_numpy(dtype=float)])
    return (Xt @ beta).tolist()

const Runtime = {
  pyodide: null, loading: null, pandasReady: false, source: null,
  CANDIDATES: [
    { indexURL: "https://cdn.jsdelivr.net/pyodide/v0.26.4/full/" },
    { indexURL: "https://cdnjs.cloudflare.com/ajax/libs/pyodide/0.26.4/" },
    { indexURL: "https://cdnjs.cloudflare.com/ajax/libs/pyodide/0.24.1/" },
  ],
  loadScript(src) {
    return new Promise((res, rej) => {
      const s = document.createElement("script");
      s.src = src; s.onload = res; s.onerror = () => rej(new Error("script load failed: " + src));
      document.head.appendChild(s);
    });
  },
  async init(statusCb) {
    if (this.pyodide) return this.pyodide;
    if (this.loading) return this.loading;
    this.loading = (async () => {
      let lastErr;
      for (const c of this.CANDIDATES) {
        try {
          statusCb("loading Python runtime… (" + new URL(c.indexURL).host + ")");
          await this.loadScript(c.indexURL + "pyodide.js");
          this.pyodide = await loadPyodide({ indexURL: c.indexURL });
          this.source = c.indexURL;
          return this.pyodide;
        } catch (e) { lastErr = e; }
      }
      throw lastErr || new Error("no pyodide source reachable");
    })();
    try { return await this.loading; } finally { this.loading = null; }
  },
  async ensurePandas(statusCb) {
    if (this.pandasReady) return true;
    statusCb("loading pandas + numpy (~15 MB, one time)…");
    try { await this.pyodide.loadPackage(["numpy", "pandas"]); this.pandasReady = true; return true; }
    catch (e) { return false; }
  },
};

function buildRunnerScript(userCode, tests, needPandas, setup) {
  return `
import json, math, io, contextlib
def _deep_eq(a, b):
    if isinstance(a, bool) or isinstance(b, bool):
        return a == b
    if isinstance(a, (int, float)) and isinstance(b, (int, float)):
        return math.isclose(float(a), float(b), rel_tol=1e-6, abs_tol=1e-9)
    if isinstance(a, (list, tuple)) and isinstance(b, (list, tuple)):
        return len(a) == len(b) and all(_deep_eq(x, y) for x, y in zip(a, b))
    if isinstance(a, dict) and isinstance(b, dict):
        return set(a) == set(b) and all(_deep_eq(a[k], b[k]) for k in a)
    return a == b

_g = {}
${needPandas ? 'exec("import pandas as pd\\nimport numpy as np", _g)' : ""}
_setup = ${JSON.stringify(setup || "")}
_src = ${JSON.stringify(userCode)}
_tests = json.loads(${JSON.stringify(JSON.stringify(tests.map(t => ({ call: t.call, expected: t.expected }))))})
_results = []
_err = None
try:
    if _setup:
        exec(_setup, _g)
except Exception as e:
    _err = "problem setup failed: " + type(e).__name__ + ": " + str(e)
if _err is None:
    try:
        exec(_src, _g)
    except Exception as e:
        _err = type(e).__name__ + ": " + str(e)
if _err is None:
    for _t in _tests:
        _buf = io.StringIO()
        try:
            with contextlib.redirect_stdout(_buf):
                _got = eval(_t["call"], _g)
                _exp = eval(_t["expected"], _g)
            _results.append({"ok": bool(_deep_eq(_got, _exp)), "got": repr(_got)[:300], "exp": repr(_exp)[:300], "out": _buf.getvalue()[:800]})
        except Exception as e:
            _results.append({"ok": False, "got": type(e).__name__ + ": " + str(e), "exp": _t["expected"], "out": _buf.getvalue()[:800]})
json.dumps({"error": _err, "results": _results})
`;
}

/* ============================================================
   DESK COACH — offline hints/lint/review + optional Claude API
   ============================================================ */
const Coach = {
  apiKey: null, model: "claude-sonnet-4-5", histories: {}, hintIdx: {}, busy: false,

  hist(pid) { return this.histories[pid] || (this.histories[pid] = []); },

  push(pid, role, text) {
    this.hist(pid).push({ role, text });
    this.renderLog(pid);
  },

  renderLog(pid) {
    const log = $("#coachLog"); if (!log) return;
    const h = this.hist(pid);
    log.innerHTML = h.length ? h.map(m =>
      `<div class="chat-msg ${m.role === "user" ? "me" : "coach"}"><div class="who">${m.role === "user" ? "you" : "coach"}</div><div class="body">${esc(m.text)}</div></div>`
    ).join("") : `<div class="muted small" style="padding:8px">Ask anything — syntax, approach, "why does my test fail". Use <b>Hint</b> for a staged nudge, <b>Review</b> for a checklist pass on your current code.</div>`;
    log.scrollTop = log.scrollHeight;
  },

  statusLabel() { return this.apiKey ? "Claude connected" : (window.claude && window.claude.complete) ? "Claude (built-in)" : "offline coach"; },

  giveHint(p) {
    const i = this.hintIdx[p.id] || 0;
    if (i < p.hints.length) {
      this.hintIdx[p.id] = i + 1;
      this.push(p.id, "coach", `Hint ${i + 1}/${p.hints.length}: ${p.hints[i]}`);
    } else {
      this.push(p.id, "coach", "That was the last hint. The reference solution is in the panel below the tests — read it, then rewrite it from memory; that's the drill that sticks.");
    }
  },

  reviewCode(p, code, lastResults) {
    if (code.trim() === p.starter.trim()) {
      this.push(p.id, "coach", "That's still the starter template — nothing to review yet. Sketch your approach in code (even pseudocode-ish) and I'll critique it, or hit 💡 Hint to get moving.");
      return;
    }
    const notes = [];
    if (!new RegExp("def\\s+" + this.fnName(p) + "\\s*\\(").test(code)) {
      notes.push(`I don't see \`def ${this.fnName(p)}(…)\` — the tests call exactly that name.`);
    }
    for (const r of (p.review || [])) {
      if (!new RegExp(r.re, "i").test(code)) notes.push(r.miss);
    }
    if (/\.iterrows\(/.test(code)) notes.push("iterrows() spotted — in an interview, vectorize it; row loops in pandas are what the screen is screening for.");
    if (p.mode === "data" && /for .* in .*range\(len/.test(code)) notes.push("Indexed row loop over the frame — try a vectorized or groupby formulation.");
    if (!/return/.test(code)) notes.push("No return statement yet.");
    if (lastResults && lastResults.failed > 0) notes.push(`Last run: ${lastResults.passed}/${lastResults.total} tests passed — look at the first failing 'got vs expected' pair; it usually names the bug.`);
    this.push(p.id, "coach", notes.length
      ? "Code review:\n• " + notes.join("\n• ")
      : "Structurally this looks on track — the ingredients I'd expect are all present. Run the tests; if something fails, bring me the got-vs-expected diff.");
  },

  fnName(p) { const m = p.starter.match(/def\s+(\w+)/); return m ? m[1] : "solve"; },

  KB: [
    { re: /group\s*by|groupby/i, a: "groupby patterns:\ndf.groupby('key')['col'].mean() → per-group stat\ndf.groupby('key')['col'].transform('median') → same length as df, great for imputation\ng = df.groupby('key').agg(n=('col','size'), avg=('col','mean'))" },
    { re: /merge|join/i, a: "df.merge(other, on='key', how='left') — how ∈ {left, inner, outer}. Column mismatch after merge is usually a dtype or whitespace issue in the key: check .str.strip() first." },
    { re: /dumm|one.?hot|categor/i, a: "pd.get_dummies(s) one-hots a Series. The interview trap: test data may lack some categories — align with .reindex(columns=train_dummies.columns, fill_value=0)." },
    { re: /lstsq|regress|linear|fit\b/i, a: "No sklearn needed:\nX = np.column_stack([np.ones(n), f1, f2, dummies])\nbeta, *_ = np.linalg.lstsq(X, y, rcond=None)\npreds = X_test @ beta\nRemember the intercept column of ones." },
    { re: /fillna|impute|missing|nan/i, a: "s.fillna(value) or s.fillna(s.median()). Group-aware: s.fillna(df.groupby('k')[col].transform('median')). Sentinels (−1, 0, −999) must be converted to NaN FIRST: d.loc[d.age < 0, 'age'] = np.nan." },
    { re: /duplicate|dedup/i, a: "df.drop_duplicates() → exact row dupes; df.drop_duplicates(subset='id', keep='first') → entity dupes. Do it before any aggregation or the dupes bias your stats." },
    { re: /rolling|moving avg|sma/i, a: "df['x'].rolling(w).mean() — NaN until the window fills; add min_periods=1 to change that. .rolling(w).max(), .std() etc. all exist." },
    { re: /heap|priority/i, a: "import heapq — min-heap only. Max-heap: push negated values. heappush(h, x), heappop(h), h[0] peeks. For (priority, tiebreak) push tuples — that's how you get price-time priority." },
    { re: /deque/i, a: "from collections import deque — O(1) append/pop at BOTH ends: append, appendleft, pop, popleft. It's the backbone of sliding-window-max and BFS." },
    { re: /sort/i, a: "sorted(xs, key=lambda t: (t[0], -t[1])) for multi-key. list.sort() is in-place. For 'best price then earliest time', sort by (price, seq) or use a heap with that tuple." },
    { re: /pct_change|return/i, a: "df['close'].pct_change() → simple returns (NaN first row). Log returns: np.log(df.close).diff()." },
    { re: /apply\b/i, a: ".apply(f) runs Python per row/element — slow and usually avoidable. Prefer vectorized ops, .map for dict lookups, np.where / np.select for conditionals." },
  ],

  offlineReply(p, msg) {
    const m = msg.toLowerCase();
    if (/hint|stuck|help me|where do i start|idk/.test(m)) { this.giveHint(p); return null; }
    if (/review|feedback|look at my|check my/.test(m)) { this.reviewCode(p, $("#codeArea").value, Coding.lastResults[p.id]); return null; }
    if (/solution|answer|give up/.test(m)) return "The full reference solution is in the collapsible panel under the test results. Honest advice: take one more hint first — you learn 5× more finishing it yourself.";
    for (const k of this.KB) if (k.re.test(m)) return k.a;
    return "Offline coach here — I can do staged hints (button above), a checklist review of your code, and syntax help (ask about: groupby, merge, dummies, lstsq, fillna, duplicates, rolling, heaps, deque, sorting). For free-form conversation, click ⚙ and connect a Claude API key — it stays in memory only and talks straight to api.anthropic.com from your browser.";
  },

  async claudeReply(p, msg) {
    const code = $("#codeArea").value;
    const lastR = Coding.lastResults[p.id];
    const sys = `You are Desk Coach, a quant-interview coding coach inside a practice app. Be Socratic and concise (<150 words): nudge toward the answer, name the concept, show at most 1-3 line snippets. Only give a full solution if the user explicitly insists after you've offered a hint. Problem "${p.title}":\n${p.desc}\n\nUser's current code:\n${code}\n\nLatest test results: ${lastR ? `${lastR.passed}/${lastR.total} passed. Failures: ${lastR.failSummary}` : "not run yet"}`;
    const messages = this.hist(p.id).slice(-12).map(m => ({ role: m.role === "user" ? "user" : "assistant", content: m.text }));
    if (!messages.length || messages[messages.length - 1].role !== "user") messages.push({ role: "user", content: msg });
    if (this.apiKey) {
      const r = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: {
          "content-type": "application/json",
          "x-api-key": this.apiKey,
          "anthropic-version": "2023-06-01",
          "anthropic-dangerous-direct-browser-access": "true",
        },
        body: JSON.stringify({ model: this.model, max_tokens: 700, system: sys, messages }),
      });
      if (!r.ok) throw new Error("API " + r.status + ": " + (await r.text()).slice(0, 160));
      const data = await r.json();
      return data.content.map(c => c.text || "").join("");
    }
    if (window.claude && window.claude.complete) {
      return await window.claude.complete(sys + "\n\nConversation:\n" + messages.map(m => m.role + ": " + m.content).join("\n") + "\nassistant:");
    }
    throw new Error("no engine");
  },

  async send(p, msg) {
    if (!msg.trim() || this.busy) return;
    this.push(p.id, "user", msg.trim());
    const hasAI = this.apiKey || (window.claude && window.claude.complete);
    if (!hasAI) {
      const reply = this.offlineReply(p, msg);
      if (reply) this.push(p.id, "coach", reply);
      return;
    }
    this.busy = true;
    this.push(p.id, "coach", "…");
    try {
      const reply = await this.claudeReply(p, msg);
      this.hist(p.id).pop();
      this.push(p.id, "coach", reply);
    } catch (e) {
      this.hist(p.id).pop();
      this.push(p.id, "coach", "API call failed (" + e.message + "). Falling back to offline mode — check the key in ⚙, and note browser keys need an Anthropic key with CORS access enabled.");
    } finally { this.busy = false; }
  },

  /* ---- live lint ---- */
  lintTimer: null,
  scheduleLint(p) {
    clearTimeout(this.lintTimer);
    this.lintTimer = setTimeout(() => this.lint(p), 900);
  },
  async lint(p) {
    const strip = $("#lintStrip"); if (!strip) return;
    const code = $("#codeArea").value;
    if (!code.trim()) { strip.textContent = "live review: waiting for code…"; strip.className = "lint-strip"; return; }
    const notes = [];
    if (Runtime.pyodide) {
      try {
        const res = await Runtime.pyodide.runPythonAsync(
          `import json\ntry:\n    compile(${JSON.stringify(code)}, "solution.py", "exec")\n    _r = {"ok": True}\nexcept SyntaxError as e:\n    _r = {"ok": False, "line": e.lineno, "msg": e.msg}\njson.dumps(_r)`);
        const r = JSON.parse(res);
        if (!r.ok) { strip.textContent = `✗ SyntaxError line ${r.line}: ${r.msg}`; strip.className = "lint-strip bad"; return; }
        notes.push("✓ parses");
      } catch (e) { notes.push("lint unavailable"); }
    } else {
      for (const [o, c] of [["(", ")"], ["[", "]"], ["{", "}"]]) {
        const no = code.split(o).length, nc = code.split(c).length;
        if (no !== nc) notes.push(`⚠ unbalanced ${o}${c}`);
      }
      if (!notes.length) notes.push("✓ basic checks (full syntax check after first run loads Python)");
    }
    if (!new RegExp("def\\s+" + this.fnName(p) + "\\s*\\(").test(code)) notes.push(`⚠ tests call ${this.fnName(p)}() — not defined yet`);
    if (/\.iterrows\(/.test(code)) notes.push("⚠ iterrows() — vectorize");
    strip.textContent = "live review: " + notes.join(" · ");
    strip.className = "lint-strip" + (notes.some(n => n.startsWith("⚠")) ? " warn" : " ok");
  },
};

const Coding = {
  mode: "algo", selected: null, drafts: {}, lastResults: {},
  render() {
    const el = $("#view-coding");
    if (!el.dataset.built) {
      el.dataset.built = "1";
      el.innerHTML = `
        <div class="row spread">
          <div>
            <h1>Coding</h1>
            <p class="lede"><b>Algorithms</b> is the HRT/Jump screen — the hard ones (matching engine, running median) are the real thing.
            <b>Data &amp; ML</b> is the research screen: preloaded messy datasets you clean, model, and get graded on by held-out MAE.
            Real Python runs in your browser, and the Desk Coach watches your code as you type.</p>
          </div>
          <div class="mode-switch" id="modeSwitch">
            <button data-mode="algo" class="active">Algorithms</button>
            <button data-mode="data">Data &amp; ML</button>
          </div>
        </div>
        <div class="code-layout">
          <div class="prob-list" id="probList"></div>
          <div id="probPane"></div>
        </div>`;
      $("#modeSwitch").addEventListener("click", e => {
        const b = e.target.closest("button"); if (!b) return;
        this.mode = b.dataset.mode;
        this.selected = null;
        this.render();
      });
    }
    $$("#modeSwitch button").forEach(x => x.classList.toggle("active", x.dataset.mode === this.mode));
    this.renderList(); this.renderPane();
  },
  renderList() {
    const probs = CODING_PROBLEMS.filter(p => p.mode === this.mode);
    if (!this.selected || !probs.find(p => p.id === this.selected)) this.selected = probs[0].id;
    $("#probList").innerHTML = probs.map(p => {
      const st = state.codingStatus[p.id];
      const [cls, lbl] = DIFF_LABEL[p.diff];
      return `<div class="prob-item ${p.id === this.selected ? "sel" : ""}" data-p="${p.id}">
        <div class="p-name"><span>${st === "passed" ? "✓ " : ""}${esc(p.title)}</span><span class="badge ${cls}">${lbl}</span></div>
      </div>`;
    }).join("");
    $$("#probList .prob-item").forEach(i => i.addEventListener("click", () => {
      this.saveDraft(); this.selected = i.dataset.p; this.renderList(); this.renderPane();
    }));
  },
  saveDraft() {
    const ta = $("#codeArea");
    if (ta && this.selected) this.drafts[this.selected] = ta.value;
  },
  renderPane() {
    const p = CODING_PROBLEMS.find(x => x.id === this.selected);
    const visible = p.tests.filter(t => t.show);
    const hiddenCount = p.tests.length - visible.length;
    $("#probPane").innerHTML = `
      <div class="card">
        <div class="row spread"><h2>${esc(p.title)}</h2><span class="runner-status" id="runStatus">${Runtime.pyodide ? "python ready" : "python loads on first run"}</span></div>
        <div class="mt8" style="color:var(--ink-2); white-space:pre-line; font-size:14px">${esc(p.desc)}</div>
        <div class="mt16 small muted">Visible tests${hiddenCount ? ` (+${hiddenCount} hidden)` : ""}:</div>
        <pre class="io mt8">${visible.map(t => esc(t.label ? t.label + ":  " + t.call : t.call) + "  →  " + esc(t.expected)).join("\n")}</pre>
        <div class="editor-wrap mt16">
          <div class="editor-head">
            <span class="small muted mono">solution.py</span>
            <div class="row" style="gap:8px">
              <button class="btn sm ghost" id="btnReset">reset</button>
              <button class="btn sm primary" id="btnRun">▶ Run tests</button>
            </div>
          </div>
          <textarea class="code" id="codeArea" spellcheck="false">${esc(this.drafts[p.id] ?? p.starter)}</textarea>
          <div class="lint-strip" id="lintStrip">live review: waiting for code…</div>
        </div>
        <div class="test-results" id="testResults"></div>
        <div class="reveal-box mt16" id="refBox"><button>📖 Reference solution</button>
          <div class="reveal-content"><pre class="io">${esc(p.solution)}</pre></div></div>

        <div class="coach-card mt16">
          <div class="row spread">
            <h3>🎧 Desk Coach <span class="badge" id="coachStatus">${Coach.statusLabel()}</span></h3>
            <div class="row" style="gap:6px">
              <button class="btn sm" id="coachHint">💡 Hint</button>
              <button class="btn sm" id="coachReview">🔍 Review my code</button>
              <button class="btn sm ghost" id="coachGear">⚙</button>
            </div>
          </div>
          <div class="coach-settings hidden" id="coachSettings">
            <div class="row" style="gap:8px">
              <input type="text" id="apiKeyIn" placeholder="sk-ant-… (Anthropic API key, kept in memory only)" style="flex:1; min-width:220px" value="${Coach.apiKey || ""}">
              <select id="modelSel">
                <option value="claude-sonnet-4-5" ${Coach.model === "claude-sonnet-4-5" ? "selected" : ""}>Sonnet (smart)</option>
                <option value="claude-haiku-4-5" ${Coach.model === "claude-haiku-4-5" ? "selected" : ""}>Haiku (fast)</option>
              </select>
              <button class="btn sm primary" id="apiKeySave">Connect</button>
            </div>
            <div class="small muted mt8">Your key is held in this page's memory only (never persisted) and requests go directly from your browser to api.anthropic.com. Leave blank + Connect to disconnect. Without a key you still get hints, live syntax review, and the offline coach.</div>
          </div>
          <div class="chat-log" id="coachLog"></div>
          <div class="row mt8" style="gap:8px">
            <input type="text" id="coachIn" placeholder="Ask the coach… (approach, syntax, why a test fails)" style="flex:1">
            <button class="btn sm primary" id="coachSend">Send</button>
          </div>
        </div>
      </div>`;
    $("#refBox > button").addEventListener("click", () => $("#refBox").classList.toggle("open"));
    $("#btnReset").addEventListener("click", () => { delete this.drafts[p.id]; $("#codeArea").value = p.starter; Coach.scheduleLint(p); });
    $("#btnRun").addEventListener("click", () => this.run(p));
    const ta = $("#codeArea");
    ta.addEventListener("keydown", e => {
      if (e.key === "Tab") {
        e.preventDefault();
        const s = ta.selectionStart;
        ta.value = ta.value.slice(0, s) + "    " + ta.value.slice(ta.selectionEnd);
        ta.selectionStart = ta.selectionEnd = s + 4;
      }
    });
    ta.addEventListener("input", () => Coach.scheduleLint(p));
    /* coach bindings */
    $("#coachHint").addEventListener("click", () => Coach.giveHint(p));
    $("#coachReview").addEventListener("click", () => Coach.reviewCode(p, $("#codeArea").value, this.lastResults[p.id]));
    $("#coachGear").addEventListener("click", () => $("#coachSettings").classList.toggle("hidden"));
    $("#apiKeySave").addEventListener("click", () => {
      Coach.apiKey = $("#apiKeyIn").value.trim() || null;
      Coach.model = $("#modelSel").value;
      $("#coachStatus").textContent = Coach.statusLabel();
      Coach.push(p.id, "coach", Coach.apiKey ? "Claude connected — full conversational coaching is on. Ask me anything about this problem." : "Disconnected — back to the offline coach.");
    });
    const sendMsg = () => { const v = $("#coachIn").value; $("#coachIn").value = ""; Coach.send(p, v); };
    $("#coachSend").addEventListener("click", sendMsg);
    $("#coachIn").addEventListener("keydown", e => { if (e.key === "Enter") sendMsg(); });
    Coach.renderLog(p.id);
    Coach.scheduleLint(p);
  },
  async run(p) {
    this.saveDraft();
    const status = m => { const el = $("#runStatus"); if (el) el.textContent = m; };
    const results = $("#testResults");
    const btn = $("#btnRun");
    btn.disabled = true;
    try {
      await Runtime.init(status);
      const needPandas = p.mode === "data";
      if (needPandas) {
        const ok = await Runtime.ensurePandas(status);
        if (!ok) {
          status("pandas unavailable from this CDN");
          results.innerHTML = `<div class="note">Couldn't fetch the pandas package in this embedded preview (CDN restrictions).
            The pure-Python <b>Algorithms</b> track still runs fine here. To run Data &amp; ML problems, download the file and open it
            in your browser directly — or compare against the reference solution below.</div>`;
          return;
        }
      }
      status("running…");
      const script = buildRunnerScript($("#codeArea").value, p.tests, needPandas, p.setup);
      const raw = await Runtime.pyodide.runPythonAsync(script);
      const data = JSON.parse(raw);
      state.codingAtt[p.id] = (state.codingAtt[p.id] || 0) + 1;
      if (data.error) {
        results.innerHTML = `<div class="tcase fail"><span class="tt">✗ failed to load</span><span>${esc(data.error)}</span></div>`;
        state.codingStatus[p.id] = "attempted";
        this.lastResults[p.id] = { passed: 0, failed: 1, total: p.tests.length, failSummary: data.error };
        logEvent("code", p.id, false); Store.save();
      } else {
        let passed = 0; const failParts = [];
        results.innerHTML = data.results.map((r, i) => {
          if (r.ok) passed++;
          const t = p.tests[i];
          const label = t.show ? esc(t.label || t.call) : (t.label ? esc(t.label) : "hidden test " + (i + 1));
          if (!r.ok) failParts.push(`${t.label || t.call}: got ${r.got} expected ${r.exp}`);
          return `<div class="tcase ${r.ok ? "pass" : "fail"}">
            <span class="tt">${r.ok ? "✓" : "✗"}</span><span>${label}</span>
            ${r.ok ? "" : `<span class="muted">got</span> <span>${esc(r.got)}</span> <span class="muted">expected</span> <span>${esc(r.exp)}</span>`}
            ${r.out ? `<span class="muted">stdout: ${esc(r.out.trim().slice(0, 200))}</span>` : ""}
          </div>`;
        }).join("");
        const all = passed === data.results.length;
        results.innerHTML += `<div class="tcase ${all ? "pass" : "fail"}"><span class="tt">${all ? "✓ ALL TESTS PASSED" : `✗ ${passed}/${data.results.length} passed`}</span></div>`;
        state.codingStatus[p.id] = all ? "passed" : "attempted";
        this.lastResults[p.id] = { passed, failed: data.results.length - passed, total: data.results.length, failSummary: failParts.slice(0, 3).join(" | ") };
        logEvent("code", p.id, all); Store.save();
        status("python ready");
        this.renderList(); updatePill();
      }
    } catch (e) {
      status("runtime unavailable");
      results.innerHTML = `<div class="note">Python runtime couldn't load in this embedded preview (network restrictions on CDN scripts).
        Download the HTML file and open it directly in your browser — the runner and coach lint work there. Meanwhile, write your
        solution and check it against the reference below.</div>`;
    } finally { btn.disabled = false; }
  },
};
/* ============================================================
   TRADING FLOOR — three games
   ============================================================ */
function randn() {
  let u = 0, v = 0;
  while (u === 0) u = Math.random();
  while (v === 0) v = Math.random();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];

function setupCanvas(c, hCss) {
  const dpr = window.devicePixelRatio || 1;
  const w = c.clientWidth || 600;
  c.width = Math.round(w * dpr); c.height = Math.round(hCss * dpr);
  c.style.height = hCss + "px";
  const ctx = c.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return { ctx, w, h: hCss };
}

const Floor = {
  timers: [],
  after(fn, ms) { const id = setTimeout(fn, ms); this.timers.push(id); return id; },
  every(fn, ms) { const id = setInterval(fn, ms); this.timers.push(id); return id; },
  stopAll() { this.timers.forEach(id => { clearTimeout(id); clearInterval(id); }); this.timers = []; },

  renderHub() {

    $("#view-floor").innerHTML = `

          <div class="g-skills"><span class="badge">curve fitting</span><span class="badge">no-arbitrage</span><span class="badge">options</span></div>
        </div>
        <div class="game-card" data-game="fermi">

          <p>A live 3-minute order book on an estimation question, against a crowd of bots — informed, anchored, momentum, noise. Settles at the researched answer.</p>
          <div class="g-skills"><span class="badge">estimation</span><span class="badge">order book</span><span class="badge">price discovery</span></div>

    $$("#view-floor .game-card").forEach(c => c.addEventListener("click", () => {

    }));

  backBtn() { return `<button class="btn sm ghost" id="floorBack">← All games</button>`; },
  bindBack() { $("#floorBack").addEventListener("click", () => this.renderHub()); },
};

const DiceGame = {
  start() {
    Floor.stopAll();
    $("#view-floor").innerHTML = `
      <div class="row spread">${Floor.backBtn()}<span class="muted small">$10 per point of dice sum</span></div>
      <h2 class="mt16">🎲 Dice Market Making</h2>
      <p class="lede">A contract settles to the <b>sum of the dice</b>. Each round you post a bid and an ask; bots trade
      against your quotes. Between rounds, dice are revealed. Some bots have peeked — watch your markouts.</p>
      <div class="card mt16">
        <div class="row" style="gap:16px">
          <div class="quote-field"><label>Difficulty</label>
            <select id="diceLevel">
              <option value="3">Novice — 3 dice</option>
              <option value="5" selected>Desk — 5 dice</option>
              <option value="8">Prop — 8 dice</option>
            </select></div>
          <button class="btn primary" id="diceStart" style="align-self:flex-end">Open the market →</button>

      </div>
